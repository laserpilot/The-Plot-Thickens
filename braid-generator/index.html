          const distToStart = Math.hypot(railStart.x - originPoint.x, railStart.y - originPoint.y);
          const distToEnd = Math.hypot(railEnd.x - originPoint.x, railEnd.y - originPoint.y);
          const invertLanding = distToStart > distToEnd;

          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            const landingT = invertLanding ? t : (1 - t);
            const landingPoint = sampleCurveByArcLength(zigzagRail, zigzagLengths, landingT);

            const midPoint = lerpVector(originPoint, landingPoint, 0.5);
            const outernessFactor = 0.3 + 0.7 * (1 - t);
            const bowAmount = capBowStrength * outernessFactor;
            const controlPoint = {
              x: midPoint.x + bowAmount * Math.cos(angleRad + Math.PI),
              y: midPoint.y + bowAmount * Math.sin(angleRad + Math.PI)
            };

            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'left', points, capEnd: 'end', pairIndex: -1, targetPairIndex: 0, fiberIndex: i });
          }
        }
      } else {
        // Fallback: simple end cap
        const lastPeak = centerExtrema.filter(e => !e.paired).sort((a, b) => b.y - a.y)[0];
        if (lastPeak) {
          const leftEnd = { x: leftSamples[leftSamples.length - 1].x, y: braidLength };
          const spanToEnd = braidLength - lastPeak.y;
          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            const originY = lastPeak.y + spanToEnd * t * 0.2;
            const originPoint = interpolateSamplesAt(centerSamples, originY);
            const landingPoint = lerpVector({ x: leftEnd.x, y: lastPeak.y + spanToEnd * 0.7 }, leftEnd, t);
            const midPoint = lerpVector(originPoint, landingPoint, 0.4);
            const controlPoint = { x: midPoint.x + (landingPoint.x - originPoint.x) * 0.2, y: midPoint.y + spanToEnd * 0.1 };
            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'left', points, capEnd: 'end', pairIndex: -1, targetPairIndex: -1, fiberIndex: i });
          }
        }
      }

      // Right side end cap fibers
      if (useZigzagLanding && centerExtrema.length >= 2) {
        const zA = centerExtrema[rIdx];
        const zB = centerExtrema[rIdx + 1];

        if (zA && zB) {
          const segmentStart = zA.y;
          const segmentEnd = zB.y;
          const zigzagRail = [];
          const numPoints = 20;
          for (let k = 0; k <= numPoints; k++) {
            const segY = segmentStart + (segmentEnd - segmentStart) * (k / numPoints);
            zigzagRail.push(interpolateSamplesAt(centerSamples, segY));
          }
          const zigzagLengths = calculateArcLengths(zigzagRail);

          const originPoint = { x: rightSamples[rightSamples.length - 1].x, y: braidLength }; // R-END

          // Determine landing order
          const railStart = zigzagRail[0];
          const railEnd = zigzagRail[zigzagRail.length - 1];
          const distToStart = Math.hypot(railStart.x - originPoint.x, railStart.y - originPoint.y);
          const distToEnd = Math.hypot(railEnd.x - originPoint.x, railEnd.y - originPoint.y);
          const invertLanding = distToStart > distToEnd;

          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            const landingT = invertLanding ? t : (1 - t);
            const landingPoint = sampleCurveByArcLength(zigzagRail, zigzagLengths, landingT);

            const midPoint = lerpVector(originPoint, landingPoint, 0.5);
            const outernessFactor = 0.3 + 0.7 * (1 - t);
            const bowAmount = capBowStrength * outernessFactor;
            const controlPoint = {
              x: midPoint.x + bowAmount * Math.cos(angleRad),
              y: midPoint.y + bowAmount * Math.sin(angleRad)
            };

            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'right', points, capEnd: 'end', pairIndex: -1, targetPairIndex: 0, fiberIndex: i });
          }
        }
      } else {
        // Fallback: simple end cap
        const lastPeak = centerExtrema.filter(e => !e.paired).sort((a, b) => b.y - a.y)[0];
        if (lastPeak) {
          const rightEnd = { x: rightSamples[rightSamples.length - 1].x, y: braidLength };
          const spanToEnd = braidLength - lastPeak.y;
          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            const originY = lastPeak.y + spanToEnd * t * 0.2;
            const originPoint = interpolateSamplesAt(centerSamples, originY);
            const landingPoint = lerpVector({ x: rightEnd.x, y: lastPeak.y + spanToEnd * 0.7 }, rightEnd, t);
            const midPoint = lerpVector(originPoint, landingPoint, 0.4);
            const controlPoint = { x: midPoint.x + (landingPoint.x - originPoint.x) * 0.2, y: midPoint.y + spanToEnd * 0.1 };
            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'right', points, capEnd: 'end', pairIndex: -1, targetPairIndex: -1, fiberIndex: i });
          }
        }
      }

      return fibers;
    }

    function buildSpoutFibers(centerSamples, backbone, params, warpPoint) {
      const fibers = [];
      const { spoutFiberCount = 5, spoutLength = 50, spoutSpread = 30, spoutGravity = 0.3, spoutAtStart = false } = params;

      if (spoutFiberCount <= 0) return fibers;

      const gravityDir = { x: 0, y: 1 };

      // End spout
      const endPoint = centerSamples[centerSamples.length - 1];
      let endTangent = { x: 0, y: 1 };
      if (backbone) endTangent = normalizeVector(backbone.getTangentAt(1));

      const endDir = normalizeVector(lerpVector(endTangent, gravityDir, spoutGravity));

      for (let i = 0; i < spoutFiberCount; i++) {
        const angleOffset = ((i - (spoutFiberCount - 1) / 2) / Math.max(1, spoutFiberCount - 1)) * spoutSpread;
        const fiberDir = rotateVector(endDir, angleOffset);
        const originPoint = { x: endPoint.x, y: endPoint.y };
        const endPointFiber = { x: originPoint.x + fiberDir.x * spoutLength, y: originPoint.y + fiberDir.y * spoutLength };
        const midPoint = lerpVector(originPoint, endPointFiber, 0.5);
        const perpOffset = (i - (spoutFiberCount - 1) / 2) * 3;
        const controlPoint = { x: midPoint.x - fiberDir.y * perpOffset, y: midPoint.y + fiberDir.x * perpOffset };

        const points = [];
        for (let j = 0; j <= 24; j++) {
          const t = j / 24;
          const point = quadraticPoint(originPoint, controlPoint, endPointFiber, t);
          const warpedOrigin = warpPoint(originPoint);
          const warpBlend = 1 - t;
          const warpedPoint = warpPoint(point);
          points.push({
            x: warpedPoint.x * warpBlend + (warpedOrigin.x + (point.x - originPoint.x)) * (1 - warpBlend),
            y: warpedPoint.y * warpBlend + (warpedOrigin.y + (point.y - originPoint.y)) * (1 - warpBlend)
          });
        }
        fibers.push({ type: 'spout', side: 'center', points, spoutEnd: 'end', pairIndex: -1, targetPairIndex: -1, fiberIndex: i });
      }

      // Start spout (optional)
      if (spoutAtStart) {
        const startPoint = centerSamples[0];
        let startTangent = { x: 0, y: -1 };
        if (backbone) startTangent = normalizeVector({ x: -backbone.getTangentAt(0).x, y: -backbone.getTangentAt(0).y });

        const invertedGravity = { x: 0, y: -1 };
        const startDir = normalizeVector(lerpVector(startTangent, invertedGravity, spoutGravity));

        for (let i = 0; i < spoutFiberCount; i++) {
          const angleOffset = ((i - (spoutFiberCount - 1) / 2) / Math.max(1, spoutFiberCount - 1)) * spoutSpread;
          const fiberDir = rotateVector(startDir, angleOffset);
          const originPoint = { x: startPoint.x, y: startPoint.y };
          const endPointFiber = { x: originPoint.x + fiberDir.x * spoutLength, y: originPoint.y + fiberDir.y * spoutLength };
          const midPoint = lerpVector(originPoint, endPointFiber, 0.5);
          const perpOffset = (i - (spoutFiberCount - 1) / 2) * 3;
          const controlPoint = { x: midPoint.x - fiberDir.y * perpOffset, y: midPoint.y + fiberDir.x * perpOffset };

          const points = [];
          for (let j = 0; j <= 24; j++) {
            const t = j / 24;
            const point = quadraticPoint(originPoint, controlPoint, endPointFiber, t);
            const warpedOrigin = warpPoint(originPoint);
            const warpBlend = 1 - t;
            const warpedPoint = warpPoint(point);
            points.push({
              x: warpedPoint.x * warpBlend + (warpedOrigin.x + (point.x - originPoint.x)) * (1 - warpBlend),
              y: warpedPoint.y * warpBlend + (warpedOrigin.y + (point.y - originPoint.y)) * (1 - warpBlend)
            });
          }
          fibers.push({ type: 'spout', side: 'center', points, spoutEnd: 'start', pairIndex: -1, targetPairIndex: -1, fiberIndex: i });
        }
      }

      return fibers;
    }

    function generateBraid(backbone, params) {
      // Curvature-aware parameters
      const redistributionFactor = params.redistributionFactor ?? 0;
      const curvatureSmoothing = params.curvatureSmoothing ?? 5;

      // Compute backbone arc lengths for frequency adjustment
      const arcLengths = backbone ? computeBackboneArcLengths(backbone) : null;

      // Compute smoothed curvature for redistribution and compression
      const curvatureSamples = backbone
        ? computeBackboneCurvature(backbone, params.braidLength ?? 800, 100, curvatureSmoothing)
        : null;

      const config = {
        frequency: params.frequency ?? 2.25,
        wallFrequency: params.wallFrequency ?? params.frequency ?? 2.25,
        cycleJitter: params.cycleJitter ?? 0,
        zigzagScale: params.zigzagScale ?? 1.0,
        wallScale: params.wallScale ?? 1.0,
        tipTaper: params.tipTaper ?? 0.0,
        tipTaperLength: params.tipTaperLength ?? 50,
        fiberCount: params.fiberCount ?? 10,
        fiberBias: params.fiberBias ?? 0.5,
        fiberLanding: params.fiberLanding ?? 0.0,
        fiberBow: params.fiberBow ?? 0.5,
        bowGradient: params.bowGradient ?? 2.0,
        zigzagPhase: params.zigzagPhase ?? 0,
        leftWallPhase: params.leftWallPhase ?? 0,
        rightWallPhase: params.rightWallPhase ?? 0,
        sampleSpacing: params.sampleSpacing ?? 4,
        continuationLength: params.continuationLength ?? 20,
        continuationBias: params.continuationBias ?? 0.7,
        wallSmooth: params.wallSmooth ?? 1,
        landingSpread: params.landingSpread ?? 1.0,
        fiberJiggle: params.fiberJiggle ?? 0,
        arcTangentBlend: params.arcTangentBlend ?? 0,
        arcLean: params.arcLean ?? 0,
        breakChance: params.breakChance ?? 0,
        breakCoherence: params.breakCoherence ?? 0.5,
        breakGapSize: params.breakGapSize ?? 8,
        wallSeparation: params.wallSeparation ?? 100,
        braidLength: params.braidLength ?? 800,
        fiberSpacing: (params.fiberSpacing ?? 3) * (params.pathScaleFactor ?? 1),
        // Curvature-aware parameters
        arcLengths,
        redistributionFactor,
        curvatureSmoothing,
        insideThinning: params.insideThinning ?? 0,
        // End cap parameters
        enableCaps: params.enableCaps ?? true,
        capFiberCount: params.capFiberCount ?? 8,
        capGatherLength: params.capGatherLength ?? 10,
        capBowAngle: params.capBowAngle ?? 45,
        capLandingDepth: params.capLandingDepth ?? 0.3,
        capBowStrength: params.capBowStrength ?? 1.0,
        // Spout parameters
        spoutFiberCount: params.spoutFiberCount ?? 5,
        spoutLength: params.spoutLength ?? 50,
        spoutSpread: params.spoutSpread ?? 30,
        spoutGravity: params.spoutGravity ?? 0.3,
        spoutAtStart: params.spoutAtStart ?? false,
        // Path scaling
        pathScaleFactor: params.pathScaleFactor ?? 1.0
      };

      const centerSamples = sampleBoundary(generateCenterX, config);
      const leftSamples = sampleBoundary((phaseY, actualY, p) => generateWallX(phaseY, actualY, 'left', p), config);
      const rightSamples = sampleBoundary((phaseY, actualY, p) => generateWallX(phaseY, actualY, 'right', p), config);

      const centerExtrema = detectExtrema(centerSamples).map(ext => ({ ...ext, paired: false }));
      const leftExtrema = detectExtrema(leftSamples).map(ext => ({ ...ext, claimed: false }));
      const rightExtrema = detectExtrema(rightSamples).map(ext => ({ ...ext, claimed: false }));

      const continuationPairs = buildContinuationPairs(leftSamples, rightSamples, centerSamples, centerExtrema, leftExtrema, rightExtrema, config);
      assignSideOrdering(continuationPairs);
      const fiberCurves = buildFiberCurves(continuationPairs, leftSamples, rightSamples, centerSamples, config, curvatureSamples);

      const warpPoint = createWarpFunction(backbone, config.braidLength, curvatureSamples, config);

      const outlines = [];
      outlines.push({ side: 'center', type: 'zigzag', points: centerSamples.map(warpPoint), index: 0 });

      // Apply decimation then fold removal to wall outlines to prevent fold-over on tight curves
      // Decimation thins out bunched points on inside of curves, fold removal handles remaining issues
      const leftWarped = leftSamples.map(warpPoint);
      const rightWarped = rightSamples.map(warpPoint);
      const leftDecimated = decimateInsideCurve(leftWarped, leftSamples, curvatureSamples, config, 'left');
      const rightDecimated = decimateInsideCurve(rightWarped, rightSamples, curvatureSamples, config, 'right');
      // Scale minSpacing for fold removal - wallSmooth reduces spacing for more detail
      const scaledMinSpacing = Math.max(1, (15 * config.pathScaleFactor) / (config.wallSmooth || 1));
      const leftFinal = removeFoldedPoints(leftDecimated, scaledMinSpacing);
      const rightFinal = removeFoldedPoints(rightDecimated, scaledMinSpacing);
      outlines.push({ side: 'left', type: 'wall', points: leftFinal, index: 1 });
      outlines.push({ side: 'right', type: 'wall', points: rightFinal, index: 2 });
      continuationPairs.forEach((pair, idx) => {
        outlines.push({ side: pair.side, type: 'continuation', points: pair.diagRail.map(warpPoint), index: idx + 3 });
      });

      const mainFibers = fiberCurves.map(fiber => ({ ...fiber, type: 'main', points: fiber.points.map(warpPoint) }));

      // Generate cap fibers (if enabled)
      let capFibers = [];
      if (config.enableCaps) {
        const startCapFibers = buildStartCapFibers(leftExtrema, rightExtrema, centerSamples, leftSamples, rightSamples, continuationPairs, config, warpPoint, centerExtrema);
        const endCapFibers = buildEndCapFibers(centerExtrema, centerSamples, leftSamples, rightSamples, config, warpPoint);
        capFibers = [...startCapFibers, ...endCapFibers];
      }

      // Generate spout fibers (if count > 0)
      let spoutFibers = [];
      if (config.spoutFiberCount > 0) {
        spoutFibers = buildSpoutFibers(centerSamples, backbone, config, warpPoint);
      }

      const allFibers = [...mainFibers, ...capFibers, ...spoutFibers];

      return {
        outlines,
        fibers: allFibers,
        fiberGroups: { main: mainFibers, caps: capFibers, spouts: spoutFibers },
        debug: {
          centerExtrema,
          leftExtrema,
          rightExtrema,
          continuationPairs,
          centerSamples,
          leftSamples,
          rightSamples,
          curvatureSamples,
          config
        },
        metadata: {
          braidLength: config.braidLength,
          fiberCount: allFibers.length,
          mainFiberCount: mainFibers.length,
          capFiberCount: capFibers.length,
          spoutFiberCount: spoutFibers.length,
          parameters: config
        }
      };
    }

    // ========================================================================
    // Path Generators
    // ========================================================================

    function generateMeanderingPath(width, height, margin) {
      const points = [];
      const amplitude = (width - margin * 2) / 2 - 100;
      const centerX = width / 2;
      const rows = 6;
      const rowHeight = (height - margin * 2) / rows;

      for (let row = 0; row < rows; row++) {
        const y = margin + row * rowHeight;
        const direction = row % 2 === 0 ? 1 : -1;
        const startX = centerX - direction * amplitude;
        const endX = centerX + direction * amplitude;

        // Horizontal segment
        const segmentPoints = 50;
        for (let i = 0; i <= segmentPoints; i++) {
          const t = i / segmentPoints;
          points.push({
            x: startX + (endX - startX) * t,
            y: y + Math.sin(t * Math.PI * 2) * 30
          });
        }

        // Vertical connector (if not last row)
        if (row < rows - 1) {
          const connectorPoints = 20;
          for (let i = 1; i <= connectorPoints; i++) {
            const t = i / connectorPoints;
            points.push({
              x: endX + Math.sin(t * Math.PI) * 40 * direction,
              y: y + t * rowHeight
            });
          }
        }
      }

      return points;
    }

    function generateSpiralPath(width, height, margin) {
      const points = [];
      const centerX = width / 2;
      const centerY = height / 2;
      const maxRadius = Math.min(width, height) / 2 - margin - 50;
      const turns = 4;
      const totalPoints = 500;

      for (let i = 0; i <= totalPoints; i++) {
        const t = i / totalPoints;
        const angle = t * turns * Math.PI * 2;
        const radius = maxRadius * (1 - t * 0.8);
        points.push({
          x: centerX + Math.cos(angle) * radius,
          y: centerY + Math.sin(angle) * radius
        });
      }

      return points;
    }

    function generateZigzagPath(width, height, margin) {
      const points = [];
      const amplitude = (width - margin * 2) / 2 - 100;
      const centerX = width / 2;
      const segments = 8;
      const segmentHeight = (height - margin * 2) / segments;

      for (let seg = 0; seg <= segments; seg++) {
        const y = margin + seg * segmentHeight;
        const x = centerX + (seg % 2 === 0 ? -amplitude : amplitude);
        points.push({ x, y });
      }

      // Interpolate for smoother path
      const smoothPoints = [];
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i];
        const p1 = points[i + 1];
        for (let j = 0; j <= 30; j++) {
          const t = j / 30;
          smoothPoints.push({
            x: p0.x + (p1.x - p0.x) * t,
            y: p0.y + (p1.y - p0.y) * t
          });
        }
      }

      return smoothPoints;
    }

    function generateLissajousPath(width, height, margin) {
      const points = [];
      const centerX = width / 2;
      const centerY = height / 2;
      const amplitudeX = (width - margin * 2) / 2 - 100;
      const amplitudeY = (height - margin * 2) / 2 - 100;
      const a = 3;
      const b = 4;
      const totalPoints = 600;

      for (let i = 0; i <= totalPoints; i++) {
        const t = (i / totalPoints) * Math.PI * 2;
        points.push({
          x: centerX + Math.sin(a * t) * amplitudeX,
          y: centerY + Math.sin(b * t + Math.PI / 4) * amplitudeY
        });
      }

      return points;
    }

    // Simple L-shape path for debugging fold-over issues
    // Creates a single 90-degree turn with a rounded corner
    function generateVShapePath(width, height, margin) {
      const points = [];
      const centerX = width / 2;
      const centerY = height / 2;

      // L-shape: vertical line going down, then 90° turn right, then horizontal line
      const legLength = 600; // Length of each leg
      const turnRadius = 200; // Radius of the curved corner - must be > wallSeparation/2 for inside wall to exist

      // Starting point at top-center
      const startX = centerX;
      const startY = margin + 200;

      // Corner is at center of page
      const cornerX = centerX;
      const cornerY = centerY;

      // End point to the right
      const endX = centerX + legLength;
      const endY = centerY;

      // First leg: straight vertical line going down (before the turn)
      const straightPoints1 = 40;
      for (let i = 0; i <= straightPoints1; i++) {
        const t = i / straightPoints1;
        points.push({
          x: startX,
          y: startY + (cornerY - turnRadius - startY) * t
        });
      }

      // Curved 90-degree turn (quarter circle)
      // Going from pointing down (angle = PI/2) to pointing right (angle = 0)
      // Center of turn arc is at (cornerX + turnRadius, cornerY - turnRadius)
      const turnPoints = 30;
      const turnCenterX = cornerX + turnRadius;
      const turnCenterY = cornerY - turnRadius;

      for (let i = 0; i <= turnPoints; i++) {
        const t = i / turnPoints;
        // Start at angle PI (left side of circle, pointing down)
        // End at angle PI/2 (bottom of circle, pointing right)
        const angle = Math.PI - t * (Math.PI / 2);
        points.push({
          x: turnCenterX + Math.cos(angle) * turnRadius,
          y: turnCenterY + Math.sin(angle) * turnRadius
        });
      }

      // Second leg: straight horizontal line going right (after the turn)
      const straightPoints2 = 40;
      const turnEndX = cornerX + turnRadius;
      const turnEndY = cornerY;

      for (let i = 1; i <= straightPoints2; i++) {
        const t = i / straightPoints2;
        points.push({
          x: turnEndX + (endX - turnEndX) * t,
          y: turnEndY
        });
      }

      return points;
    }

    function generateScaleTestPaths(width, height, margin) {
      // Generate multiple straight horizontal paths at different lengths
      // to test path scaling behavior
      const maxLength = height - 2 * margin; // Full A3 height minus margins
      const percentages = [1.0, 0.5, 0.25, 0.1];
      const paths = [];

      const startX = margin;
      const spacing = (width - 2 * margin) / (percentages.length + 1);

      percentages.forEach((pct, idx) => {
        const pathLength = maxLength * pct;
        const centerX = startX + spacing * (idx + 1);
        const startY = (height - pathLength) / 2;

        // Create a straight vertical path
        const points = [];
        const numPoints = Math.max(10, Math.floor(pathLength / 10));
        for (let i = 0; i <= numPoints; i++) {
          const t = i / numPoints;
          points.push({
            x: centerX,
            y: startY + pathLength * t
          });
        }

        paths.push({
          id: `scale-${Math.round(pct * 100)}pct`,
          points
        });
      });

      return paths;
    }

    // ========================================================================
    // Backbone from Points
    // ========================================================================

    function createBackboneFromPoints(points) {
      const lengths = calculateArcLengths(points);
      const totalLength = lengths[lengths.length - 1];

      return {
        points,
        totalLength,
        getPointAt(t) {
          const targetLength = t * totalLength;
          for (let i = 0; i < points.length - 1; i++) {
            if (targetLength >= lengths[i] && targetLength <= lengths[i + 1]) {
              const segLen = lengths[i + 1] - lengths[i];
              const localT = segLen > 0 ? (targetLength - lengths[i]) / segLen : 0;
              return {
                x: points[i].x + (points[i + 1].x - points[i].x) * localT,
                y: points[i].y + (points[i + 1].y - points[i].y) * localT
              };
            }
          }
          return { ...points[points.length - 1] };
        },
        getTangentAt(t) {
          const delta = 0.001;
          const p0 = this.getPointAt(Math.max(0, t - delta));
          const p1 = this.getPointAt(Math.min(1, t + delta));
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const len = Math.hypot(dx, dy) || 1;
          return { x: dx / len, y: dy / len };
        }
      };
    }

    // ========================================================================
    // Rendering
    // ========================================================================

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statsEl = document.getElementById('stats');

    // A3 landscape in mm: 420 x 297
    // At 96 DPI: ~1587 x 1123 pixels
    const A3_WIDTH = 1587;
    const A3_HEIGHT = 1123;

    let currentBraid = null;
    let currentBackbone = null;
    let importedPaths = null; // Array of {points, length} when SVG is loaded
    let allBraids = []; // Array of braids for multi-path mode
    let allBackbones = []; // Array of backbones for multi-path mode

    // ========================================================================
    // SVG Import Functions
    // ========================================================================

    /**
     * Parse SVG path d attribute to array of points
     * Supports M, L, C, Q, S, T, Z commands (absolute and relative)
     */
    function parseSVGPath(d) {
      const points = [];
      const commands = d.match(/[MLHVCSQTAZmlhvcsqtaz][^MLHVCSQTAZmlhvcsqtaz]*/g) || [];

      let x = 0, y = 0;
      let startX = 0, startY = 0;
      let lastControlX = 0, lastControlY = 0;

      for (const cmd of commands) {
        const type = cmd[0];
        const args = cmd.slice(1).trim().split(/[\s,]+/).filter(s => s).map(Number);
        const isRelative = type === type.toLowerCase();

        switch (type.toUpperCase()) {
          case 'M': // Move to
            if (isRelative) { x += args[0]; y += args[1]; }
            else { x = args[0]; y = args[1]; }
            startX = x; startY = y;
            points.push({ x, y });
            // Implicit lineto commands after first pair
            for (let i = 2; i < args.length; i += 2) {
              if (isRelative) { x += args[i]; y += args[i + 1]; }
              else { x = args[i]; y = args[i + 1]; }
              points.push({ x, y });
            }
            break;

          case 'L': // Line to
            for (let i = 0; i < args.length; i += 2) {
              if (isRelative) { x += args[i]; y += args[i + 1]; }
              else { x = args[i]; y = args[i + 1]; }
              points.push({ x, y });
            }
            break;

          case 'H': // Horizontal line
            for (const arg of args) {
              x = isRelative ? x + arg : arg;
              points.push({ x, y });
            }
            break;

          case 'V': // Vertical line
            for (const arg of args) {
              y = isRelative ? y + arg : arg;
              points.push({ x, y });
            }
            break;

          case 'C': // Cubic bezier
            for (let i = 0; i < args.length; i += 6) {
              const x1 = isRelative ? x + args[i] : args[i];
              const y1 = isRelative ? y + args[i + 1] : args[i + 1];
              const x2 = isRelative ? x + args[i + 2] : args[i + 2];
              const y2 = isRelative ? y + args[i + 3] : args[i + 3];
              const x3 = isRelative ? x + args[i + 4] : args[i + 4];
              const y3 = isRelative ? y + args[i + 5] : args[i + 5];

              // Sample the bezier curve
              for (let t = 0.1; t <= 1; t += 0.1) {
                const px = cubicBezier(x, x1, x2, x3, t);
                const py = cubicBezier(y, y1, y2, y3, t);
                points.push({ x: px, y: py });
              }

              lastControlX = x2; lastControlY = y2;
              x = x3; y = y3;
            }
            break;

          case 'S': // Smooth cubic bezier
            for (let i = 0; i < args.length; i += 4) {
              // First control point is reflection of last control point
              const x1 = 2 * x - lastControlX;
              const y1 = 2 * y - lastControlY;
              const x2 = isRelative ? x + args[i] : args[i];
              const y2 = isRelative ? y + args[i + 1] : args[i + 1];
              const x3 = isRelative ? x + args[i + 2] : args[i + 2];
              const y3 = isRelative ? y + args[i + 3] : args[i + 3];

              for (let t = 0.1; t <= 1; t += 0.1) {
                const px = cubicBezier(x, x1, x2, x3, t);
                const py = cubicBezier(y, y1, y2, y3, t);
                points.push({ x: px, y: py });
              }

              lastControlX = x2; lastControlY = y2;
              x = x3; y = y3;
            }
            break;

          case 'Q': // Quadratic bezier
            for (let i = 0; i < args.length; i += 4) {
              const x1 = isRelative ? x + args[i] : args[i];
              const y1 = isRelative ? y + args[i + 1] : args[i + 1];
              const x2 = isRelative ? x + args[i + 2] : args[i + 2];
              const y2 = isRelative ? y + args[i + 3] : args[i + 3];

              for (let t = 0.1; t <= 1; t += 0.1) {
                const px = quadBezier(x, x1, x2, t);
                const py = quadBezier(y, y1, y2, t);
                points.push({ x: px, y: py });
              }

              lastControlX = x1; lastControlY = y1;
              x = x2; y = y2;
            }
            break;

          case 'T': // Smooth quadratic bezier
            for (let i = 0; i < args.length; i += 2) {
              const x1 = 2 * x - lastControlX;
              const y1 = 2 * y - lastControlY;
              const x2 = isRelative ? x + args[i] : args[i];
              const y2 = isRelative ? y + args[i + 1] : args[i + 1];

              for (let t = 0.1; t <= 1; t += 0.1) {
                const px = quadBezier(x, x1, x2, t);
                const py = quadBezier(y, y1, y2, t);
                points.push({ x: px, y: py });
              }

              lastControlX = x1; lastControlY = y1;
              x = x2; y = y2;
            }
            break;

          case 'A': // Arc (simplified - sample as line segments)
            for (let i = 0; i < args.length; i += 7) {
              const endX = isRelative ? x + args[i + 5] : args[i + 5];
              const endY = isRelative ? y + args[i + 6] : args[i + 6];
              // Simplified: just draw line to end point
              // Full arc implementation would require more complex math
              points.push({ x: endX, y: endY });
              x = endX; y = endY;
            }
            break;

          case 'Z': // Close path
            if (startX !== x || startY !== y) {
              points.push({ x: startX, y: startY });
            }
            x = startX; y = startY;
            break;
        }
      }

      return points;
    }

    function cubicBezier(p0, p1, p2, p3, t) {
      const mt = 1 - t;
      return mt * mt * mt * p0 + 3 * mt * mt * t * p1 + 3 * mt * t * t * p2 + t * t * t * p3;
    }

    function quadBezier(p0, p1, p2, t) {
      const mt = 1 - t;
      return mt * mt * p0 + 2 * mt * t * p1 + t * t * p2;
    }

    /**
     * Parse uploaded SVG file and extract all paths
     */
    function parseSVGFile(svgText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(svgText, 'image/svg+xml');
      const svg = doc.querySelector('svg');

      if (!svg) {
        alert('Invalid SVG file');
        return null;
      }

      // Get viewBox or dimensions
      let viewBox = svg.getAttribute('viewBox');
      let width = parseFloat(svg.getAttribute('width')) || A3_WIDTH;
      let height = parseFloat(svg.getAttribute('height')) || A3_HEIGHT;

      if (viewBox) {
        const parts = viewBox.split(/[\s,]+/).map(Number);
        width = parts[2] || width;
        height = parts[3] || height;
      }

      // Extract all path elements
      const pathElements = svg.querySelectorAll('path');
      const paths = [];

      pathElements.forEach((pathEl, idx) => {
        const d = pathEl.getAttribute('d');
        if (!d) return;

        const points = parseSVGPath(d);
        if (points.length < 2) return;

        // Calculate path length
        let length = 0;
        for (let i = 1; i < points.length; i++) {
          length += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
        }

        paths.push({
          points,
          length,
          id: pathEl.getAttribute('id') || `path-${idx + 1}`
        });
      });

      // Scale paths to fit A3 canvas if needed
      if (paths.length > 0) {
        // Find bounding box of all paths
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        paths.forEach(path => {
          path.points.forEach(p => {
            minX = Math.min(minX, p.x);
            minY = Math.min(minY, p.y);
            maxX = Math.max(maxX, p.x);
            maxY = Math.max(maxY, p.y);
          });
        });

        const pathWidth = maxX - minX;
        const pathHeight = maxY - minY;
        const margin = 100;

        // Calculate scale to fit A3 with margin
        const scaleX = (A3_WIDTH - 2 * margin) / pathWidth;
        const scaleY = (A3_HEIGHT - 2 * margin) / pathHeight;
        const scale = Math.min(scaleX, scaleY);

        // Center offset
        const offsetX = margin + (A3_WIDTH - 2 * margin - pathWidth * scale) / 2 - minX * scale;
        const offsetY = margin + (A3_HEIGHT - 2 * margin - pathHeight * scale) / 2 - minY * scale;

        // Apply transform to all points
        paths.forEach(path => {
          path.points = path.points.map(p => ({
            x: p.x * scale + offsetX,
            y: p.y * scale + offsetY
          }));
          path.length *= scale;
        });
      }

      return paths;
    }

    /**
     * Handle SVG file load
     */
    function handleSVGLoad(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const paths = parseSVGFile(e.target.result);
        if (paths && paths.length > 0) {
          importedPaths = paths;

          // Update UI
          document.getElementById('pathTypeSection').style.display = 'none';
          document.getElementById('clearSvgBtn').style.display = 'inline-block';
          document.getElementById('svgInfo').style.display = 'block';
          document.getElementById('svgPathCount').textContent = `${paths.length} path${paths.length > 1 ? 's' : ''} loaded`;

          generate();
        }
      };
      reader.readAsText(file);
    }

    /**
     * Clear imported SVG and return to test mode
     */
    function clearImportedSVG() {
      importedPaths = null;
      allBraids = [];
      allBackbones = [];

      // Update UI
      document.getElementById('pathTypeSection').style.display = 'block';
      document.getElementById('clearSvgBtn').style.display = 'none';
      document.getElementById('svgInfo').style.display = 'none';

      generate();
    }

    function render() {
      const scale = parseFloat(document.getElementById('scale').value);
      const w = A3_WIDTH * scale;
      const h = A3_HEIGHT * scale;

      canvas.width = w;
      canvas.height = h;

      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.scale(scale, scale);

      // Draw all backbone paths (light gray)
      allBackbones.forEach(backbone => {
        if (backbone) {
          ctx.strokeStyle = '#ddd';
          ctx.lineWidth = 2;
          ctx.beginPath();
          backbone.points.forEach((p, i) => {
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.stroke();
        }
      });

      // Debug colors for fiber types
      const DEBUG_COLORS = {
        main: '#999',
        cap: '#0066cc',
        spout: '#00aa44'
      };

      // Draw all braids
      allBraids.forEach(braid => {
        if (!braid) return;

        // Draw fibers with type-based colors
        ctx.lineWidth = 1;
        braid.fibers.forEach(fiber => {
          ctx.strokeStyle = DEBUG_COLORS[fiber.type] || DEBUG_COLORS.main;
          ctx.beginPath();
          fiber.points.forEach((p, i) => {
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.stroke();
        });

        // Draw outlines
        braid.outlines.forEach(outline => {
          if (outline.type === 'zigzag') {
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 2;
          } else if (outline.type === 'wall' && outline.side === 'left') {
            ctx.strokeStyle = '#00ccff';
            ctx.lineWidth = 2;
          } else if (outline.type === 'wall' && outline.side === 'right') {
            ctx.strokeStyle = '#ff00cc';
            ctx.lineWidth = 2;
          } else if (outline.type === 'continuation') {
            ctx.strokeStyle = '#ff914d';
            ctx.lineWidth = 2;
          }

          ctx.beginPath();
          outline.points.forEach((p, i) => {
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.stroke();
        });
      }); // End allBraids.forEach

      // Debug visualization (shows first braid only)
      if (document.getElementById('showDebug').checked && currentBraid && currentBraid.debug) {
        const debug = currentBraid.debug;
        const { tipTaperLength, braidLength } = debug.config;
        const warpPoint = createWarpFunction(currentBackbone, braidLength, null, debug.config);

        // Draw wall start/end points (not extrema, actual endpoints)
        const leftStart = debug.leftSamples[0];
        const leftEnd = debug.leftSamples[debug.leftSamples.length - 1];
        const rightStart = debug.rightSamples[0];
        const rightEnd = debug.rightSamples[debug.rightSamples.length - 1];
        const centerStart = debug.centerSamples[0];
        const centerEnd = debug.centerSamples[debug.centerSamples.length - 1];

        // Left wall start/end - cyan squares
        [{ pt: leftStart, label: 'L-START' }, { pt: leftEnd, label: 'L-END' }].forEach(({ pt, label }) => {
          const warped = warpPoint(pt);
          ctx.fillStyle = '#00ccff';
          ctx.fillRect(warped.x - 6, warped.y - 6, 12, 12);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.strokeRect(warped.x - 6, warped.y - 6, 12, 12);
          ctx.fillStyle = '#000';
          ctx.font = 'bold 12px monospace';
          ctx.fillText(label, warped.x - 55, warped.y - 10);
        });

        // Right wall start/end - magenta squares
        [{ pt: rightStart, label: 'R-START' }, { pt: rightEnd, label: 'R-END' }].forEach(({ pt, label }) => {
          const warped = warpPoint(pt);
          ctx.fillStyle = '#ff00cc';
          ctx.fillRect(warped.x - 6, warped.y - 6, 12, 12);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.strokeRect(warped.x - 6, warped.y - 6, 12, 12);
          ctx.fillStyle = '#000';
          ctx.font = 'bold 12px monospace';
          ctx.fillText(label, warped.x + 10, warped.y - 10);
        });

        // Center/Zigzag start/end - yellow squares
        [{ pt: centerStart, label: 'Z-START' }, { pt: centerEnd, label: 'Z-END' }].forEach(({ pt, label }) => {
          const warped = warpPoint(pt);
          ctx.fillStyle = '#ffcc00';
          ctx.fillRect(warped.x - 6, warped.y - 6, 12, 12);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.strokeRect(warped.x - 6, warped.y - 6, 12, 12);
          ctx.fillStyle = '#000';
          ctx.font = 'bold 12px monospace';
          ctx.fillText(label, warped.x + 10, warped.y - 10);
        });

        // Draw extrema markers
        // Center extrema: green circles if paired, red if unpaired
        debug.centerExtrema.forEach((e, idx) => {
          const warped = warpPoint(e);
          ctx.beginPath();
          ctx.arc(warped.x, warped.y, 6, 0, Math.PI * 2);
          ctx.fillStyle = e.paired ? '#00ff00' : '#ff0000';
          ctx.fill();
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 1;
          ctx.stroke();
          // Show red ring if in taper zone
          if (e.y < tipTaperLength || e.y > braidLength - tipTaperLength) {
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(warped.x, warped.y, 10, 0, Math.PI * 2);
            ctx.stroke();
          }
          // Label with Z0, Z1, Z2... (Z for Zigzag center line)
          ctx.fillStyle = '#000';
          ctx.font = 'bold 11px monospace';
          ctx.fillText(`Z${idx}`, warped.x + 10, warped.y - 4);
        });

        // Left wall extrema: cyan if claimed, orange if unclaimed
        debug.leftExtrema.forEach((e, idx) => {
          const warped = warpPoint(e);
          ctx.beginPath();
          ctx.arc(warped.x, warped.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = e.claimed ? '#00ccff' : '#ff6600';
          ctx.fill();
          // Label with L0, L1, L2...
          ctx.fillStyle = '#000';
          ctx.font = 'bold 11px monospace';
          ctx.fillText(`L${idx}`, warped.x - 25, warped.y + 4);
        });

        // Right wall extrema: magenta if claimed, orange if unclaimed
        debug.rightExtrema.forEach((e, idx) => {
          const warped = warpPoint(e);
          ctx.beginPath();
          ctx.arc(warped.x, warped.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = e.claimed ? '#ff00cc' : '#ff6600';
          ctx.fill();
          // Label with R0, R1, R2...
          ctx.fillStyle = '#000';
          ctx.font = 'bold 11px monospace';
          ctx.fillText(`R${idx}`, warped.x + 10, warped.y + 4);
        });

        // Draw origin points and landing rails for continuation pairs
        debug.continuationPairs.forEach((pair, idx) => {
          // Origin point (wall trough): white square
          const wallWarped = warpPoint(pair.wall);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(wallWarped.x - 4, wallWarped.y - 4, 8, 8);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 1;
          ctx.strokeRect(wallWarped.x - 4, wallWarped.y - 4, 8, 8);

          // Landing point (center tip): white diamond
          const tipWarped = warpPoint(pair.center);
          ctx.save();
          ctx.translate(tipWarped.x, tipWarped.y);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-4, -4, 8, 8);
          ctx.strokeStyle = '#000';
          ctx.strokeRect(-4, -4, 8, 8);
          ctx.restore();

          // Draw landing rail - thin purple line
          if (pair.landingRail && pair.landingRail.length > 0) {
            ctx.strokeStyle = 'rgba(128, 0, 255, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            pair.landingRail.forEach((p, i) => {
              const wp = warpPoint(p);
              if (i === 0) ctx.moveTo(wp.x, wp.y);
              else ctx.lineTo(wp.x, wp.y);
            });
            ctx.stroke();
          }
        });

        // Console log for debugging
        // console.log(`DEBUG tipTaper=${debug.config.tipTaper.toFixed(2)}:`, {
        //   centerExtrema: debug.centerExtrema.length,
        //   leftExtrema: debug.leftExtrema.length,
        //   rightExtrema: debug.rightExtrema.length,
        //   continuationPairs: debug.continuationPairs.length,
        //   unpairedCenter: debug.centerExtrema.filter(e => !e.paired).length,
        //   inTaperZone: debug.centerExtrema.filter(e =>
        //     e.y < tipTaperLength || e.y > braidLength - tipTaperLength
        //   ).length
        // });
      }

      // Wall points visualization (separate from main debug)
      if (document.getElementById('showWallPoints').checked && currentBraid.debug) {
        const debug = currentBraid.debug;
        const { braidLength, wallSeparation } = debug.config;
        const warpPoint = createWarpFunction(currentBackbone, braidLength, debug.curvatureSamples, debug.config);
        const curvatureSamples = debug.curvatureSamples;
        const halfWidth = wallSeparation / 2;

        // Helper to get color based on curvature state
        function getPointColor(sample, side) {
          if (!curvatureSamples) return side === 'left' ? '#00ccff' : '#ff00cc';

          const t = clamp(sample.y / braidLength, 0, 1);
          const curvature = getCurvatureAt(curvatureSamples, t);

          if (curvature === 0) return '#888888'; // Straight - gray

          const radius = 1 / Math.abs(curvature);
          // curvature > 0 = curving left, right wall (side='right') is inside
          // curvature < 0 = curving right, left wall (side='left') is inside
          const isOnInside = (curvature > 0 && side === 'right') ||
            (curvature < 0 && side === 'left');

          if (!isOnInside) return '#4444ff'; // Outside of curve - blue

          // Inside of curve - color by tightness
          if (radius < halfWidth) return '#ff0000'; // Very tight (will fold) - red
          if (radius < halfWidth * 2) return '#ff6600'; // Tight - orange
          if (radius < halfWidth * 3) return '#ffcc00'; // Moderate - yellow
          return '#00ff00'; // Loose inside - green
        }

        // Draw left wall sample points
        debug.leftSamples.forEach((sample, idx) => {
          const warped = warpPoint(sample);
          const color = getPointColor(sample, 'left');
          ctx.beginPath();
          ctx.arc(warped.x, warped.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        });

        // Draw right wall sample points
        debug.rightSamples.forEach((sample, idx) => {
          const warped = warpPoint(sample);
          const color = getPointColor(sample, 'right');
          ctx.beginPath();
          ctx.arc(warped.x, warped.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        });

        // Show point counts in console
        console.log(`[WALL POINTS] Left: ${debug.leftSamples.length}, Right: ${debug.rightSamples.length}`);
      }

      ctx.restore();
    }

    /**
     * Get common braid parameters from UI
     */
    function getParams(braidLength) {
      // Path scaling: scale parameters based on path length relative to reference
      const referenceLength = parseFloat(document.getElementById('referencePathLength').value);
      const scalePower = parseFloat(document.getElementById('scalePathPower').value);
      const bowScalePower = parseFloat(document.getElementById('scaleBowPower').value);
      const lengthRatio = braidLength / Math.max(referenceLength, 1);
      const pathScaleFactor = Math.pow(lengthRatio, scalePower);
      const bowScaleFactor = Math.pow(lengthRatio, bowScalePower);

      // Wavelength stays constant - shorter paths naturally get fewer cycles
      const targetWavelength = parseFloat(document.getElementById('wavelength').value);
      const wallFrequency = braidLength / targetWavelength;
      const frequency = wallFrequency * 2;

      const wallSmooth = parseInt(document.getElementById('wallSmooth').value) || 1;
      const sampleSpacing = Math.min(1, targetWavelength / 80) / wallSmooth;  // wallSmooth multiplies sample rate

      return {
        frequency,
        wallFrequency,
        fiberCount: parseInt(document.getElementById('fiberCount').value),
        fiberBow: parseFloat(document.getElementById('fiberBow').value) * bowScaleFactor,
        tipTaper: parseFloat(document.getElementById('tipTaper').value),
        tipTaperLength: parseFloat(document.getElementById('tipTaperLength').value) * pathScaleFactor,
        redistributionFactor: parseFloat(document.getElementById('redistributionFactor').value),
        curvatureSmoothing: parseInt(document.getElementById('curvatureSmoothing').value),
        zigzagScale: parseFloat(document.getElementById('zigzagScale').value) * pathScaleFactor,
        wallScale: parseFloat(document.getElementById('wallScale').value) * pathScaleFactor,
        wallSeparation: (() => {
          const baseWallSep = parseFloat(document.getElementById('wallSeparation').value);
          const scaledWallSep = baseWallSep * pathScaleFactor; // Apply path scaling first
          const lengthScale = parseFloat(document.getElementById('wallLengthScale').value);
          const referenceWavelength = 70; // px - the default wavelength
          // Scale wall separation proportionally to wavelength when lengthScale > 0
          // At lengthScale=0: use base value; at lengthScale=1: scale proportionally
          const wavelengthScaleFactor = 1 + lengthScale * (targetWavelength / referenceWavelength - 1);
          return scaledWallSep * wavelengthScaleFactor;
        })(),
        leftWallPhase: parseFloat(document.getElementById('leftWallPhase').value),
        rightWallPhase: parseFloat(document.getElementById('rightWallPhase').value),
        cycleJitter: parseFloat(document.getElementById('cycleJitter').value),
        zigzagPhase: parseFloat(document.getElementById('zigzagPhase').value),
        fiberBias: parseFloat(document.getElementById('fiberBias').value),
        fiberLanding: parseFloat(document.getElementById('fiberLanding').value),
        bowGradient: parseFloat(document.getElementById('bowGradient').value),
        landingSpread: parseFloat(document.getElementById('landingSpread').value),
        fiberJiggle: parseFloat(document.getElementById('fiberJiggle').value),
        arcTangentBlend: parseFloat(document.getElementById('arcTangentBlend').value),
        arcLean: parseFloat(document.getElementById('arcLean').value),
        breakChance: parseFloat(document.getElementById('breakChance').value),
        breakCoherence: parseFloat(document.getElementById('breakCoherence').value),
        breakGapSize: parseFloat(document.getElementById('breakGapSize').value),
        continuationLength: parseFloat(document.getElementById('continuationLength').value),
        continuationBias: parseFloat(document.getElementById('continuationBias').value),
        wallSmooth: parseInt(document.getElementById('wallSmooth').value),
        insideThinning: parseFloat(document.getElementById('insideThinning').value),
        experimentalCurveMode: document.getElementById('experimentalCurveMode').checked,
        enableCaps: document.getElementById('enableCaps').checked,
        capFiberCount: parseInt(document.getElementById('capFiberCount').value),
        capGatherLength: parseFloat(document.getElementById('capGatherLength').value),
        capBowAngle: parseFloat(document.getElementById('capBowAngle').value),
        capBowStrength: parseFloat(document.getElementById('capBowStrength').value),
        capLandingDepth: parseFloat(document.getElementById('capLandingDepth').value),
        spoutFiberCount: parseInt(document.getElementById('spoutFiberCount').value),
        spoutLength: parseFloat(document.getElementById('spoutLength').value),
        spoutSpread: parseFloat(document.getElementById('spoutSpread').value),
        spoutGravity: parseFloat(document.getElementById('spoutGravity').value),
        spoutAtStart: document.getElementById('spoutAtStart').checked,
        braidLength,
        sampleSpacing,
        targetWavelength,
        pathScaleFactor
      };
    }

    function generate() {
      const startTime = performance.now();

      // Scale test mode: generate test paths at different lengths
      const pathType = document.getElementById('pathType').value;
      if (pathType === 'scale-test' && (!importedPaths || importedPaths.length === 0)) {
        importedPaths = generateScaleTestPaths(A3_WIDTH, A3_HEIGHT, 100);
      }

      // Multi-path mode: process imported SVG paths
      if (importedPaths && importedPaths.length > 0) {
        allBackbones = [];
        allBraids = [];

        let totalFibers = 0;
        let totalCaps = 0;
        let totalSpouts = 0;

        importedPaths.forEach((path, idx) => {
          const backbone = createBackboneFromPoints(path.points);
          allBackbones.push(backbone);

          const params = getParams(backbone.totalLength);
          const braid = generateBraid(backbone, params);
          braid.pathId = path.id;
          braid.pathIndex = idx;
          allBraids.push(braid);

          totalFibers += braid.metadata.mainFiberCount;
          totalCaps += braid.metadata.capFiberCount;
          totalSpouts += braid.metadata.spoutFiberCount;
        });

        // Set current to first for backwards compatibility
        currentBackbone = allBackbones[0];
        currentBraid = allBraids[0];

        // Compute path length stats
        const pathLengths = allBackbones.map(b => b.totalLength);
        const longestPath = Math.round(Math.max(...pathLengths));
        const shortestPath = Math.round(Math.min(...pathLengths));

        const elapsed = (performance.now() - startTime).toFixed(1);
        statsEl.textContent = `${importedPaths.length} paths | Longest: ${longestPath}px, Shortest: ${shortestPath}px | Fibers: ${totalFibers} main + ${totalCaps} cap + ${totalSpouts} spout | ${elapsed}ms`;

        render();
        return;
      }

      // Single path mode: use test path generators
      const margin = 100;

      let pathPoints;
      switch (pathType) {
        case 'spiral':
          pathPoints = generateSpiralPath(A3_WIDTH, A3_HEIGHT, margin);
          break;
        case 'zigzag':
          pathPoints = generateZigzagPath(A3_WIDTH, A3_HEIGHT, margin);
          break;
        case 'lissajous':
          pathPoints = generateLissajousPath(A3_WIDTH, A3_HEIGHT, margin);
          break;
        case 'vshape':
          pathPoints = generateVShapePath(A3_WIDTH, A3_HEIGHT, margin);
          break;
        default:
          pathPoints = generateMeanderingPath(A3_WIDTH, A3_HEIGHT, margin);
      }

      currentBackbone = createBackboneFromPoints(pathPoints);
      allBackbones = [currentBackbone];

      const params = getParams(currentBackbone.totalLength);
      currentBraid = generateBraid(currentBackbone, params);
      allBraids = [currentBraid];

      const elapsed = (performance.now() - startTime).toFixed(1);
      const meta = currentBraid.metadata;
      statsEl.textContent = `Path: ${pathPoints.length} pts | Length: ${Math.round(currentBackbone.totalLength)}px | Fibers: ${meta.mainFiberCount} main + ${meta.capFiberCount} cap + ${meta.spoutFiberCount} spout | ${elapsed}ms`;

      render();
    }

    function exportSVG() {
      if (allBraids.length === 0) {
        alert('Generate a braid first!');
        return;
      }

      let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${A3_WIDTH} ${A3_HEIGHT}" width="${A3_WIDTH}" height="${A3_HEIGHT}">`;
      svg += `<rect width="100%" height="100%" fill="white"/>`;

      // Helper to convert points to path d attribute
      function pointsToPath(points) {
        return 'M ' + points.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' L ');
      }

      // Export each braid in its own group
      allBraids.forEach((braid, idx) => {
        const pathId = braid.pathId || `path-${idx + 1}`;

        svg += `<g id="${pathId}">`;

        // Main fibers layer
        svg += `<g id="${pathId}-fibers" stroke="#000" fill="none" stroke-width="1">`;
        if (braid.fiberGroups && braid.fiberGroups.main) {
          braid.fiberGroups.main.forEach(fiber => {
            svg += `<path d="${pointsToPath(fiber.points)}"/>`;
          });
        }
        svg += '</g>';

        // Cap fibers layer
        svg += `<g id="${pathId}-caps" stroke="#000" fill="none" stroke-width="1">`;
        if (braid.fiberGroups && braid.fiberGroups.caps) {
          braid.fiberGroups.caps.forEach(fiber => {
            svg += `<path d="${pointsToPath(fiber.points)}"/>`;
          });
        }
        svg += '</g>';

        // Spout fibers layer
        svg += `<g id="${pathId}-spouts" stroke="#000" fill="none" stroke-width="1">`;
        if (braid.fiberGroups && braid.fiberGroups.spouts) {
          braid.fiberGroups.spouts.forEach(fiber => {
            svg += `<path d="${pointsToPath(fiber.points)}"/>`;
          });
        }
        svg += '</g>';

        // Outlines layer
        svg += `<g id="${pathId}-outlines" fill="none" stroke-width="2">`;
        braid.outlines.forEach(outline => {
          let color = '#333';
          if (outline.type === 'zigzag') color = '#ffcc00';
          else if (outline.type === 'wall' && outline.side === 'left') color = '#00ccff';
          else if (outline.type === 'wall' && outline.side === 'right') color = '#ff00cc';
          else if (outline.type === 'continuation') color = '#ff914d';

          svg += `<path d="${pointsToPath(outline.points)}" stroke="${color}"/>`;
        });
        svg += '</g>';

        svg += '</g>'; // End path group
      });

      svg += '</svg>';

      // Download
      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const filename = importedPaths ? `braid-output-${Date.now()}.svg` : `braid-test-${Date.now()}.svg`;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Event listeners - live update on all controls
    const controls = [
      'wavelength', 'zigzagScale', 'wallScale', 'wallSeparation', 'wallLengthScale',
      'leftWallPhase', 'rightWallPhase',
      'fiberCount', 'fiberBow', 'tipTaper', 'tipTaperLength',
      'redistributionFactor', 'curvatureSmoothing',
      'cycleJitter', 'zigzagPhase', 'fiberBias', 'fiberLanding',
      'bowGradient', 'landingSpread', 'fiberJiggle', 'arcTangentBlend', 'arcLean',
      // Fiber break controls
      'breakChance', 'breakCoherence', 'breakGapSize',
      'continuationLength', 'continuationBias', 'wallSmooth', 'insideThinning',
      // Cap and spout controls
      'capFiberCount', 'capGatherLength', 'capBowAngle', 'capBowStrength', 'capLandingDepth',
      'spoutFiberCount', 'spoutLength', 'spoutSpread', 'spoutGravity',
      // Path scaling controls
      'referencePathLength', 'scalePathPower', 'scaleBowPower'
    ];

    controls.forEach(id => {
      const el = document.getElementById(id);
      const valEl = document.getElementById(id + 'Val');
      el.addEventListener('input', () => {
        if (valEl) valEl.textContent = el.value;
        generate();
      });
      // Initialize display
      if (valEl) valEl.textContent = el.value;
    });

    // Checkbox controls
    ['enableCaps', 'spoutAtStart', 'experimentalCurveMode'].forEach(id => {
      document.getElementById(id).addEventListener('change', generate);
    });

    // Debug checkbox triggers re-render (not regenerate)
    document.getElementById('showDebug').addEventListener('change', render);
    document.getElementById('showWallPoints').addEventListener('change', render);

    // Path type regenerates the backbone
    document.getElementById('pathType').addEventListener('change', generate);

    // Scale just re-renders (no regeneration needed)
    document.getElementById('scale').addEventListener('input', () => {
      document.getElementById('scaleVal').textContent = document.getElementById('scale').value;
      render();
    });

    document.getElementById('exportSvg').addEventListener('click', exportSVG);

    // SVG Import handlers
    document.getElementById('loadSvgBtn').addEventListener('click', () => {
      document.getElementById('svgFileInput').click();
    });

    document.getElementById('svgFileInput').addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleSVGLoad(e.target.files[0]);
      }
    });

    document.getElementById('clearSvgBtn').addEventListener('click', clearImportedSVG);

    // Drag and drop support on canvas
    canvas.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      canvas.style.outline = '3px dashed #00ff00';
    });

    canvas.addEventListener('dragleave', () => {
      canvas.style.outline = 'none';
    });

    canvas.addEventListener('drop', (e) => {
      e.preventDefault();
      canvas.style.outline = 'none';
      const file = e.dataTransfer.files[0];
      if (file && file.name.endsWith('.svg')) {
        handleSVGLoad(file);
      }
    });

    // Initial generation
    generate();
  </script>
</body>

</html>
