<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Braid Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .controls {
      padding: 15px;
      background: #16213e;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-group label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
    }

    .control-group select {
      padding: 6px 10px;
      background: #0f3460;
      border: 1px solid #1a1a2e;
      color: #fff;
      border-radius: 4px;
      width: 120px;
    }

    .control-group input[type="range"] {
      width: 100px;
      accent-color: #e94560;
    }

    /* Section-specific slider colors */
    .section-wave input[type="range"] {
      accent-color: #7eb8da;
    }

    .section-wall input[type="range"] {
      accent-color: #a8d4a8;
    }

    .section-fiber input[type="range"] {
      accent-color: #dab894;
    }

    .section-breaks input[type="range"] {
      accent-color: #c9a8d4;
    }

    .section-curve input[type="range"] {
      accent-color: #d4a8a8;
    }

    .section-caps input[type="range"] {
      accent-color: #a8c9d4;
    }

    .section-spouts input[type="range"] {
      accent-color: #d4d4a8;
    }

    .section-scaling input[type="range"] {
      accent-color: #d4a8c9;
    }

    .section-display input[type="range"] {
      accent-color: #a8d4c9;
    }

    button {
      padding: 10px 20px;
      background: #e94560;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #ff6b6b;
    }

    .stats {
      margin-left: auto;
      font-size: 12px;
      color: #888;
    }

    .control-section {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding: 10px 15px;
      background: rgba(15, 52, 96, 0.3);
      border-radius: 4px;
      align-items: flex-end;
    }

    .control-section-label {
      width: 100%;
      font-size: 10px;
      font-weight: bold;
      color: #e94560;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: -5px;
    }

    .canvas-container {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    canvas {
      background: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>

<body>
  <div class="controls">
    <!-- SVG Import -->
    <div class="control-section" id="svgImportSection">
      <span class="control-section-label">SVG Import</span>
      <div class="control-group">
        <input type="file" id="svgFileInput" accept=".svg" style="display: none;">
        <button id="loadSvgBtn" style="background: #0f3460;">Load SVG</button>
        <button id="clearSvgBtn" style="background: #3d0a24; display: none;">Clear SVG</button>
      </div>
      <div class="control-group" id="svgInfo" style="display: none;">
        <span id="svgPathCount">0 paths loaded</span>
      </div>
    </div>

    <!-- Path Selection (for test paths when no SVG loaded) -->
    <div class="control-group" id="pathTypeSection">
      <label>Test Path</label>
      <select id="pathType">
        <option value="meander">Meandering</option>
        <option value="spiral">Spiral</option>
        <option value="zigzag">Zigzag</option>
        <option value="lissajous">Lissajous</option>
        <option value="vshape">L-Shape (Debug)</option>
        <option value="scale-test">Scale Test (Multi)</option>
      </select>
    </div>

    <!-- Wave Pattern -->
    <div class="control-section section-wave">
      <span class="control-section-label">Wave Pattern</span>
      <div class="control-group">
        <label>Wavelength <span id="wavelengthVal">97</span>px</label>
        <input type="range" id="wavelength" value="97" min="30" max="200" step="1">
      </div>
      <div class="control-group">
        <label>Zigzag Amp <span id="zigzagScaleVal">0.2</span></label>
        <input type="range" id="zigzagScale" value="0.2" min="0.01" max="1" step="0.01">
      </div>
      <div class="control-group">
        <label>Zigzag Phase <span id="zigzagPhaseVal">60</span>°</label>
        <input type="range" id="zigzagPhase" value="60" min="-180" max="180" step="5">
      </div>
      <div class="control-group">
        <label>Cycle Jitter <span id="cycleJitterVal">1.15</span></label>
        <input type="range" id="cycleJitter" value="1.15" min="0" max="3" step="0.05">
      </div>
    </div>

    <!-- Wall Behavior -->
    <div class="control-section section-wall">
      <span class="control-section-label">Wall Behavior</span>
      <div class="control-group">
        <label>Wall Amp <span id="wallScaleVal">0.4</span></label>
        <input type="range" id="wallScale" value="0.4" min="0.1" max="1" step="0.01">
      </div>
      <div class="control-group">
        <label>Wall Sep <span id="wallSeparationVal">60</span></label>
        <input type="range" id="wallSeparation" value="60" min="20" max="200" step="5">
      </div>
      <div class="control-group">
        <label>Wall/Length <span id="wallLengthScaleVal">0</span></label>
        <input type="range" id="wallLengthScale" value="0" min="0" max="1" step="0.1">
      </div>
      <div class="control-group">
        <label>L Wall Phase <span id="leftWallPhaseVal">60</span>°</label>
        <input type="range" id="leftWallPhase" value="60" min="-180" max="180" step="5">
      </div>
      <div class="control-group">
        <label>R Wall Phase <span id="rightWallPhaseVal">160</span>°</label>
        <input type="range" id="rightWallPhase" value="160" min="-180" max="180" step="5">
      </div>
    </div>

    <!-- Fiber Shape & Count -->
    <div class="control-section section-fiber">
      <span class="control-section-label">Fiber Shape</span>
      <div class="control-group">
        <label>Fiber Count <span id="fiberCountVal">17</span></label>
        <input type="range" id="fiberCount" value="17" min="1" max="100" step="1">
      </div>
      <div class="control-group">
        <label>Fiber Bow <span id="fiberBowVal">0.5</span></label>
        <input type="range" id="fiberBow" value="0.5" min="0" max="1" step="0.05">
      </div>
      <div class="control-group">
        <label>Bow Gradient <span id="bowGradientVal">2.6</span></label>
        <input type="range" id="bowGradient" value="2.6" min="0.5" max="6" step="0.1">
      </div>
      <div class="control-group">
        <label>Fiber Bias <span id="fiberBiasVal">0.6</span></label>
        <input type="range" id="fiberBias" value="0.6" min="0" max="1" step="0.05">
      </div>
      <div class="control-group">
        <label>Fiber Landing <span id="fiberLandingVal">0</span></label>
        <input type="range" id="fiberLanding" value="0" min="0" max="1" step="0.05">
      </div>
      <div class="control-group">
        <label>Landing Spread <span id="landingSpreadVal">1</span></label>
        <input type="range" id="landingSpread" value="1" min="0.1" max="1" step="0.05">
      </div>
      <div class="control-group">
        <label>Fiber Jiggle <span id="fiberJiggleVal">0.25</span></label>
        <input type="range" id="fiberJiggle" value="0.25" min="0" max="1" step="0.05">
      </div>
      <div class="control-group">
        <label>Arc Shift <span id="arcTangentBlendVal">0</span></label>
        <input type="range" id="arcTangentBlend" value="0" min="-1" max="1" step="0.05">
      </div>
      <div class="control-group">
        <label>Arc Lean <span id="arcLeanVal">0</span></label>
        <input type="range" id="arcLean" value="0" min="-1" max="1" step="0.05">
      </div>
    </div>

    <!-- Fiber Breaks -->
    <div class="control-section section-breaks">
      <span class="control-section-label">Fiber Breaks</span>
      <div class="control-group">
        <label>Break Chance <span id="breakChanceVal">0.75</span></label>
        <input type="range" id="breakChance" value="0.75" min="0" max="1" step="0.05">
      </div>
      <div class="control-group">
        <label>Break Coherence <span id="breakCoherenceVal">0</span></label>
        <input type="range" id="breakCoherence" value="0" min="0" max="1" step="0.05">
      </div>
      <div class="control-group">
        <label>Gap Size <span id="breakGapSizeVal">15</span></label>
        <input type="range" id="breakGapSize" value="15" min="3" max="15" step="1">
      </div>
    </div>

    <!-- Curve & Advanced -->
    <div class="control-section section-curve">
      <span class="control-section-label">Curve & Advanced</span>
      <div class="control-group">
        <label>Curve Smooth <span id="curvatureSmoothingVal">5</span></label>
        <input type="range" id="curvatureSmoothing" value="5" min="1" max="15" step="1">
      </div>
      <div class="control-group">
        <label>Cont. Length <span id="continuationLengthVal">20</span></label>
        <input type="range" id="continuationLength" value="20" min="1" max="50" step="1">
      </div>
      <div class="control-group">
        <label>Cont. Bias <span id="continuationBiasVal">1.65</span></label>
        <input type="range" id="continuationBias" value="1.65" min="0" max="4" step="0.05">
      </div>
      <div class="control-group">
        <label>Wall Smooth <span id="wallSmoothVal">10</span></label>
        <input type="range" id="wallSmooth" value="10" min="1" max="10" step="1">
      </div>
    </div>

    <!-- End Caps & Taper -->
    <details style="background: #0f3460; padding: 10px; border-radius: 4px;">
      <summary style="cursor: pointer; font-weight: bold; color: #e94560;">End Caps & Taper</summary>
      <div class="section-caps" style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px;">
        <div class="control-group">
          <label><input type="checkbox" id="enableCaps"> Enable Caps</label>
        </div>
        <div class="control-group">
          <label>Tip Taper <span id="tipTaperVal">0</span></label>
          <input type="range" id="tipTaper" value="0" min="0" max="1" step="0.05">
        </div>
        <div class="control-group">
          <label>Taper Length <span id="tipTaperLengthVal">200</span></label>
          <input type="range" id="tipTaperLength" value="200" min="10" max="200" step="5">
        </div>
        <div class="control-group">
          <label>Cap Count <span id="capFiberCountVal">19</span></label>
          <input type="range" id="capFiberCount" value="19" min="1" max="30" step="1">
        </div>
        <div class="control-group">
          <label>Cap Gather <span id="capGatherLengthVal">10</span></label>
          <input type="range" id="capGatherLength" value="10" min="5" max="50" step="1">
        </div>
        <div class="control-group">
          <label>Cap Bow Angle <span id="capBowAngleVal">-5</span>°</label>
          <input type="range" id="capBowAngle" value="-5" min="-180" max="180" step="5">
        </div>
        <div class="control-group">
          <label>Cap Bow Strength <span id="capBowStrengthVal">1.4</span></label>
          <input type="range" id="capBowStrength" value="1.4" min="0" max="3" step="0.1">
        </div>
        <div class="control-group">
          <label>Cap Landing <span id="capLandingDepthVal">0.8</span></label>
          <input type="range" id="capLandingDepth" value="0.8" min="0" max="1" step="0.05">
        </div>
      </div>
    </details>

    <!-- Spouts -->
    <details style="background: #0f3460; padding: 10px; border-radius: 4px;">
      <summary style="cursor: pointer; font-weight: bold; color: #e94560;">Spouts</summary>
      <div class="section-spouts" style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px;">
        <div class="control-group">
          <label>Spout Count <span id="spoutFiberCountVal">0</span></label>
          <input type="range" id="spoutFiberCount" value="0" min="0" max="15" step="1">
        </div>
        <div class="control-group">
          <label>Spout Length <span id="spoutLengthVal">50</span></label>
          <input type="range" id="spoutLength" value="50" min="10" max="150" step="5">
        </div>
        <div class="control-group">
          <label>Spout Spread <span id="spoutSpreadVal">30</span>°</label>
          <input type="range" id="spoutSpread" value="30" min="0" max="90" step="5">
        </div>
        <div class="control-group">
          <label>Spout Gravity <span id="spoutGravityVal">0.3</span></label>
          <input type="range" id="spoutGravity" value="0.3" min="0" max="1" step="0.1">
        </div>
        <div class="control-group">
          <label><input type="checkbox" id="spoutAtStart"> Spout at Start</label>
        </div>
      </div>
    </details>

    <!-- Path Scaling -->
    <details open style="background: #0f3460; padding: 10px; border-radius: 4px;">
      <summary style="cursor: pointer; font-weight: bold; color: #e94560;">Path Scaling</summary>
      <div class="section-scaling" style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px;">
        <div class="control-group">
          <label>Reference Length <span id="referencePathLengthVal">1650</span>px</label>
          <input type="range" id="referencePathLength" value="1650" min="100" max="3500" step="25">
        </div>
        <div class="control-group">
          <label>Scale Power <span id="scalePathPowerVal">0.01</span></label>
          <input type="range" id="scalePathPower" value="0.01" min="0.01" max="3" step="0.01">
        </div>
        <div class="control-group">
          <label>Bow Scale Power <span id="scaleBowPowerVal">0.25</span></label>
          <input type="range" id="scaleBowPower" value="0.25" min="0" max="2" step="0.05">
        </div>
      </div>
    </details>

    <!-- Display -->
    <div class="control-section section-display">
      <span class="control-section-label">Display</span>
      <div class="control-group">
        <label>View Scale <span id="scaleVal">1</span></label>
        <input type="range" id="scale" value="1" min="0.25" max="2" step="0.05">
      </div>
      <button id="exportSvg" style="background: #0f3460;">Export SVG</button>
    </div>

    <!-- Debug (collapsed by default) -->
    <details style="background: #1a1a2e; padding: 10px; border-radius: 4px;">
      <summary style="cursor: pointer; font-weight: bold; color: #888;">Debug</summary>
      <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px;">
        <div class="control-group">
          <label><input type="checkbox" id="showDebug"> Show Debug</label>
        </div>
        <div class="control-group">
          <label><input type="checkbox" id="showWallPoints"> Show Wall Points</label>
        </div>
        <div class="control-group">
          <label><input type="checkbox" id="experimentalCurveMode"> Experimental Curve Mode</label>
        </div>
        <div class="control-group">
          <label>Redistribution <span id="redistributionFactorVal">0</span></label>
          <input type="range" id="redistributionFactor" value="0" min="0" max="2" step="0.1">
        </div>
        <div class="control-group">
          <label>Inside Thin <span id="insideThinningVal">0</span></label>
          <input type="range" id="insideThinning" value="0" min="0" max="1" step="0.05">
        </div>
      </div>
    </details>

    <div class="stats" id="stats">Ready</div>
  </div>
  <div class="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <script type="module">
    // ========================================================================
    // Inline Braid Engine (simplified for standalone test)
    // ========================================================================

    const BASE_ZIGZAG_AMPLITUDE = 30;
    const BASE_WALL_WIDTH = 50;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function normalizeVector(vec) {
      const len = Math.hypot(vec.x, vec.y) || 1;
      return { x: vec.x / len, y: vec.y / len };
    }

    function lerpVector(v1, v2, t) {
      return {
        x: v1.x + (v2.x - v1.x) * t,
        y: v1.y + (v2.y - v1.y) * t
      };
    }

    function rotateVector(v, angleDegrees) {
      const rad = angleDegrees * Math.PI / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      return {
        x: v.x * cos - v.y * sin,
        y: v.x * sin + v.y * cos
      };
    }

    function blendDirection(sourceDir, targetDir, bias) {
      const mixed = {
        x: sourceDir.x * (1 - bias) + targetDir.x * bias,
        y: sourceDir.y * (1 - bias) + targetDir.y * bias
      };
      return normalizeVector(mixed);
    }

    function quadraticPoint(p0, p1, p2, t) {
      const mt = 1 - t;
      return {
        x: mt * mt * p0.x + 2 * mt * t * p1.x + t * t * p2.x,
        y: mt * mt * p0.y + 2 * mt * t * p1.y + t * t * p2.y
      };
    }

    function calculateArcLengths(points) {
      const lengths = [0];
      for (let i = 1; i < points.length; i++) {
        const dx = points[i].x - points[i - 1].x;
        const dy = points[i].y - points[i - 1].y;
        lengths.push(lengths[i - 1] + Math.hypot(dx, dy));
      }
      return lengths;
    }

    function sampleCurveByArcLength(rail, lengths, param) {
      if (!rail || rail.length === 0) return { x: 0, y: 0 };
      if (rail.length === 1) return { ...rail[0] };

      const totalLength = lengths[lengths.length - 1];
      const targetLength = clamp(param, 0, 1) * totalLength;

      for (let i = 0; i < rail.length - 1; i++) {
        const lenA = lengths[i];
        const lenB = lengths[i + 1];

        if (targetLength >= lenA && targetLength <= lenB) {
          const segmentLength = lenB - lenA;
          const t = segmentLength > 0 ? (targetLength - lenA) / segmentLength : 0;
          const a = rail[i];
          const b = rail[i + 1];
          return {
            x: a.x + (b.x - a.x) * t,
            y: a.y + (b.y - a.y) * t
          };
        }
      }

      return { ...rail[rail.length - 1] };
    }

    // Compute total length of a polyline
    function computePolylineLength(points) {
      let length = 0;
      for (let i = 1; i < points.length; i++) {
        length += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
      }
      return length;
    }

    // Extract a segment of a polyline between two t values (0-1)
    function extractPolylineSegment(points, tStart, tEnd) {
      if (points.length < 2) return [...points];
      if (tStart >= tEnd) return [];

      const lengths = calculateArcLengths(points);
      const totalLength = lengths[lengths.length - 1];
      const startLen = tStart * totalLength;
      const endLen = tEnd * totalLength;

      const segment = [];
      let started = false;

      for (let i = 0; i < points.length - 1; i++) {
        const lenA = lengths[i];
        const lenB = lengths[i + 1];

        // Check if this edge contains our start point
        if (!started && startLen >= lenA && startLen <= lenB) {
          const segLen = lenB - lenA;
          const t = segLen > 0 ? (startLen - lenA) / segLen : 0;
          segment.push({
            x: points[i].x + (points[i + 1].x - points[i].x) * t,
            y: points[i].y + (points[i + 1].y - points[i].y) * t
          });
          started = true;
        }

        // Check if this edge contains our end point
        if (started && endLen >= lenA && endLen <= lenB) {
          const segLen = lenB - lenA;
          const t = segLen > 0 ? (endLen - lenA) / segLen : 0;
          segment.push({
            x: points[i].x + (points[i + 1].x - points[i].x) * t,
            y: points[i].y + (points[i + 1].y - points[i].y) * t
          });
          break;
        }

        // Add the end of this edge if we've started but haven't ended
        if (started && lenB < endLen) {
          segment.push({ ...points[i + 1] });
        }
      }

      return segment;
    }

    // Split a fiber polyline into segments with gaps
    function splitFiberWithGaps(points, numBreaks, gapSize, opts) {
      const totalLength = computePolylineLength(points);
      if (totalLength < gapSize * (numBreaks + 1)) {
        return [points]; // Too short to break
      }

      const segments = [];
      const gapT = gapSize / totalLength;

      // Generate break positions with coherence
      const breakPositions = [];
      for (let b = 0; b < numBreaks; b++) {
        // Mix random position with coherent seed
        const randomT = 0.2 + Math.random() * 0.6; // Keep breaks in middle 60%
        const coherentT = 0.3 + ((opts.pairSeed + b * 0.3 + opts.fiberIndex * 0.1) % 1) * 0.4;
        const t = randomT * (1 - opts.coherence) + coherentT * opts.coherence;
        breakPositions.push(clamp(t, 0.15, 0.85));
      }
      breakPositions.sort((a, b) => a - b);

      // Split points at break positions, removing gap-sized sections
      let lastEnd = 0;
      for (const breakT of breakPositions) {
        const gapStart = Math.max(lastEnd, breakT - gapT / 2);
        const gapEnd = Math.min(1, breakT + gapT / 2);

        // Extract segment from lastEnd to gapStart
        if (gapStart > lastEnd + 0.05) {
          const seg = extractPolylineSegment(points, lastEnd, gapStart);
          if (seg.length > 1) segments.push(seg);
        }
        lastEnd = gapEnd;
      }

      // Final segment
      if (lastEnd < 0.95) {
        const finalSeg = extractPolylineSegment(points, lastEnd, 1);
        if (finalSeg.length > 1) segments.push(finalSeg);
      }

      return segments.length > 0 ? segments : [points];
    }

    // Triangle wave for sharp pointy zigzags
    function triangleWave(t) {
      // Normalize to 0-1 range within each period
      const normalized = ((t / Math.PI) % 2 + 2) % 2;
      // Triangle: go up 0->1 in first half, down 1->0 in second half
      if (normalized < 1) {
        return normalized * 2 - 1;  // -1 to 1
      } else {
        return 1 - (normalized - 1) * 2;  // 1 to -1
      }
    }

    // Pseudo-random function for consistent jitter per cycle
    function cycleRandom(cycleIndex) {
      const seed = cycleIndex * 9999;
      return Math.abs(Math.sin(seed)) * 2 - 1;
    }

    function zigzagWave(y, params) {
      const { frequency, cycleJitter, zigzagPhase = 0 } = params;
      const phaseRad = (zigzagPhase * Math.PI) / 180;

      // Apply frequency jitter - varies wavelength along braid (makes some cycles wider/narrower)
      if (cycleJitter > 0) {
        // Walk through cycles with variable widths, accumulating position
        const targetPos = y / params.braidLength;  // 0-1 along braid
        let currentPos = 0;
        let accumulatedPhase = 0;
        let cycleIndex = 0;

        while (currentPos < targetPos && cycleIndex < frequency * 2) {
          // Each cycle has its own width multiplier (some wider, some narrower)
          const jitterAmount = cycleRandom(cycleIndex) * cycleJitter * 0.4;
          const cycleWidthMult = 1 + jitterAmount;  // Range: 0.6 to 1.4 at max jitter
          const baseCycleWidth = 1 / frequency;
          const thisCycleWidth = baseCycleWidth * cycleWidthMult;
          const cycleEnd = currentPos + thisCycleWidth;

          if (targetPos >= cycleEnd) {
            // Fully past this cycle
            accumulatedPhase += Math.PI;
            currentPos = cycleEnd;
            cycleIndex++;
          } else {
            // Within this cycle - interpolate
            const progressInCycle = (targetPos - currentPos) / thisCycleWidth;
            accumulatedPhase += progressInCycle * Math.PI;
            break;
          }
        }

        const t = accumulatedPhase + phaseRad;
        return triangleWave(t);
      }

      // No jitter - use simple linear progression
      const cycles = frequency;
      const t = (y / params.braidLength) * cycles * Math.PI + phaseRad;
      return triangleWave(t);
    }

    function bounceWave(angle, phase, bounceFreq) {
      const modulatedAngle = angle * bounceFreq + phase;
      // |sin(x)| creates a bounce pattern that always pushes outward from baseline
      // instead of oscillating through center
      return Math.abs(Math.sin(modulatedAngle));
    }

    /**
     * Smoothstep easing function for smooth transitions
     */
    function smoothstep(t) {
      const clamped = clamp(t, 0, 1);
      return clamped * clamped * (3 - 2 * clamped);
    }

    /**
     * Calculate global taper scale for braid ends
     * Tapers smoothly from 0 at the ends to 1 at tipTaperLength distance from ends
     */
    function getBraidTaperScale(y, params) {
      const { braidLength, tipTaper, tipTaperLength = 50 } = params;
      if (tipTaper === 0 || tipTaperLength <= 0) return 1;

      // Guard against very small taper lengths
      const safeTaperLength = Math.max(1, tipTaperLength);

      // Calculate distance from nearest end
      const distFromStart = y;
      const distFromEnd = braidLength - y;
      const distFromNearestEnd = Math.min(distFromStart, distFromEnd);

      // Normalized progress from end (0 at end, 1 at full distance)
      const t = clamp(distFromNearestEnd / safeTaperLength, 0, 1);

      // Apply smoothstep easing for smooth transition
      const easedT = smoothstep(t);

      // Scale: 0 at end (when tipTaper=1), 1 at full distance
      return 1 - tipTaper * (1 - easedT);
    }

    function generateCenterX(phaseY, actualY, params) {
      const wave = zigzagWave(phaseY, params);
      const amplitude = BASE_ZIGZAG_AMPLITUDE * (params.zigzagScale || 1);
      const taper = getBraidTaperScale(actualY, params);
      return wave * amplitude * taper;
    }

    function generateWallX(phaseY, actualY, side, params) {
      const { leftWallPhase = 0, rightWallPhase = 0, wallScale, wallSeparation = 100, wallFrequency, frequency, cycleJitter = 0 } = params;
      // Wall uses its own frequency
      const wFreq = wallFrequency ?? frequency;
      const sidePhase = side === 'left' ? leftWallPhase : rightWallPhase;
      const phase = (sidePhase * Math.PI) / 180;

      let angle;
      if (cycleJitter > 0) {
        // Apply aligned frequency jitter - wall cycles align with zigzag cycle pairs
        // Since zigzag = 2x wall freq, each wall cycle spans 2 zigzag cycles
        // Use same jitter pattern as zigzag but mapped to wall cycles
        const targetPos = phaseY / params.braidLength;
        let currentPos = 0;
        let accumulatedAngle = 0;
        let wallCycleIndex = 0;

        while (currentPos < targetPos && wallCycleIndex < wFreq * 2) {
          // Each wall cycle corresponds to zigzag cycles (wallCycleIndex * 2) and (wallCycleIndex * 2 + 1)
          // Average their jitter to get wall cycle width
          const zigzagIdx1 = wallCycleIndex * 2;
          const zigzagIdx2 = wallCycleIndex * 2 + 1;
          const jitter1 = cycleRandom(zigzagIdx1) * cycleJitter * 0.4;
          const jitter2 = cycleRandom(zigzagIdx2) * cycleJitter * 0.4;
          const avgJitter = (jitter1 + jitter2) / 2;
          const cycleWidthMult = 1 + avgJitter;
          const baseCycleWidth = 1 / wFreq;
          const thisCycleWidth = baseCycleWidth * cycleWidthMult;
          const cycleEnd = currentPos + thisCycleWidth;

          if (targetPos >= cycleEnd) {
            accumulatedAngle += Math.PI;
            currentPos = cycleEnd;
            wallCycleIndex++;
          } else {
            const progressInCycle = (targetPos - currentPos) / thisCycleWidth;
            accumulatedAngle += progressInCycle * Math.PI;
            break;
          }
        }
        angle = accumulatedAngle;
      } else {
        angle = (phaseY / params.braidLength) * wFreq * Math.PI;
      }

      // bounceFreq=1 since we now have explicit wall frequency control
      const envelope = bounceWave(angle, phase, 1);
      const amplitude = BASE_WALL_WIDTH * wallScale;
      const translationSign = side === 'left' ? -1 : 1;
      const translation = translationSign * wallSeparation * 0.5;

      // Apply taper to both amplitude AND translation separately
      // This makes walls collapse toward center at the braid ends
      const taper = getBraidTaperScale(actualY, params);
      const taperedAmplitude = translationSign * envelope * amplitude * taper;
      const taperedTranslation = translation * taper;

      return taperedAmplitude + taperedTranslation;
    }

    function sampleBoundary(generator, params) {
      const samples = [];
      const { braidLength, sampleSpacing, arcLengths } = params;
      const count = Math.max(5, Math.ceil(braidLength / sampleSpacing));
      for (let i = 0; i <= count; i++) {
        const physicalY = (i / count) * braidLength;
        // Use arc-length adjusted Y for wave generation if backbone is curved
        const phaseY = arcLengths
          ? getFrequencyAdjustedY(physicalY, braidLength, arcLengths)
          : physicalY;
        // Pass both phaseY (for waves) and physicalY (for taper)
        samples.push({ x: generator(phaseY, physicalY, params), y: physicalY, index: i });
      }
      return samples;
    }

    function interpolateSamplesAt(samples, targetY) {
      if (!samples || samples.length === 0) return { x: 0, y: targetY };
      if (targetY <= samples[0].y) return { x: samples[0].x, y: targetY };
      if (targetY >= samples[samples.length - 1].y) {
        return { x: samples[samples.length - 1].x, y: targetY };
      }
      for (let i = 0; i < samples.length - 1; i++) {
        const a = samples[i];
        const b = samples[i + 1];
        if (targetY >= a.y && targetY <= b.y) {
          const t = (targetY - a.y) / (b.y - a.y);
          return { x: a.x + (b.x - a.x) * t, y: targetY };
        }
      }
      return { x: samples[0].x, y: targetY };
    }

    function detectExtrema(samples) {
      const extrema = [];
      for (let i = 1; i < samples.length - 1; i++) {
        const prevDx = samples[i].x - samples[i - 1].x;
        const nextDx = samples[i + 1].x - samples[i].x;
        if (prevDx === 0 || nextDx === 0) continue;
        if (prevDx * nextDx < 0) {
          extrema.push({ ...samples[i], type: prevDx > 0 ? 'peak' : 'trough' });
        }
      }
      return extrema;
    }

    function estimateTangent(samples, index) {
      const prev = samples[Math.max(0, index - 1)];
      const next = samples[Math.min(samples.length - 1, index + 1)];
      const dx = next.x - prev.x;
      const dy = next.y - prev.y;
      const len = Math.hypot(dx, dy) || 1;
      return { x: dx / len, y: dy / len };
    }

    // Estimate tangent at a parametric position (0-1) along a rail using arc-length sampling
    function estimateRailTangent(rail, lengths, param) {
      if (!rail || rail.length < 2 || !lengths || lengths.length < 2) {
        return { x: 0, y: 1 }; // Default to vertical if invalid
      }
      const totalLength = lengths[lengths.length - 1] || 1;
      const targetLength = param * totalLength;

      // Find the index where we are
      let idx = 0;
      for (let i = 0; i < lengths.length - 1; i++) {
        if (lengths[i + 1] >= targetLength) {
          idx = i;
          break;
        }
        idx = i;
      }

      // Sample points slightly before and after for tangent
      const delta = 0.05;
      const paramBefore = Math.max(0, param - delta);
      const paramAfter = Math.min(1, param + delta);
      const pointBefore = sampleCurveByArcLength(rail, lengths, paramBefore);
      const pointAfter = sampleCurveByArcLength(rail, lengths, paramAfter);

      const dx = pointAfter.x - pointBefore.x;
      const dy = pointAfter.y - pointBefore.y;
      const len = Math.hypot(dx, dy) || 1;
      return { x: dx / len, y: dy / len };
    }

    // Get cycle index for a given Y position along the braid
    function getCycleIndexAtY(y, params) {
      const { frequency, cycleJitter, braidLength } = params;
      if (!cycleJitter || cycleJitter <= 0) {
        // No jitter - simple calculation
        return Math.floor((y / braidLength) * frequency);
      }

      // Walk through jittered cycles
      const targetPos = y / braidLength;
      let currentPos = 0;
      let cycleIndex = 0;

      while (currentPos < targetPos && cycleIndex < frequency * 2) {
        const jitterAmount = cycleRandom(cycleIndex) * cycleJitter * 0.4;
        const cycleWidthMult = 1 + jitterAmount;
        const baseCycleWidth = 1 / frequency;
        const thisCycleWidth = baseCycleWidth * cycleWidthMult;
        const cycleEnd = currentPos + thisCycleWidth;

        if (targetPos >= cycleEnd) {
          currentPos = cycleEnd;
          cycleIndex++;
        } else {
          break;
        }
      }
      return cycleIndex;
    }

    // Get the jitter multiplier for a specific cycle
    function getCycleJitterAmount(cycleIndex, cycleJitter) {
      if (!cycleJitter || cycleJitter <= 0) return 0;
      return cycleRandom(cycleIndex) * cycleJitter * 0.4;
    }

    function findWallPartner(centerExt, wallExtrema, side, params) {
      let bestMatch = null;
      let minDist = Infinity;

      // With |sin(x)| walls, we want to connect to where wall is CLOSEST to center
      // For left wall: 'peak' is closest (least negative x)
      // For right wall: 'trough' is closest (least positive x)
      // Actually with current detectExtrema logic:
      // - Left wall 'peak' = when wall moves from going-left to going-right (closest to center)
      // - Right wall 'trough' = when wall moves from going-right to going-left (closest to center)
      const targetType = side === 'left' ? 'peak' : 'trough';

      for (const wallExt of wallExtrema) {
        if (wallExt.claimed) continue;
        if (wallExt.type !== targetType) continue;
        const dy = wallExt.y - centerExt.y;
        const dist = Math.abs(dy);
        if (dist < minDist) {
          minDist = dist;
          bestMatch = wallExt;
        }
      }
      return bestMatch;
    }

    // ========================================================================
    // Arc-Length and Curvature Infrastructure
    // ========================================================================

    function computeBackboneArcLengths(backbone, sampleCount = 200) {
      const points = [];
      for (let i = 0; i <= sampleCount; i++) {
        points.push(backbone.getPointAt(i / sampleCount));
      }
      return calculateArcLengths(points);
    }

    function getFrequencyAdjustedY(y, braidLength, arcLengths) {
      const totalArcLength = arcLengths[arcLengths.length - 1];
      const t = clamp(y / braidLength, 0, 1);
      const idx = t * (arcLengths.length - 1);
      const i = Math.floor(idx);
      const frac = idx - i;
      const arcLen = arcLengths[i] + (arcLengths[Math.min(i + 1, arcLengths.length - 1)] - arcLengths[i]) * frac;
      return (arcLen / totalArcLength) * braidLength;
    }

    function computeBackboneCurvature(backbone, braidLength, sampleCount = 100, smoothingWindow = 5) {
      if (!backbone) return null;
      const epsilon = 1e-4;
      const raw = [];

      // Compute raw curvature
      for (let i = 0; i <= sampleCount; i++) {
        const t = i / sampleCount;
        const t0 = Math.max(0, t - epsilon);
        const t1 = Math.min(1, t + epsilon);

        const tan0 = backbone.getTangentAt(t0);
        const tan1 = backbone.getTangentAt(t1);

        let deltaAngle = Math.atan2(tan1.y, tan1.x) - Math.atan2(tan0.y, tan0.x);
        if (deltaAngle > Math.PI) deltaAngle -= 2 * Math.PI;
        if (deltaAngle < -Math.PI) deltaAngle += 2 * Math.PI;

        const p0 = backbone.getPointAt(t0);
        const p1 = backbone.getPointAt(t1);
        const arcLength = Math.hypot(p1.x - p0.x, p1.y - p0.y);
        const curvature = arcLength > 1e-6 ? deltaAngle / arcLength : 0;

        raw.push({ t, curvature });
      }

      // Apply moving average smoothing
      const smoothed = [];
      for (let i = 0; i < raw.length; i++) {
        let sum = 0, count = 0;
        for (let j = -smoothingWindow; j <= smoothingWindow; j++) {
          const idx = Math.max(0, Math.min(raw.length - 1, i + j));
          sum += raw[idx].curvature;
          count++;
        }
        smoothed.push({ t: raw[i].t, curvature: sum / count });
      }

      return smoothed;
    }

    function getCurvatureAt(curvatureSamples, t) {
      if (!curvatureSamples || curvatureSamples.length === 0) return 0;
      const count = curvatureSamples.length - 1;
      const idx = clamp(t, 0, 1) * count;
      const i = Math.floor(idx);
      const frac = idx - i;
      const a = curvatureSamples[Math.min(i, count)];
      const b = curvatureSamples[Math.min(i + 1, count)];
      return a.curvature + (b.curvature - a.curvature) * frac;
    }

    /**
     * Redistribute strand positions to bias toward curve inside
     */
    function redistribute(x_norm, shift) {
      // Clamp shift to safe range (prevents power going negative/zero)
      const safeShift = clamp(shift, -0.95, 0.95);

      // Ease shift to prevent overcompensation at low curvature
      const easedShift = safeShift * (2 - Math.abs(safeShift));

      const sign = Math.sign(x_norm);
      const t = Math.abs(x_norm);

      // Power-based redistribution
      // Positive shift compresses positive x (right), expands negative x (left)
      const power = sign > 0 ? (1 + easedShift) : (1 - easedShift);

      return Math.pow(t, power) * sign;
    }

    function createWarpFunction(backbone, braidLength, curvatureSamples = null, params = {}) {
      if (!backbone) return (point) => point;

      const { redistributionFactor = 0, wallSeparation = 100, experimentalCurveMode = false } = params;

      return (point) => {
        const t = clamp(point.y / braidLength, 0, 1);
        const base = backbone.getPointAt(t);
        const tangent = backbone.getTangentAt(t);
        const normal = { x: -tangent.y, y: tangent.x };

        let adjustedX = point.x;

        // Apply curvature-based redistribution
        if (curvatureSamples && redistributionFactor > 0) {
          const curvature = getCurvatureAt(curvatureSamples, t);
          const halfWidth = wallSeparation / 2;
          const x_norm = point.x / halfWidth;
          // Scale curvature by wallSeparation to get dimensionless quantity
          // (curvature is rad/px, wallSeparation is px, so product is radians)
          const scaledCurvature = curvature * wallSeparation;
          const shift = -scaledCurvature * redistributionFactor;
          const remapped = redistribute(x_norm, shift);
          adjustedX = remapped * halfWidth;
        }

        // Reduce wall wave amplitude and clamp on inside of tight curves
        // (Only when experimental curve mode is enabled)
        if (experimentalCurveMode && curvatureSamples) {
          const curvature = getCurvatureAt(curvatureSamples, t);

          if (curvature !== 0) {
            const radius = 1 / Math.abs(curvature);
            const isWallPoint = Math.abs(adjustedX) > 30;

            // Reduce wall wave amplitude ONLY on the inside of tight curves
            if (isWallPoint) {
              const baseOffset = (wallSeparation || 100) / 2;
              const sign = adjustedX > 0 ? 1 : -1;
              const expectedBase = sign * baseOffset;
              const waveComponent = adjustedX - expectedBase;

              // Determine if this wall is on the inside of the curve
              // In screen coords (Y down): curvature > 0 = counterclockwise = curving LEFT
              // curvature > 0 means curving left, so right wall (adjustedX > 0) is inside
              // curvature < 0 means curving right, so left wall (adjustedX < 0) is inside
              const isOnInside = (curvature > 0 && adjustedX > 0) || (curvature < 0 && adjustedX < 0);

              // For tight curves, reduce wave amplitude on inside wall only
              const threshold = baseOffset * 3;
              let scaleFactor = 1;
              if (isOnInside && radius < threshold) {
                // More aggressive: linear scale but clamp harder at small radii
                scaleFactor = Math.max(0, (radius - baseOffset) / (threshold - baseOffset));
                // Apply quartic for very aggressive reduction on inside
                scaleFactor = scaleFactor * scaleFactor * scaleFactor * scaleFactor;

                // Also pull the wall inward toward backbone for very tight curves
                // This prevents the inside wall from extending too far
                const shrinkThreshold = baseOffset * 2.2; // ~115.5 for baseOffset 52.5
                if (radius < shrinkThreshold) {
                  // Shrink the base offset itself when radius is tight
                  // At radius = baseOffset, shrinkFactor = 0 (wall on backbone)
                  // At radius = shrinkThreshold, shrinkFactor = 1 (full offset)
                  const shrinkFactor = Math.max(0, (radius - baseOffset) / (shrinkThreshold - baseOffset));
                  const shrunkBase = expectedBase * shrinkFactor;
                  adjustedX = shrunkBase + waveComponent * scaleFactor;
                } else {
                  adjustedX = expectedBase + waveComponent * scaleFactor;
                }

                // Debug: log wave reduction for inside wall (focus on tight curves)
                if (!window.waveDebugCount) window.waveDebugCount = 0;
                if (window.waveDebugCount < 20 && radius < shrinkThreshold) {
                  const shrinkFactor = Math.max(0, (radius - baseOffset) / (shrinkThreshold - baseOffset));
                  console.log(`[WAVE DEBUG] INSIDE TIGHT: radius=${radius.toFixed(1)}, shrinkFactor=${shrinkFactor.toFixed(3)}, waveScale=${scaleFactor.toFixed(4)}, adjustedX=${adjustedX.toFixed(1)}`);
                  window.waveDebugCount++;
                }
              } else {
                adjustedX = expectedBase + waveComponent;
              }
            }

            // Also apply hard clamp as safety net on inside wall
            // curvature > 0 = curving left, inside is positive X (right wall)
            // curvature < 0 = curving right, inside is negative X (left wall)
            const maxOffset = radius * 0.85;
            if (curvature > 0 && adjustedX > 0) {
              adjustedX = Math.min(adjustedX, maxOffset);
            } else if (curvature < 0 && adjustedX < 0) {
              adjustedX = Math.max(adjustedX, -maxOffset);
            }
          }
        } else {
          // DEBUG: Log if curvatureSamples is missing
          if (!window.noSamplesLogged) {
            console.log('[CLAMP DEBUG] No curvatureSamples in warp function');
            window.noSamplesLogged = true;
          }
        }

        return {
          x: base.x + adjustedX * normal.x,
          y: base.y + adjustedX * normal.y
        };
      };
    }

    // Remove points that cause the path to fold back on itself
    // This happens when wall points bunch up on the inside of tight curves
    function removeFoldedPoints(points, minSpacing = 15) {
      if (points.length < 3) return points;

      const result = [points[0]];
      let removedCount = 0;

      // Track cumulative turn angle to detect fold regions
      let cumulativeAngle = 0;
      let lastAngle = null;

      for (let i = 1; i < points.length - 1; i++) {
        const prev = result[result.length - 1];
        const curr = points[i];
        const next = points[i + 1];

        // Vector from prev to curr
        const v1x = curr.x - prev.x;
        const v1y = curr.y - prev.y;
        const len1 = Math.sqrt(v1x * v1x + v1y * v1y);

        // Skip if current point is too close to previous (bunched)
        if (len1 < minSpacing) {
          removedCount++;
          continue;
        }

        // Vector from curr to next
        const v2x = next.x - curr.x;
        const v2y = next.y - curr.y;
        const len2 = Math.sqrt(v2x * v2x + v2y * v2y);

        // Check if path is turning sharply back
        if (len1 > 0.1 && len2 > 0.1) {
          const dot = v1x * v2x + v1y * v2y;
          const cross = v1x * v2y - v1y * v2x;

          // Calculate angle of turn
          const angle = Math.atan2(cross, dot);

          // Track cumulative angle in one direction
          if (lastAngle !== null) {
            // If turn continues in same direction, accumulate
            if ((angle > 0 && lastAngle > 0) || (angle < 0 && lastAngle < 0)) {
              cumulativeAngle += angle;
            } else {
              // Direction changed, reset
              cumulativeAngle = angle;
            }
          } else {
            cumulativeAngle = angle;
          }
          lastAngle = angle;

          // If we've accumulated more than 120 degrees of turn, we're likely in a fold
          if (Math.abs(cumulativeAngle) > Math.PI * 0.67) {
            removedCount++;
            cumulativeAngle = 0; // Reset after detecting fold
            continue;
          }

          // If dot product is negative, vectors are pointing in opposite-ish directions
          if (dot < 0) {
            removedCount++;
            continue;
          }

          // Also check for very tight cusps
          const crossMag = Math.abs(cross);
          if (crossMag > len1 * len2 * 0.8 && dot < len1 * len2 * 0.6) {
            removedCount++;
            continue;
          }
        }

        result.push(curr);
        // Reset cumulative angle when we accept a point
        if (Math.abs(cumulativeAngle) < Math.PI * 0.3) {
          cumulativeAngle = 0;
        }
      }

      // Always include last point
      result.push(points[points.length - 1]);

      return result;
    }

    /**
     * Decimate wall points on the inside of tight curves
     * This runs BEFORE removeFoldedPoints to thin out bunched areas proactively
     * @param {Array} warpedPoints - Points already warped to curve space
     * @param {Array} originalSamples - Original samples (for Y position to get curvature)
     * @param {Array} curvatureSamples - Curvature data for the backbone
     * @param {Object} params - Parameters including wallSeparation, braidLength, thinningFactor
     * @param {string} side - 'left' or 'right' wall
     */
    function decimateInsideCurve(warpedPoints, originalSamples, curvatureSamples, params, side) {
      if (!curvatureSamples || warpedPoints.length < 3) return warpedPoints;

      const { wallSeparation = 100, braidLength = 800, insideThinning = 0, experimentalCurveMode = false } = params;
      // Only decimate when experimental curve mode is enabled AND thinning > 0
      if (!experimentalCurveMode || insideThinning <= 0) return warpedPoints;

      const halfWidth = wallSeparation / 2;
      const result = [warpedPoints[0]];
      let removedCount = 0;

      for (let i = 1; i < warpedPoints.length - 1; i++) {
        const sample = originalSamples[i];
        if (!sample) {
          result.push(warpedPoints[i]);
          continue;
        }

        const t = clamp(sample.y / braidLength, 0, 1);
        const curvature = getCurvatureAt(curvatureSamples, t);

        // Skip if straight section
        if (curvature === 0) {
          result.push(warpedPoints[i]);
          continue;
        }

        const radius = 1 / Math.abs(curvature);
        // curvature > 0 = curving left, right wall is inside
        // curvature < 0 = curving right, left wall is inside
        const isOnInside = (curvature > 0 && side === 'right') ||
          (curvature < 0 && side === 'left');

        // Not on inside - keep the point
        if (!isOnInside) {
          result.push(warpedPoints[i]);
          continue;
        }

        // On inside of curve - check if we should thin
        // Tighter curves get more aggressive thinning
        const tightnessRatio = halfWidth / radius; // Higher = tighter
        const threshold = halfWidth * 5; // Extended range for smoother falloff

        if (radius < threshold) {
          // Calculate min distance to previous point based on tightness and slider
          const baseDist = 4; // Normal sample spacing
          // At max tightness (radius = halfWidth), skip factor = insideThinning * 12
          // At threshold, skip factor = 0
          const skipFactor = insideThinning * 12 * Math.pow((threshold - radius) / (threshold - halfWidth), 1.5);
          const minDist = baseDist * (1 + skipFactor);

          const prev = result[result.length - 1];
          const curr = warpedPoints[i];
          const dist = Math.hypot(curr.x - prev.x, curr.y - prev.y);

          if (dist < minDist) {
            removedCount++;
            continue;
          }
        }

        result.push(warpedPoints[i]);
      }

      // Always include last point
      result.push(warpedPoints[warpedPoints.length - 1]);

      if (removedCount > 0) {
        console.log(`[DECIMATE] ${side} wall: removed ${removedCount} of ${warpedPoints.length} points (thinning=${insideThinning.toFixed(2)})`);
      }

      return result;
    }

    function buildContinuationPairs(leftSamples, rightSamples, centerSamples, centerExtrema, leftExtrema, rightExtrema, params) {
      const pairs = [];
      const { tipTaperLength = 50, braidLength, tipTaper = 0 } = params;

      // Only apply safe zone if taper is significant
      const useSafeZone = tipTaper > 0.3;
      const safeMargin = useSafeZone ? tipTaperLength * 0.8 : 0;

      centerExtrema.forEach((tip) => {
        if (tip.paired) return;

        // Skip extrema in taper zones - caps handle these
        if (useSafeZone && (tip.y < safeMargin || tip.y > braidLength - safeMargin)) {
          return;
        }

        const side = tip.x >= 0 ? 'right' : 'left';
        const wallSamples = side === 'left' ? leftSamples : rightSamples;
        const wallExtrema = side === 'left' ? leftExtrema : rightExtrema;

        const trough = findWallPartner(tip, wallExtrema, side, params);
        if (!trough) return;

        trough.claimed = true;
        tip.paired = true;

        const contLength = params.continuationLength || 20;
        const contBias = clamp(params.continuationBias ?? 0.7, 0, 1);

        const troughTan = estimateTangent(wallSamples, trough.index);
        const tipTan = estimateTangent(centerSamples, tip.index);

        const diagVec = normalizeVector({ x: tip.x - trough.x, y: tip.y - trough.y });

        const startDir = blendDirection(troughTan, diagVec, contBias);
        const endDir = blendDirection({ x: -tipTan.x, y: -tipTan.y }, { x: -diagVec.x, y: -diagVec.y }, contBias);

        const handle1 = { x: trough.x + startDir.x * contLength, y: trough.y + startDir.y * contLength };
        const handle2 = { x: tip.x + endDir.x * contLength, y: tip.y + endDir.y * contLength };

        const continuationRail = [];
        const segmentCount = 24;
        for (let i = 0; i <= segmentCount; i++) {
          const t = i / segmentCount;
          const mt = 1 - t;
          continuationRail.push({
            x: mt * mt * mt * trough.x + 3 * mt * mt * t * handle1.x + 3 * mt * t * t * handle2.x + t * t * t * tip.x,
            y: mt * mt * mt * trough.y + 3 * mt * mt * t * handle1.y + 3 * mt * t * t * handle2.y + t * t * t * tip.y
          });
        }
        const continuationLengths = calculateArcLengths(continuationRail);

        const wallRail = [];
        const wallSpan = tip.y - trough.y;
        const wallSmoothFactor = params.wallSmooth || 1;
        const wallSegments = Math.max(8, Math.ceil(wallSpan / 6)) * wallSmoothFactor;
        for (let i = 0; i <= wallSegments; i++) {
          const ty = trough.y + wallSpan * (i / wallSegments);
          wallRail.push(interpolateSamplesAt(wallSamples, ty));
        }
        const wallLengths = calculateArcLengths(wallRail);

        const centerRail = [];
        const centerSpan = tip.y - trough.y;
        const centerSegments = Math.max(8, Math.ceil(centerSpan / 6)) * wallSmoothFactor;
        for (let i = 0; i <= centerSegments; i++) {
          const ty = trough.y + centerSpan * (i / centerSegments);
          centerRail.push(interpolateSamplesAt(centerSamples, ty));
        }
        const centerLengths = calculateArcLengths(centerRail);

        const centerTips = centerExtrema.filter(e => e.type === 'peak' || e.type === 'trough');
        const tipIndexInList = centerTips.findIndex(e => e.index === tip.index);
        const nextTipY = tipIndexInList < centerTips.length - 1 ? centerTips[tipIndexInList + 1].y : tip.y + centerSpan;

        const landingRail = [];
        const landingSpan = nextTipY - tip.y;
        const landingSegments = Math.max(8, Math.ceil(landingSpan / 6));
        for (let i = 0; i <= landingSegments; i++) {
          const ty = tip.y + landingSpan * (i / landingSegments);
          landingRail.push(interpolateSamplesAt(centerSamples, ty));
        }
        const landingLengths = calculateArcLengths(landingRail);

        pairs.push({
          side, wall: trough, center: tip, tipIndex: tip.index,
          yStart: trough.y, yEnd: tip.y,
          wallRail, wallLengths, centerRail, centerLengths,
          diagRail: continuationRail, diagLengths: continuationLengths,
          landingRail, landingLengths
        });
      });

      return pairs;
    }

    function assignSideOrdering(continuationPairs) {
      const left = continuationPairs.filter(p => p.side === 'left').sort((a, b) => a.tipIndex - b.tipIndex);
      const right = continuationPairs.filter(p => p.side === 'right').sort((a, b) => a.tipIndex - b.tipIndex);

      left.forEach((pair, i) => { pair.sideIndex = i; });
      right.forEach((pair, i) => { pair.sideIndex = i; });

      // For left pairs: find the right pair whose tipIndex is just after this one
      // (fibers from left pair should land on the next right pair's rail)
      left.forEach((pair, i) => {
        // Find the first right pair with tipIndex > this pair's tipIndex
        const target = right.find(r => r.tipIndex > pair.tipIndex);
        if (target) {
          pair.oppositeLandingRail = target.landingRail;
          pair.oppositeLandingLengths = target.landingLengths;
          pair.oppositeIndex = target.sideIndex;
        } else if (right.length > 0) {
          // Fallback: use index-based mapping like the original (i+1 clamped)
          const targetIdx = Math.min(right.length - 1, i + 1);
          pair.oppositeLandingRail = right[targetIdx].landingRail;
          pair.oppositeLandingLengths = right[targetIdx].landingLengths;
          pair.oppositeIndex = right[targetIdx].sideIndex;
        }
      });

      // For right pairs: find the left pair whose tipIndex is just after this one
      // (fibers from right pair should land on the next left pair's rail)
      right.forEach((pair, i) => {
        // Find the first left pair with tipIndex > this pair's tipIndex
        const target = left.find(l => l.tipIndex > pair.tipIndex);
        if (target) {
          pair.oppositeLandingRail = target.landingRail;
          pair.oppositeLandingLengths = target.landingLengths;
          pair.oppositeIndex = target.sideIndex;
        } else if (left.length > 0) {
          // Fallback: use index-based mapping like the original (i clamped)
          const targetIdx = Math.min(left.length - 1, i);
          pair.oppositeLandingRail = left[targetIdx].landingRail;
          pair.oppositeLandingLengths = left[targetIdx].landingLengths;
          pair.oppositeIndex = left[targetIdx].sideIndex;
        }
      });
    }

    function buildFiberCurves(continuationPairs, leftSamples, rightSamples, centerSamples, params, curvatureSamples = null) {
      const curves = [];
      const spacing = Math.max(1, params.fiberSpacing || 8);
      const totalFibers = params.fiberCount ? Math.max(1, Math.round(params.fiberCount)) : Math.max(3, Math.floor(spacing));
      const bias = clamp(params.fiberBias || 0, 0, 1);
      const landingOffset = clamp(params.fiberLanding ?? 0.0, 0, 1);
      const landingSpread = clamp(params.landingSpread ?? 1.0, 0.1, 1);
      const bowStrength = clamp(params.fiberBow ?? 0.5, 0, 1);
      const arcTangentBlend = clamp(params.arcTangentBlend ?? 0, -1, 1);
      const arcLean = params.arcLean ?? 0;

      for (let pairIdx = 0; pairIdx < continuationPairs.length; pairIdx++) {
        const pair = continuationPairs[pairIdx];
        // Find the next pair on the SAME side (skip one, since pairs alternate left/right)
        const nextSameSidePair = continuationPairs[pairIdx + 2] || null;
        const diagRail = pair.diagRail || [];
        const diagLengths = pair.diagLengths || [];
        const wallRail = pair.wallRail || [];
        const wallLengths = pair.wallLengths || [];
        const landingRail = (pair.oppositeLandingRail && pair.oppositeLandingRail.length)
          ? pair.oppositeLandingRail
          : (pair.landingRail && pair.landingRail.length ? pair.landingRail : pair.centerRail);
        const landingLengths = pair.oppositeLandingLengths || pair.landingLengths || pair.centerLengths;

        if (!diagRail.length || !diagLengths.length || !landingRail?.length || !landingLengths?.length) continue;

        const diagTotalLength = diagLengths[diagLengths.length - 1] || 0;
        const landingTotalLength = landingLengths[landingLengths.length - 1] || 0;

        const minLength = spacing * 2;
        if (diagTotalLength < minLength || landingTotalLength < minLength) continue;

        let effectiveFiberCount = totalFibers;

        // Scale down fiber count based on curvature compression
        // (Only when experimental curve mode is enabled)
        const experimentalCurveMode = params.experimentalCurveMode || false;
        const originalFiberCount = effectiveFiberCount;
        if (experimentalCurveMode && curvatureSamples && diagRail.length > 0) {
          const braidLength = params.braidLength || 500;
          const wallSeparation = params.wallSeparation || 100;

          const pairY = diagRail[0].y;
          const backboneT = clamp(pairY / braidLength, 0, 1);
          const curvature = getCurvatureAt(curvatureSamples, backboneT);

          if (curvature !== 0) {
            // curvature > 0 = curving left, so right wall is inside
            // curvature < 0 = curving right, so left wall is inside
            const isOnInside = (curvature > 0 && pair.side === 'right') ||
              (curvature < 0 && pair.side === 'left');

            if (isOnInside) {
              const radius = 1 / Math.abs(curvature);
              const halfWidth = wallSeparation / 2;
              const compressionRatio = Math.max(0.2, (radius - halfWidth) / radius);
              effectiveFiberCount = Math.max(1, Math.round(effectiveFiberCount * compressionRatio));

              // DEBUG: Log tight curves where radius < 2x wallSeparation (potential fold-over zones)
              if (radius < wallSeparation * 2) {
                console.log(`[TIGHT CURVE] Pair ${pair.sideIndex} (${pair.side}):`, {
                  pairY: pairY.toFixed(1),
                  curvature: curvature.toFixed(6),
                  radius: radius.toFixed(1),
                  wallSep: wallSeparation,
                  halfWidth: halfWidth.toFixed(1),
                  isOnInside,
                  compressionRatio: compressionRatio.toFixed(3),
                  originalCount: originalFiberCount,
                  reducedCount: effectiveFiberCount,
                  FOLDOVER: radius < halfWidth ? '⚠️ YES' : 'no'
                });
              }
            }
          }
        }

        // Break parameters with coherence seed for this pair
        const breakChance = params.breakChance ?? 0;
        const breakCoherence = params.breakCoherence ?? 0.5;
        const breakGapSize = params.breakGapSize ?? 8;
        const pairBreakSeed = Math.random();

        for (let i = 0; i < effectiveFiberCount; i++) {
          let fiberParam = (i + 1) / (effectiveFiberCount + 1);
          const ease = 0.5 - 0.5 * Math.cos(Math.PI * fiberParam);
          fiberParam = fiberParam + (ease - fiberParam) * (bias - 0.5) * 2;

          // Add jiggle to origin and landing independently
          const jiggleAmount = params.fiberJiggle ?? 0;
          const maxJiggle = 0.15; // Max displacement as fraction of spacing
          const originJiggle = (Math.random() - 0.5) * 2 * jiggleAmount * maxJiggle;
          const landingJiggle = (Math.random() - 0.5) * 2 * jiggleAmount * maxJiggle;

          const originParam = clamp(fiberParam + originJiggle, 0.05, 0.95);
          const landingDirection = pair.side === 'left' ? (1 - fiberParam) : (1 - fiberParam);
          const landingParam = clamp(landingOffset + landingDirection * landingSpread + landingJiggle, 0, 1);

          const originPoint = sampleCurveByArcLength(diagRail, diagLengths, originParam);
          const landingPoint = sampleCurveByArcLength(landingRail, landingLengths, landingParam);
          const wallPoint = sampleCurveByArcLength(wallRail, wallLengths, originParam);

          const outernessFactor = 1 - fiberParam;

          let toWall = normalizeVector({ x: wallPoint.x - originPoint.x, y: wallPoint.y - originPoint.y });
          if (!isFinite(toWall.x) || !isFinite(toWall.y)) toWall = { x: 0, y: 0 };

          // Get the tangent of the continuation line (diagRail) at the origin point
          const diagTangent = estimateRailTangent(diagRail, diagLengths, originParam);

          const gradientPower = clamp(params.bowGradient ?? 2.0, 0.5, 4);
          const shapedFactor = Math.pow(outernessFactor, gradientPower);

          const controlPointDistance = bowStrength * shapedFactor * 100;

          // Base midpoint between origin and landing
          let midStraight = {
            x: originPoint.x + (landingPoint.x - originPoint.x) * 0.5,
            y: originPoint.y + (landingPoint.y - originPoint.y) * 0.5
          };

          // Arc Tangent Blend: shift the midpoint along the braid direction (Y-axis)
          // This "pulls" the arc peak up or down along the path
          // arcTangentBlend = 0: centered (current behavior)
          // arcTangentBlend = 1: shifted toward landing, arcTangentBlend = -1: shifted toward origin
          if (arcTangentBlend !== 0) {
            // Calculate how far along the fiber path we could shift
            const fiberLength = Math.hypot(landingPoint.x - originPoint.x, landingPoint.y - originPoint.y);
            const maxShift = fiberLength * 0.4; // Max 40% of fiber length
            const shiftAmount = arcTangentBlend * maxShift;

            // Shift midpoint along Y-axis (braid direction)
            // Positive = toward landing (further along braid), Negative = toward origin
            midStraight = {
              x: midStraight.x,
              y: midStraight.y + shiftAmount
            };
          }

          // Arc Lean: shift control point toward the next continuation on the same side
          // This helps fibers "flow" toward where they'll connect next
          // Works with a base amount, amplified when jitter is present
          let leanOffsetX = 0;
          let leanOffsetY = 0;
          if (arcLean !== 0 && nextSameSidePair && nextSameSidePair.diagRail && nextSameSidePair.diagRail.length > 0) {
            // Get the origin of the next same-side continuation (where fibers will go next)
            // The end of diagRail (index -1) is the center tip, start (index 0) is the wall trough
            // We want to lean toward the center tip of the next pair
            const nextTarget = nextSameSidePair.diagRail[nextSameSidePair.diagRail.length - 1];

            // Direction from current control point area toward next continuation's tip
            const toNextDir = normalizeVector({
              x: nextTarget.x - midStraight.x,
              y: nextTarget.y - midStraight.y
            });

            // Get local jitter amount for this cycle (0-1 range roughly)
            const pairY = diagRail[0]?.y || 0;
            const cycleIdx = getCycleIndexAtY(pairY, params);
            const localJitter = Math.abs(getCycleJitterAmount(cycleIdx, params.cycleJitter));

            // Base lean + jitter amplification
            // With no jitter: uses base lean strength
            // With jitter: amplified proportionally
            const baseLeanScale = 15; // Base pixel offset at arcLean=1
            const jitterAmplification = 1 + localJitter * 2; // Up to 3x with max jitter
            const leanStrength = arcLean * baseLeanScale * jitterAmplification;

            // Lean toward the next same-side continuation
            leanOffsetX = toNextDir.x * leanStrength;
            leanOffsetY = toNextDir.y * leanStrength;
          }

          const controlPoint = {
            x: midStraight.x + toWall.x * controlPointDistance + leanOffsetX,
            y: midStraight.y + toWall.y * controlPointDistance + leanOffsetY
          };

          const points = [];
          const segmentCount = 24;
          for (let j = 0; j <= segmentCount; j++) {
            const t = j / segmentCount;
            points.push(quadraticPoint(originPoint, controlPoint, landingPoint, t));
          }

          // Optionally break the fiber into segments with gaps
          if (breakChance > 0 && Math.random() < breakChance) {
            const numBreaks = Math.random() < 0.5 ? 1 : 2; // 1-2 breaks = 2-3 segments
            const segments = splitFiberWithGaps(points, numBreaks, breakGapSize, {
              coherence: breakCoherence,
              pairSeed: pairBreakSeed,
              fiberIndex: i
            });

            segments.forEach((seg, segIdx) => {
              curves.push({
                side: pair.side,
                points: seg,
                pairIndex: pair.sideIndex ?? 0,
                targetPairIndex: pair.oppositeIndex ?? pair.sideIndex,
                fiberIndex: i,
                segmentIndex: segIdx
              });
            });
          } else {
            curves.push({ side: pair.side, points, pairIndex: pair.sideIndex ?? 0, targetPairIndex: pair.oppositeIndex ?? pair.sideIndex, fiberIndex: i });
          }
        }
      }

      return curves;
    }

    // ========================================================================
    // End Cap and Spout Fiber Generation
    // ========================================================================

    // Select the best landing rail index based on depth slider and scoring
    function selectCapLandingRail(centerExtrema, braidLength, capLandingDepth, tipTaperLength) {
      // Consider first N segments (first 6-8 extrema pairs)
      const maxCandidates = Math.min(8, centerExtrema.length - 1);

      // Target Y based on slider: lerp within taper zone
      const minY = tipTaperLength * 0.1;  // Very shallow (10% into taper)
      const maxY = tipTaperLength * 0.9;  // Deep (90% into taper)
      const targetY = minY + (maxY - minY) * capLandingDepth;

      // Simple approach: find segment with midY closest to targetY
      let bestIdx = 1;
      let bestDist = Infinity;

      for (let i = 1; i < maxCandidates; i++) {
        const zA = centerExtrema[i];
        const zB = centerExtrema[i + 1];
        if (!zA || !zB) continue;

        const midY = (zA.y + zB.y) / 2;
        const dist = Math.abs(midY - targetY);

        if (dist < bestDist) {
          bestDist = dist;
          bestIdx = i;
        }
      }

      return bestIdx;
    }

    function buildStartCapFibers(leftExtrema, rightExtrema, centerSamples, leftSamples, rightSamples, continuationPairs, params, warpPoint, centerExtrema) {
      const fibers = [];
      const { capFiberCount = 8, capGatherLength = 10, braidLength, tipTaper = 0, tipTaperLength = 50, fiberBow = 0.5, capBowAngle = 45, capLandingDepth = 0.3, capBowStrength: capBowStrengthParam = 1.0 } = params;
      const fibersPerSide = Math.max(1, Math.floor(capFiberCount / 2));
      // Use fiberBow as base, multiply by capBowStrength slider for more control
      const capBowStrength = fiberBow * 80 * capBowStrengthParam;
      // Convert angle to radians for control point direction
      const angleRad = (capBowAngle * Math.PI) / 180;

      // When tipTaper is high, connect wall starts to center zigzag segments
      // Use scoring system to select the best landing rail based on capLandingDepth
      const useZigzagLanding = tipTaper > 0.3 && centerExtrema && centerExtrema.length >= 3;

      // Get dynamically selected indices based on slider
      const selectedIdx = useZigzagLanding ? selectCapLandingRail(centerExtrema, braidLength, capLandingDepth, tipTaperLength) : 1;
      const lIdx = selectedIdx + 1;  // L-START lands one segment deeper
      const rIdx = selectedIdx;       // R-START lands at selected segment

      // Left side cap fibers - land on dynamically selected segment
      if (useZigzagLanding) {
        const zA = centerExtrema[lIdx];
        const zB = centerExtrema[lIdx + 1];

        if (zA && zB) {
          // Build a rail along the center zigzag between zA and zB
          const segmentStart = zA.y;
          const segmentEnd = zB.y;
          const zigzagRail = [];
          const numPoints = 20;
          for (let k = 0; k <= numPoints; k++) {
            const segY = segmentStart + (segmentEnd - segmentStart) * (k / numPoints);
            zigzagRail.push(interpolateSamplesAt(centerSamples, segY));
          }
          const zigzagLengths = calculateArcLengths(zigzagRail);

          const originPoint = { x: leftSamples[0].x, y: 0 }; // L-START

          // Determine which end of rail is closer to origin (for correct landing order)
          const railStart = zigzagRail[0];
          const railEnd = zigzagRail[zigzagRail.length - 1];
          const distToStart = Math.hypot(railStart.x - originPoint.x, railStart.y - originPoint.y);
          const distToEnd = Math.hypot(railEnd.x - originPoint.x, railEnd.y - originPoint.y);
          const invertLanding = distToStart > distToEnd; // true if end is closer

          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            // Outer fibers land closer to origin, inner fibers land further
            const landingT = invertLanding ? t : (1 - t);
            const landingPoint = sampleCurveByArcLength(zigzagRail, zigzagLengths, landingT);

            // Create a smooth curve with bow using angle-based control
            const midPoint = lerpVector(originPoint, landingPoint, 0.5);
            // All fibers get some bow, with gradient from outer to inner
            const outernessFactor = 0.3 + 0.7 * (1 - t); // 1.0 for outer, 0.3 for inner
            const bowAmount = capBowStrength * outernessFactor;
            // Use angle for control direction, mirrored for left side (add PI)
            const controlPoint = {
              x: midPoint.x + bowAmount * Math.cos(angleRad + Math.PI),
              y: midPoint.y + bowAmount * Math.sin(angleRad + Math.PI)
            };

            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'left', points, capEnd: 'start', pairIndex: -1, targetPairIndex: 0, fiberIndex: i });
          }
        }
      } else {
        // Original behavior: connect wall trough to center gather point
        const leftTrough = leftExtrema.filter(e => e.type === 'trough' && !e.claimed).sort((a, b) => a.y - b.y)[0];
        const gatherStart = { x: centerSamples[0].x, y: 0 };
        const gatherEnd = interpolateSamplesAt(centerSamples, Math.min(capGatherLength, braidLength * 0.1));

        if (leftTrough) {
          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            const originY = leftTrough.y * (1 - t * 0.3);
            const originPoint = interpolateSamplesAt(leftSamples, originY);
            const landingPoint = lerpVector(gatherStart, gatherEnd, t);
            const midPoint = lerpVector(originPoint, landingPoint, 0.5);
            const wallOffset = (originPoint.x - landingPoint.x) * 0.3;
            const controlPoint = { x: midPoint.x + wallOffset, y: midPoint.y };

            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'left', points, capEnd: 'start', pairIndex: -1, targetPairIndex: -1, fiberIndex: i });
          }
        }
      }

      // Right side cap fibers - land on dynamically selected segment
      if (useZigzagLanding && centerExtrema.length >= rIdx + 2) {
        const zA = centerExtrema[rIdx];
        const zB = centerExtrema[rIdx + 1];

        if (zA && zB) {
          // Build a rail along the center zigzag between zA and zB
          const segmentStart = zA.y;
          const segmentEnd = zB.y;
          const zigzagRail = [];
          const numPoints = 20;
          for (let k = 0; k <= numPoints; k++) {
            const segY = segmentStart + (segmentEnd - segmentStart) * (k / numPoints);
            zigzagRail.push(interpolateSamplesAt(centerSamples, segY));
          }
          const zigzagLengths = calculateArcLengths(zigzagRail);

          const originPoint = { x: rightSamples[0].x, y: 0 }; // R-START

          // Determine which end of rail is closer to origin (for correct landing order)
          const railStart = zigzagRail[0];
          const railEnd = zigzagRail[zigzagRail.length - 1];
          const distToStart = Math.hypot(railStart.x - originPoint.x, railStart.y - originPoint.y);
          const distToEnd = Math.hypot(railEnd.x - originPoint.x, railEnd.y - originPoint.y);
          const invertLanding = distToStart > distToEnd; // true if end is closer

          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            // Outer fibers land closer to origin, inner fibers land further
            const landingT = invertLanding ? t : (1 - t);
            const landingPoint = sampleCurveByArcLength(zigzagRail, zigzagLengths, landingT);

            // Create a smooth curve with bow using angle-based control
            const midPoint = lerpVector(originPoint, landingPoint, 0.5);
            // All fibers get some bow, with gradient from outer to inner
            const outernessFactor = 0.3 + 0.7 * (1 - t); // 1.0 for outer, 0.3 for inner
            const bowAmount = capBowStrength * outernessFactor;
            // Use angle for control direction (no mirroring for right side)
            const controlPoint = {
              x: midPoint.x + bowAmount * Math.cos(angleRad),
              y: midPoint.y + bowAmount * Math.sin(angleRad)
            };

            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'right', points, capEnd: 'start', pairIndex: -1, targetPairIndex: 0, fiberIndex: i });
          }
        }
      } else {
        // Original behavior: connect wall trough to center gather point
        const rightTrough = rightExtrema.filter(e => e.type === 'trough' && !e.claimed).sort((a, b) => a.y - b.y)[0];
        const gatherStart = { x: centerSamples[0].x, y: 0 };
        const gatherEnd = interpolateSamplesAt(centerSamples, Math.min(capGatherLength, braidLength * 0.1));

        if (rightTrough) {
          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            const originY = rightTrough.y * (1 - t * 0.3);
            const originPoint = interpolateSamplesAt(rightSamples, originY);
            const landingPoint = lerpVector(gatherStart, gatherEnd, t);
            const midPoint = lerpVector(originPoint, landingPoint, 0.5);
            const wallOffset = (originPoint.x - landingPoint.x) * 0.3;
            const controlPoint = { x: midPoint.x + wallOffset, y: midPoint.y };

            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'right', points, capEnd: 'start', pairIndex: -1, targetPairIndex: -1, fiberIndex: i });
          }
        }
      }

      return fibers;
    }

    // Select landing rail for END caps (searches from end of braid backwards)
    function selectEndCapLandingRail(centerExtrema, braidLength, capLandingDepth, tipTaperLength) {
      // Consider last N segments
      const startIdx = Math.max(0, centerExtrema.length - 9);
      const endIdx = centerExtrema.length - 1;

      // Target Y from end of braid
      const maxY = braidLength - tipTaperLength * 0.1;  // Very shallow from end
      const minY = braidLength - tipTaperLength * 0.9;  // Deep from end
      const targetY = maxY - (maxY - minY) * capLandingDepth;

      let bestIdx = endIdx - 1;
      let bestDist = Infinity;

      for (let i = startIdx; i < endIdx; i++) {
        const zA = centerExtrema[i];
        const zB = centerExtrema[i + 1];
        if (!zA || !zB) continue;

        const midY = (zA.y + zB.y) / 2;
        const dist = Math.abs(midY - targetY);

        if (dist < bestDist) {
          bestDist = dist;
          bestIdx = i;
        }
      }

      return bestIdx;
    }

    function buildEndCapFibers(centerExtrema, centerSamples, leftSamples, rightSamples, params, warpPoint) {
      const fibers = [];
      const { capFiberCount = 8, braidLength, tipTaper = 0, tipTaperLength = 50, fiberBow = 0.5, capBowAngle = 45, capLandingDepth = 0.3, capBowStrength: capBowStrengthParam = 1.0 } = params;
      const fibersPerSide = Math.max(1, Math.floor(capFiberCount / 2));
      const capBowStrength = fiberBow * 80 * capBowStrengthParam;
      // Flip angle for end caps (mirror of start)
      const angleRad = ((capBowAngle + 180) * Math.PI) / 180;

      const useZigzagLanding = tipTaper > 0.3 && centerExtrema && centerExtrema.length >= 3;

      // Get dynamically selected indices for end
      const selectedIdx = useZigzagLanding ? selectEndCapLandingRail(centerExtrema, braidLength, capLandingDepth, tipTaperLength) : centerExtrema.length - 2;
      const lIdx = selectedIdx;
      const rIdx = selectedIdx - 1 >= 0 ? selectedIdx - 1 : selectedIdx;

      // Left side end cap fibers
      if (useZigzagLanding && centerExtrema.length >= 2) {
        const zA = centerExtrema[lIdx];
        const zB = centerExtrema[lIdx + 1];

        if (zA && zB) {
          const segmentStart = zA.y;
          const segmentEnd = zB.y;
          const zigzagRail = [];
          const numPoints = 20;
          for (let k = 0; k <= numPoints; k++) {
            const segY = segmentStart + (segmentEnd - segmentStart) * (k / numPoints);
            zigzagRail.push(interpolateSamplesAt(centerSamples, segY));
          }
          const zigzagLengths = calculateArcLengths(zigzagRail);

          const originPoint = { x: leftSamples[leftSamples.length - 1].x, y: braidLength }; // L-END

          // Determine landing order
          const railStart = zigzagRail[0];
          const railEnd = zigzagRail[zigzagRail.length - 1];
