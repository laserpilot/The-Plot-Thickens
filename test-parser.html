<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Parser Test</title>
  <script src="https://cdn.jsdelivr.net/npm/svg-path-commander@2.0.6/dist/svg-path-commander.min.js"></script>
</head>
<body>
  <h1>SVG Parser Test</h1>
  <div id="results"></div>

  <script src="web/svg-parser.js"></script>
  <script>
    async function testParser() {
      const results = document.getElementById('results');

      try {
        // Load the SVG file
        const response = await fetch('topographical_merged.svg');
        const svgContent = await response.text();

        console.log('SVG file loaded, testing parser...');
        results.innerHTML += '<p>SVG file loaded, parsing...</p>';

        // Create parser instance
        const parser = new SVGParser();
        const svgData = parser.parseSVGContent(svgContent);

        // Display results
        results.innerHTML += `<h2>Parse Results</h2>`;
        results.innerHTML += `<p><strong>Total paths parsed:</strong> ${svgData.paths.length}</p>`;
        results.innerHTML += `<p><strong>ViewBox:</strong> ${svgData.viewBox.x}, ${svgData.viewBox.y}, ${svgData.viewBox.width}, ${svgData.viewBox.height}</p>`;
        results.innerHTML += `<p><strong>Dimensions:</strong> ${svgData.width}mm × ${svgData.height}mm</p>`;

        // Calculate length statistics
        const lengths = svgData.paths.map(p => p.length).filter(l => l && !isNaN(l));
        if (lengths.length > 0) {
          const minLen = Math.min(...lengths);
          const maxLen = Math.max(...lengths);
          const avgLen = lengths.reduce((a, b) => a + b, 0) / lengths.length;

          results.innerHTML += `<h3>Path Length Statistics</h3>`;
          results.innerHTML += `<p><strong>Min length:</strong> ${minLen.toFixed(2)}mm</p>`;
          results.innerHTML += `<p><strong>Max length:</strong> ${maxLen.toFixed(2)}mm</p>`;
          results.innerHTML += `<p><strong>Average length:</strong> ${avgLen.toFixed(2)}mm</p>`;
          results.innerHTML += `<p><strong>Paths with valid lengths:</strong> ${lengths.length}</p>`;
        }

        // Show sample paths
        results.innerHTML += `<h3>Sample Paths (first 5)</h3>`;
        svgData.paths.slice(0, 5).forEach((path, i) => {
          results.innerHTML += `<p><strong>Path ${i}:</strong> ${path.points.length} points, length=${path.length ? path.length.toFixed(2) : 'NaN'}mm</p>`;
        });

        console.log('Test complete!');
        console.log(`Parsed ${svgData.paths.length} paths`);
        console.log('Length range:', lengths.length > 0 ? `${Math.min(...lengths).toFixed(1)} - ${Math.max(...lengths).toFixed(1)}mm` : 'N/A');

      } catch (error) {
        console.error('Test failed:', error);
        results.innerHTML += `<p style="color: red;"><strong>Error:</strong> ${error.message}</p>`;
      }
    }

    // Run test when page loads
    window.addEventListener('load', testParser);
  </script>
</body>
</html>
