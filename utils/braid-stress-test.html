    </details>
    <div class="control-group">
      <label><input type="checkbox" id="showDebug"> Show Debug</label>
    </div>
    <button id="exportSvg" style="background: #0f3460;">Export SVG</button>
    <div class="stats" id="stats">Ready</div>
  </div>
  <div class="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <script type="module">
    // ========================================================================
    // Inline Braid Engine (simplified for standalone test)
    // ========================================================================

    const BASE_ZIGZAG_AMPLITUDE = 30;
    const BASE_WALL_WIDTH = 50;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function normalizeVector(vec) {
      const len = Math.hypot(vec.x, vec.y) || 1;
      return { x: vec.x / len, y: vec.y / len };
    }

    function lerpVector(v1, v2, t) {
      return {
        x: v1.x + (v2.x - v1.x) * t,
        y: v1.y + (v2.y - v1.y) * t
      };
    }

    function rotateVector(v, angleDegrees) {
      const rad = angleDegrees * Math.PI / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      return {
        x: v.x * cos - v.y * sin,
        y: v.x * sin + v.y * cos
      };
    }

    function blendDirection(sourceDir, targetDir, bias) {
      const mixed = {
        x: sourceDir.x * (1 - bias) + targetDir.x * bias,
        y: sourceDir.y * (1 - bias) + targetDir.y * bias
      };
      return normalizeVector(mixed);
    }

    function quadraticPoint(p0, p1, p2, t) {
      const mt = 1 - t;
      return {
        x: mt * mt * p0.x + 2 * mt * t * p1.x + t * t * p2.x,
        y: mt * mt * p0.y + 2 * mt * t * p1.y + t * t * p2.y
      };
    }

    function calculateArcLengths(points) {
      const lengths = [0];
      for (let i = 1; i < points.length; i++) {
        const dx = points[i].x - points[i - 1].x;
        const dy = points[i].y - points[i - 1].y;
        lengths.push(lengths[i - 1] + Math.hypot(dx, dy));
      }
      return lengths;
    }

    function sampleCurveByArcLength(rail, lengths, param) {
      if (!rail || rail.length === 0) return { x: 0, y: 0 };
      if (rail.length === 1) return { ...rail[0] };

      const totalLength = lengths[lengths.length - 1];
      const targetLength = clamp(param, 0, 1) * totalLength;

      for (let i = 0; i < rail.length - 1; i++) {
        const lenA = lengths[i];
        const lenB = lengths[i + 1];

        if (targetLength >= lenA && targetLength <= lenB) {
          const segmentLength = lenB - lenA;
          const t = segmentLength > 0 ? (targetLength - lenA) / segmentLength : 0;
          const a = rail[i];
          const b = rail[i + 1];
          return {
            x: a.x + (b.x - a.x) * t,
            y: a.y + (b.y - a.y) * t
          };
        }
      }

      return { ...rail[rail.length - 1] };
    }

    // Triangle wave for sharp pointy zigzags
    function triangleWave(t) {
      // Normalize to 0-1 range within each period
      const normalized = ((t / Math.PI) % 2 + 2) % 2;
      // Triangle: go up 0->1 in first half, down 1->0 in second half
      if (normalized < 1) {
        return normalized * 2 - 1;  // -1 to 1
      } else {
        return 1 - (normalized - 1) * 2;  // 1 to -1
      }
    }

    // Pseudo-random function for consistent jitter per cycle
    function cycleRandom(cycleIndex) {
      const seed = cycleIndex * 9999;
      return Math.abs(Math.sin(seed)) * 2 - 1;
    }

    function zigzagWave(y, params) {
      const { frequency, cycleJitter, zigzagPhase = 0 } = params;
      const phaseRad = (zigzagPhase * Math.PI) / 180;

      const cycles = frequency;
      const t = (y / params.braidLength) * cycles * Math.PI + phaseRad;
      let wave = triangleWave(t);

      // Apply amplitude jitter per cycle (makes links taller/shorter without discontinuities)
      if (cycleJitter > 0) {
        const cyclePos = (y / params.braidLength) * frequency;
        const cycleIndex = Math.floor(cyclePos);
        const cycleFrac = cyclePos - cycleIndex;

        // Get amplitude scale for current and next cycle (range: 1-jitter to 1+jitter)
        const jitter0 = 1 + cycleRandom(cycleIndex) * cycleJitter * 0.3;
        const jitter1 = 1 + cycleRandom(cycleIndex + 1) * cycleJitter * 0.3;

        // Smooth interpolation at cycle boundaries
        const smoothT = cycleFrac * cycleFrac * (3 - 2 * cycleFrac);
        const ampScale = jitter0 + (jitter1 - jitter0) * smoothT;

        wave *= ampScale;
      }

      return wave;
    }

    function bounceWave(angle, phase, bounceFreq) {
      const modulatedAngle = angle * bounceFreq + phase;
      // |sin(x)| creates a bounce pattern that always pushes outward from baseline
      // instead of oscillating through center
      return Math.abs(Math.sin(modulatedAngle));
    }

    /**
     * Smoothstep easing function for smooth transitions
     */
    function smoothstep(t) {
      const clamped = clamp(t, 0, 1);
      return clamped * clamped * (3 - 2 * clamped);
    }

    /**
     * Calculate global taper scale for braid ends
     * Tapers smoothly from 0 at the ends to 1 at tipTaperLength distance from ends
     */
    function getBraidTaperScale(y, params) {
      const { braidLength, tipTaper, tipTaperLength = 50 } = params;
      if (tipTaper === 0 || tipTaperLength <= 0) return 1;

      // Guard against very small taper lengths
      const safeTaperLength = Math.max(1, tipTaperLength);

      // Calculate distance from nearest end
      const distFromStart = y;
      const distFromEnd = braidLength - y;
      const distFromNearestEnd = Math.min(distFromStart, distFromEnd);

      // Normalized progress from end (0 at end, 1 at full distance)
      const t = clamp(distFromNearestEnd / safeTaperLength, 0, 1);

      // Apply smoothstep easing for smooth transition
      const easedT = smoothstep(t);

      // Scale: 0 at end (when tipTaper=1), 1 at full distance
      return 1 - tipTaper * (1 - easedT);
    }

    function generateCenterX(phaseY, actualY, params) {
      const wave = zigzagWave(phaseY, params);
      const amplitude = BASE_ZIGZAG_AMPLITUDE * (params.zigzagScale || 1);
      const taper = getBraidTaperScale(actualY, params);
      return wave * amplitude * taper;
    }

    function generateWallX(phaseY, actualY, side, params) {
      const { leftWallPhase = 0, rightWallPhase = 0, wallScale, wallSeparation = 100, wallFrequency, frequency } = params;
      // Wall uses its own frequency, independent of zigzag
      const wFreq = wallFrequency ?? frequency;
      const angle = (phaseY / params.braidLength) * wFreq * Math.PI;
      const sidePhase = side === 'left' ? leftWallPhase : rightWallPhase;
      const phase = (sidePhase * Math.PI) / 180;
      // bounceFreq=1 since we now have explicit wall frequency control
      const envelope = bounceWave(angle, phase, 1);
      const amplitude = BASE_WALL_WIDTH * wallScale;
      const translationSign = side === 'left' ? -1 : 1;
      const translation = translationSign * wallSeparation * 0.5;

      // Apply taper to both amplitude AND translation separately
      // This makes walls collapse toward center at the braid ends
      const taper = getBraidTaperScale(actualY, params);
      const taperedAmplitude = translationSign * envelope * amplitude * taper;
      const taperedTranslation = translation * taper;

      return taperedAmplitude + taperedTranslation;
    }

    function sampleBoundary(generator, params) {
      const samples = [];
      const { braidLength, sampleSpacing, arcLengths } = params;
      const count = Math.max(5, Math.ceil(braidLength / sampleSpacing));
      for (let i = 0; i <= count; i++) {
        const physicalY = (i / count) * braidLength;
        // Use arc-length adjusted Y for wave generation if backbone is curved
        const phaseY = arcLengths
          ? getFrequencyAdjustedY(physicalY, braidLength, arcLengths)
          : physicalY;
        // Pass both phaseY (for waves) and physicalY (for taper)
        samples.push({ x: generator(phaseY, physicalY, params), y: physicalY, index: i });
      }
      return samples;
    }

    function interpolateSamplesAt(samples, targetY) {
      if (!samples || samples.length === 0) return { x: 0, y: targetY };
      if (targetY <= samples[0].y) return { x: samples[0].x, y: targetY };
      if (targetY >= samples[samples.length - 1].y) {
        return { x: samples[samples.length - 1].x, y: targetY };
      }
      for (let i = 0; i < samples.length - 1; i++) {
        const a = samples[i];
        const b = samples[i + 1];
        if (targetY >= a.y && targetY <= b.y) {
          const t = (targetY - a.y) / (b.y - a.y);
          return { x: a.x + (b.x - a.x) * t, y: targetY };
        }
      }
      return { x: samples[0].x, y: targetY };
    }

    function detectExtrema(samples) {
      const extrema = [];
      for (let i = 1; i < samples.length - 1; i++) {
        const prevDx = samples[i].x - samples[i - 1].x;
        const nextDx = samples[i + 1].x - samples[i].x;
        if (prevDx === 0 || nextDx === 0) continue;
        if (prevDx * nextDx < 0) {
          extrema.push({ ...samples[i], type: prevDx > 0 ? 'peak' : 'trough' });
        }
      }
      return extrema;
    }

    function estimateTangent(samples, index) {
      const prev = samples[Math.max(0, index - 1)];
      const next = samples[Math.min(samples.length - 1, index + 1)];
      const dx = next.x - prev.x;
      const dy = next.y - prev.y;
      const len = Math.hypot(dx, dy) || 1;
      return { x: dx / len, y: dy / len };
    }

    function findWallPartner(centerExt, wallExtrema, side, params) {
      let bestMatch = null;
      let minDist = Infinity;

      // With |sin(x)| walls, we want to connect to where wall is CLOSEST to center
      // For left wall: 'peak' is closest (least negative x)
      // For right wall: 'trough' is closest (least positive x)
      // Actually with current detectExtrema logic:
      // - Left wall 'peak' = when wall moves from going-left to going-right (closest to center)
      // - Right wall 'trough' = when wall moves from going-right to going-left (closest to center)
      const targetType = side === 'left' ? 'peak' : 'trough';

      for (const wallExt of wallExtrema) {
        if (wallExt.claimed) continue;
        if (wallExt.type !== targetType) continue;
        const dy = wallExt.y - centerExt.y;
        const dist = Math.abs(dy);
        if (dist < minDist) {
          minDist = dist;
          bestMatch = wallExt;
        }
      }
      return bestMatch;
    }

    // ========================================================================
    // Arc-Length and Curvature Infrastructure
    // ========================================================================

    function computeBackboneArcLengths(backbone, sampleCount = 200) {
      const points = [];
      for (let i = 0; i <= sampleCount; i++) {
        points.push(backbone.getPointAt(i / sampleCount));
      }
      return calculateArcLengths(points);
    }

    function getFrequencyAdjustedY(y, braidLength, arcLengths) {
      const totalArcLength = arcLengths[arcLengths.length - 1];
      const t = clamp(y / braidLength, 0, 1);
      const idx = t * (arcLengths.length - 1);
      const i = Math.floor(idx);
      const frac = idx - i;
      const arcLen = arcLengths[i] + (arcLengths[Math.min(i + 1, arcLengths.length - 1)] - arcLengths[i]) * frac;
      return (arcLen / totalArcLength) * braidLength;
    }

    function computeBackboneCurvature(backbone, braidLength, sampleCount = 100, smoothingWindow = 5) {
      if (!backbone) return null;
      const epsilon = 1e-4;
      const raw = [];

      // Compute raw curvature
      for (let i = 0; i <= sampleCount; i++) {
        const t = i / sampleCount;
        const t0 = Math.max(0, t - epsilon);
        const t1 = Math.min(1, t + epsilon);

        const tan0 = backbone.getTangentAt(t0);
        const tan1 = backbone.getTangentAt(t1);

        let deltaAngle = Math.atan2(tan1.y, tan1.x) - Math.atan2(tan0.y, tan0.x);
        if (deltaAngle > Math.PI) deltaAngle -= 2 * Math.PI;
        if (deltaAngle < -Math.PI) deltaAngle += 2 * Math.PI;

        const p0 = backbone.getPointAt(t0);
        const p1 = backbone.getPointAt(t1);
        const arcLength = Math.hypot(p1.x - p0.x, p1.y - p0.y);
        const curvature = arcLength > 1e-6 ? deltaAngle / arcLength : 0;

        raw.push({ t, curvature });
      }

      // Apply moving average smoothing
      const smoothed = [];
      for (let i = 0; i < raw.length; i++) {
        let sum = 0, count = 0;
        for (let j = -smoothingWindow; j <= smoothingWindow; j++) {
          const idx = Math.max(0, Math.min(raw.length - 1, i + j));
          sum += raw[idx].curvature;
          count++;
        }
        smoothed.push({ t: raw[i].t, curvature: sum / count });
      }

      return smoothed;
    }

    function getCurvatureAt(curvatureSamples, t) {
      if (!curvatureSamples || curvatureSamples.length === 0) return 0;
      const count = curvatureSamples.length - 1;
      const idx = clamp(t, 0, 1) * count;
      const i = Math.floor(idx);
      const frac = idx - i;
      const a = curvatureSamples[Math.min(i, count)];
      const b = curvatureSamples[Math.min(i + 1, count)];
      return a.curvature + (b.curvature - a.curvature) * frac;
    }

    /**
     * Redistribute strand positions to bias toward curve inside
     */
    function redistribute(x_norm, shift) {
      // Clamp shift to safe range (prevents power going negative/zero)
      const safeShift = clamp(shift, -0.95, 0.95);

      // Ease shift to prevent overcompensation at low curvature
      const easedShift = safeShift * (2 - Math.abs(safeShift));

      const sign = Math.sign(x_norm);
      const t = Math.abs(x_norm);

      // Power-based redistribution
      // Positive shift compresses positive x (right), expands negative x (left)
      const power = sign > 0 ? (1 + easedShift) : (1 - easedShift);

      return Math.pow(t, power) * sign;
    }

    function createWarpFunction(backbone, braidLength, curvatureSamples = null, params = {}) {
      if (!backbone) return (point) => point;

      const { redistributionFactor = 0, wallSeparation = 100 } = params;

      return (point) => {
        const t = clamp(point.y / braidLength, 0, 1);
        const base = backbone.getPointAt(t);
        const tangent = backbone.getTangentAt(t);
        const normal = { x: -tangent.y, y: tangent.x };

        let adjustedX = point.x;

        // Apply curvature-based redistribution
        if (curvatureSamples && redistributionFactor > 0) {
          const curvature = getCurvatureAt(curvatureSamples, t);
          const halfWidth = wallSeparation / 2;
          const x_norm = point.x / halfWidth;
          // Scale curvature by wallSeparation to get dimensionless quantity
          // (curvature is rad/px, wallSeparation is px, so product is radians)
          const scaledCurvature = curvature * wallSeparation;
          const shift = -scaledCurvature * redistributionFactor;
          const remapped = redistribute(x_norm, shift);
          adjustedX = remapped * halfWidth;
        }

        return {
          x: base.x + adjustedX * normal.x,
          y: base.y + adjustedX * normal.y
        };
      };
    }

    function buildContinuationPairs(leftSamples, rightSamples, centerSamples, centerExtrema, leftExtrema, rightExtrema, params) {
      const pairs = [];
      const { tipTaperLength = 50, braidLength, tipTaper = 0 } = params;

      // Only apply safe zone if taper is significant
      const useSafeZone = tipTaper > 0.3;
      const safeMargin = useSafeZone ? tipTaperLength * 0.8 : 0;

      centerExtrema.forEach((tip) => {
        if (tip.paired) return;

        // Skip extrema in taper zones - caps handle these
        if (useSafeZone && (tip.y < safeMargin || tip.y > braidLength - safeMargin)) {
          return;
        }

        const side = tip.x >= 0 ? 'right' : 'left';
        const wallSamples = side === 'left' ? leftSamples : rightSamples;
        const wallExtrema = side === 'left' ? leftExtrema : rightExtrema;

        const trough = findWallPartner(tip, wallExtrema, side, params);
        if (!trough) return;

        trough.claimed = true;
        tip.paired = true;

        const contLength = params.continuationLength || 20;
        const contBias = clamp(params.continuationBias ?? 0.7, 0, 1);

        const troughTan = estimateTangent(wallSamples, trough.index);
        const tipTan = estimateTangent(centerSamples, tip.index);

        const diagVec = normalizeVector({ x: tip.x - trough.x, y: tip.y - trough.y });

        const startDir = blendDirection(troughTan, diagVec, contBias);
        const endDir = blendDirection({ x: -tipTan.x, y: -tipTan.y }, { x: -diagVec.x, y: -diagVec.y }, contBias);

        const handle1 = { x: trough.x + startDir.x * contLength, y: trough.y + startDir.y * contLength };
        const handle2 = { x: tip.x + endDir.x * contLength, y: tip.y + endDir.y * contLength };

        const continuationRail = [];
        const segmentCount = 24;
        for (let i = 0; i <= segmentCount; i++) {
          const t = i / segmentCount;
          const mt = 1 - t;
          continuationRail.push({
            x: mt * mt * mt * trough.x + 3 * mt * mt * t * handle1.x + 3 * mt * t * t * handle2.x + t * t * t * tip.x,
            y: mt * mt * mt * trough.y + 3 * mt * mt * t * handle1.y + 3 * mt * t * t * handle2.y + t * t * t * tip.y
          });
        }
        const continuationLengths = calculateArcLengths(continuationRail);

        const wallRail = [];
        const wallSpan = tip.y - trough.y;
        const wallSegments = Math.max(8, Math.ceil(wallSpan / 6));
        for (let i = 0; i <= wallSegments; i++) {
          const ty = trough.y + wallSpan * (i / wallSegments);
          wallRail.push(interpolateSamplesAt(wallSamples, ty));
        }
        const wallLengths = calculateArcLengths(wallRail);

        const centerRail = [];
        const centerSpan = tip.y - trough.y;
        const centerSegments = Math.max(8, Math.ceil(centerSpan / 6));
        for (let i = 0; i <= centerSegments; i++) {
          const ty = trough.y + centerSpan * (i / centerSegments);
          centerRail.push(interpolateSamplesAt(centerSamples, ty));
        }
        const centerLengths = calculateArcLengths(centerRail);

        const centerTips = centerExtrema.filter(e => e.type === 'peak' || e.type === 'trough');
        const tipIndexInList = centerTips.findIndex(e => e.index === tip.index);
        const nextTipY = tipIndexInList < centerTips.length - 1 ? centerTips[tipIndexInList + 1].y : tip.y + centerSpan;

        const landingRail = [];
        const landingSpan = nextTipY - tip.y;
        const landingSegments = Math.max(8, Math.ceil(landingSpan / 6));
        for (let i = 0; i <= landingSegments; i++) {
          const ty = tip.y + landingSpan * (i / landingSegments);
          landingRail.push(interpolateSamplesAt(centerSamples, ty));
        }
        const landingLengths = calculateArcLengths(landingRail);

        pairs.push({
          side, wall: trough, center: tip, tipIndex: tip.index,
          yStart: trough.y, yEnd: tip.y,
          wallRail, wallLengths, centerRail, centerLengths,
          diagRail: continuationRail, diagLengths: continuationLengths,
          landingRail, landingLengths
        });
      });

      return pairs;
    }

    function assignSideOrdering(continuationPairs) {
      const left = continuationPairs.filter(p => p.side === 'left').sort((a, b) => a.tipIndex - b.tipIndex);
      const right = continuationPairs.filter(p => p.side === 'right').sort((a, b) => a.tipIndex - b.tipIndex);

      left.forEach((pair, i) => { pair.sideIndex = i; });
      right.forEach((pair, i) => { pair.sideIndex = i; });

      // For left pairs: find the right pair whose tipIndex is just after this one
      // (fibers from left pair should land on the next right pair's rail)
      left.forEach((pair, i) => {
        // Find the first right pair with tipIndex > this pair's tipIndex
        const target = right.find(r => r.tipIndex > pair.tipIndex);
        if (target) {
          pair.oppositeLandingRail = target.landingRail;
          pair.oppositeLandingLengths = target.landingLengths;
          pair.oppositeIndex = target.sideIndex;
        } else if (right.length > 0) {
          // Fallback: use index-based mapping like the original (i+1 clamped)
          const targetIdx = Math.min(right.length - 1, i + 1);
          pair.oppositeLandingRail = right[targetIdx].landingRail;
          pair.oppositeLandingLengths = right[targetIdx].landingLengths;
          pair.oppositeIndex = right[targetIdx].sideIndex;
        }
      });

      // For right pairs: find the left pair whose tipIndex is just after this one
      // (fibers from right pair should land on the next left pair's rail)
      right.forEach((pair, i) => {
        // Find the first left pair with tipIndex > this pair's tipIndex
        const target = left.find(l => l.tipIndex > pair.tipIndex);
        if (target) {
          pair.oppositeLandingRail = target.landingRail;
          pair.oppositeLandingLengths = target.landingLengths;
          pair.oppositeIndex = target.sideIndex;
        } else if (left.length > 0) {
          // Fallback: use index-based mapping like the original (i clamped)
          const targetIdx = Math.min(left.length - 1, i);
          pair.oppositeLandingRail = left[targetIdx].landingRail;
          pair.oppositeLandingLengths = left[targetIdx].landingLengths;
          pair.oppositeIndex = left[targetIdx].sideIndex;
        }
      });
    }

    function buildFiberCurves(continuationPairs, leftSamples, rightSamples, centerSamples, params) {
      const curves = [];
      const spacing = Math.max(1, params.fiberSpacing || 8);
      const totalFibers = params.fiberCount ? Math.max(1, Math.round(params.fiberCount)) : Math.max(3, Math.floor(spacing));
      const bias = clamp(params.fiberBias || 0, 0, 1);
      const landingOffset = clamp(params.fiberLanding ?? 0.0, 0, 1);
      const landingSpread = clamp(params.landingSpread ?? 1.0, 0.1, 1);
      const bowStrength = clamp(params.fiberBow ?? 0.5, 0, 1);

      continuationPairs.forEach(pair => {
        const diagRail = pair.diagRail || [];
        const diagLengths = pair.diagLengths || [];
        const wallRail = pair.wallRail || [];
        const wallLengths = pair.wallLengths || [];
        const landingRail = (pair.oppositeLandingRail && pair.oppositeLandingRail.length)
          ? pair.oppositeLandingRail
          : (pair.landingRail && pair.landingRail.length ? pair.landingRail : pair.centerRail);
        const landingLengths = pair.oppositeLandingLengths || pair.landingLengths || pair.centerLengths;

        if (!diagRail.length || !diagLengths.length || !landingRail?.length || !landingLengths?.length) return;

        const diagTotalLength = diagLengths[diagLengths.length - 1] || 0;
        const landingTotalLength = landingLengths[landingLengths.length - 1] || 0;

        const minLength = spacing * 2;
        if (diagTotalLength < minLength || landingTotalLength < minLength) return;

        const maxFibersByLength = Math.floor(diagTotalLength / spacing);
        const effectiveFiberCount = Math.min(totalFibers, Math.max(1, maxFibersByLength));

        for (let i = 0; i < effectiveFiberCount; i++) {
          let fiberParam = (i + 1) / (effectiveFiberCount + 1);
          const ease = 0.5 - 0.5 * Math.cos(Math.PI * fiberParam);
          fiberParam = fiberParam + (ease - fiberParam) * (bias - 0.5) * 2;

          const originParam = fiberParam;
          const landingDirection = pair.side === 'left' ? (1 - fiberParam) : (1 - fiberParam);
          const landingParam = clamp(landingOffset + landingDirection * landingSpread, 0, 1);

          const originPoint = sampleCurveByArcLength(diagRail, diagLengths, originParam);
          const landingPoint = sampleCurveByArcLength(landingRail, landingLengths, landingParam);
          const wallPoint = sampleCurveByArcLength(wallRail, wallLengths, originParam);

          const outernessFactor = 1 - fiberParam;

          let toWall = normalizeVector({ x: wallPoint.x - originPoint.x, y: wallPoint.y - originPoint.y });
          if (!isFinite(toWall.x) || !isFinite(toWall.y)) toWall = { x: 0, y: 0 };

          const gradientPower = clamp(params.bowGradient ?? 2.0, 0.5, 4);
          const shapedFactor = Math.pow(outernessFactor, gradientPower);

          const controlPointDistance = bowStrength * shapedFactor * 100;

          const midStraight = {
            x: originPoint.x + (landingPoint.x - originPoint.x) * 0.5,
            y: originPoint.y + (landingPoint.y - originPoint.y) * 0.5
          };

          const controlPoint = {
            x: midStraight.x + toWall.x * controlPointDistance,
            y: midStraight.y + toWall.y * controlPointDistance
          };

          const points = [];
          const segmentCount = 24;
          for (let j = 0; j <= segmentCount; j++) {
            const t = j / segmentCount;
            points.push(quadraticPoint(originPoint, controlPoint, landingPoint, t));
          }

          curves.push({ side: pair.side, points, pairIndex: pair.sideIndex ?? 0, targetPairIndex: pair.oppositeIndex ?? pair.sideIndex, fiberIndex: i });
        }
      });

      return curves;
    }

    // ========================================================================
    // End Cap and Spout Fiber Generation
    // ========================================================================

    // Select the best landing rail index based on depth slider and scoring
    function selectCapLandingRail(centerExtrema, braidLength, capLandingDepth, tipTaperLength) {
      // Consider first N segments (first 6-8 extrema pairs)
      const maxCandidates = Math.min(8, centerExtrema.length - 1);

      // Target Y based on slider: lerp within taper zone
      const minY = tipTaperLength * 0.1;  // Very shallow (10% into taper)
      const maxY = tipTaperLength * 0.9;  // Deep (90% into taper)
      const targetY = minY + (maxY - minY) * capLandingDepth;

      // Simple approach: find segment with midY closest to targetY
      let bestIdx = 1;
      let bestDist = Infinity;

      for (let i = 1; i < maxCandidates; i++) {
        const zA = centerExtrema[i];
        const zB = centerExtrema[i + 1];
        if (!zA || !zB) continue;

        const midY = (zA.y + zB.y) / 2;
        const dist = Math.abs(midY - targetY);

        if (dist < bestDist) {
          bestDist = dist;
          bestIdx = i;
        }
      }

      console.log(`Cap Landing: depth=${capLandingDepth.toFixed(2)}, targetY=${targetY.toFixed(0)}, selected=Z${bestIdx} (R→Z${bestIdx}-Z${bestIdx+1}, L→Z${bestIdx+1}-Z${bestIdx+2})`);
      return bestIdx;
    }

    function buildStartCapFibers(leftExtrema, rightExtrema, centerSamples, leftSamples, rightSamples, continuationPairs, params, warpPoint, centerExtrema) {
      const fibers = [];
      const { capFiberCount = 8, capGatherLength = 10, braidLength, tipTaper = 0, tipTaperLength = 50, fiberBow = 0.5, capBowAngle = 45, capLandingDepth = 0.3, capBowStrength: capBowStrengthParam = 1.0 } = params;
      const fibersPerSide = Math.max(1, Math.floor(capFiberCount / 2));
      // Use fiberBow as base, multiply by capBowStrength slider for more control
      const capBowStrength = fiberBow * 80 * capBowStrengthParam;
      // Convert angle to radians for control point direction
      const angleRad = (capBowAngle * Math.PI) / 180;

      // When tipTaper is high, connect wall starts to center zigzag segments
      // Use scoring system to select the best landing rail based on capLandingDepth
      const useZigzagLanding = tipTaper > 0.3 && centerExtrema && centerExtrema.length >= 3;

      // Get dynamically selected indices based on slider
      const selectedIdx = useZigzagLanding ? selectCapLandingRail(centerExtrema, braidLength, capLandingDepth, tipTaperLength) : 1;
      const lIdx = selectedIdx + 1;  // L-START lands one segment deeper
      const rIdx = selectedIdx;       // R-START lands at selected segment

      // Left side cap fibers - land on dynamically selected segment
      if (useZigzagLanding) {
        const zA = centerExtrema[lIdx];
        const zB = centerExtrema[lIdx + 1];

        if (zA && zB) {
          // Build a rail along the center zigzag between zA and zB
          const segmentStart = zA.y;
          const segmentEnd = zB.y;
          const zigzagRail = [];
          const numPoints = 20;
          for (let k = 0; k <= numPoints; k++) {
            const segY = segmentStart + (segmentEnd - segmentStart) * (k / numPoints);
            zigzagRail.push(interpolateSamplesAt(centerSamples, segY));
          }
          const zigzagLengths = calculateArcLengths(zigzagRail);

          const originPoint = { x: leftSamples[0].x, y: 0 }; // L-START

          // Determine which end of rail is closer to origin (for correct landing order)
          const railStart = zigzagRail[0];
          const railEnd = zigzagRail[zigzagRail.length - 1];
          const distToStart = Math.hypot(railStart.x - originPoint.x, railStart.y - originPoint.y);
          const distToEnd = Math.hypot(railEnd.x - originPoint.x, railEnd.y - originPoint.y);
          const invertLanding = distToStart > distToEnd; // true if end is closer

          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            // Outer fibers land closer to origin, inner fibers land further
            const landingT = invertLanding ? t : (1 - t);
            const landingPoint = sampleCurveByArcLength(zigzagRail, zigzagLengths, landingT);

            // Create a smooth curve with bow using angle-based control
            const midPoint = lerpVector(originPoint, landingPoint, 0.5);
            // All fibers get some bow, with gradient from outer to inner
            const outernessFactor = 0.3 + 0.7 * (1 - t); // 1.0 for outer, 0.3 for inner
            const bowAmount = capBowStrength * outernessFactor;
            // Use angle for control direction, mirrored for left side (add PI)
            const controlPoint = {
              x: midPoint.x + bowAmount * Math.cos(angleRad + Math.PI),
              y: midPoint.y + bowAmount * Math.sin(angleRad + Math.PI)
            };

            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'left', points, capEnd: 'start', pairIndex: -1, targetPairIndex: 0, fiberIndex: i });
          }
        }
      } else {
        // Original behavior: connect wall trough to center gather point
        const leftTrough = leftExtrema.filter(e => e.type === 'trough' && !e.claimed).sort((a, b) => a.y - b.y)[0];
        const gatherStart = { x: centerSamples[0].x, y: 0 };
        const gatherEnd = interpolateSamplesAt(centerSamples, Math.min(capGatherLength, braidLength * 0.1));

        if (leftTrough) {
          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            const originY = leftTrough.y * (1 - t * 0.3);
            const originPoint = interpolateSamplesAt(leftSamples, originY);
            const landingPoint = lerpVector(gatherStart, gatherEnd, t);
            const midPoint = lerpVector(originPoint, landingPoint, 0.5);
            const wallOffset = (originPoint.x - landingPoint.x) * 0.3;
            const controlPoint = { x: midPoint.x + wallOffset, y: midPoint.y };

            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'left', points, capEnd: 'start', pairIndex: -1, targetPairIndex: -1, fiberIndex: i });
          }
        }
      }

      // Right side cap fibers - land on dynamically selected segment
      if (useZigzagLanding && centerExtrema.length >= rIdx + 2) {
        const zA = centerExtrema[rIdx];
        const zB = centerExtrema[rIdx + 1];

        if (zA && zB) {
          // Build a rail along the center zigzag between zA and zB
          const segmentStart = zA.y;
          const segmentEnd = zB.y;
          const zigzagRail = [];
          const numPoints = 20;
          for (let k = 0; k <= numPoints; k++) {
            const segY = segmentStart + (segmentEnd - segmentStart) * (k / numPoints);
            zigzagRail.push(interpolateSamplesAt(centerSamples, segY));
          }
          const zigzagLengths = calculateArcLengths(zigzagRail);

          const originPoint = { x: rightSamples[0].x, y: 0 }; // R-START

          // Determine which end of rail is closer to origin (for correct landing order)
          const railStart = zigzagRail[0];
          const railEnd = zigzagRail[zigzagRail.length - 1];
          const distToStart = Math.hypot(railStart.x - originPoint.x, railStart.y - originPoint.y);
          const distToEnd = Math.hypot(railEnd.x - originPoint.x, railEnd.y - originPoint.y);
          const invertLanding = distToStart > distToEnd; // true if end is closer

          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            // Outer fibers land closer to origin, inner fibers land further
            const landingT = invertLanding ? t : (1 - t);
            const landingPoint = sampleCurveByArcLength(zigzagRail, zigzagLengths, landingT);

            // Create a smooth curve with bow using angle-based control
            const midPoint = lerpVector(originPoint, landingPoint, 0.5);
            // All fibers get some bow, with gradient from outer to inner
            const outernessFactor = 0.3 + 0.7 * (1 - t); // 1.0 for outer, 0.3 for inner
            const bowAmount = capBowStrength * outernessFactor;
            // Use angle for control direction (no mirroring for right side)
            const controlPoint = {
              x: midPoint.x + bowAmount * Math.cos(angleRad),
              y: midPoint.y + bowAmount * Math.sin(angleRad)
            };

            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'right', points, capEnd: 'start', pairIndex: -1, targetPairIndex: 0, fiberIndex: i });
          }
        }
      } else {
        // Original behavior: connect wall trough to center gather point
        const rightTrough = rightExtrema.filter(e => e.type === 'trough' && !e.claimed).sort((a, b) => a.y - b.y)[0];
        const gatherStart = { x: centerSamples[0].x, y: 0 };
        const gatherEnd = interpolateSamplesAt(centerSamples, Math.min(capGatherLength, braidLength * 0.1));

        if (rightTrough) {
          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            const originY = rightTrough.y * (1 - t * 0.3);
            const originPoint = interpolateSamplesAt(rightSamples, originY);
            const landingPoint = lerpVector(gatherStart, gatherEnd, t);
            const midPoint = lerpVector(originPoint, landingPoint, 0.5);
            const wallOffset = (originPoint.x - landingPoint.x) * 0.3;
            const controlPoint = { x: midPoint.x + wallOffset, y: midPoint.y };

            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'right', points, capEnd: 'start', pairIndex: -1, targetPairIndex: -1, fiberIndex: i });
          }
        }
      }

      return fibers;
    }

    // Select landing rail for END caps (searches from end of braid backwards)
    function selectEndCapLandingRail(centerExtrema, braidLength, capLandingDepth, tipTaperLength) {
      // Consider last N segments
      const startIdx = Math.max(0, centerExtrema.length - 9);
      const endIdx = centerExtrema.length - 1;

      // Target Y from end of braid
      const maxY = braidLength - tipTaperLength * 0.1;  // Very shallow from end
      const minY = braidLength - tipTaperLength * 0.9;  // Deep from end
      const targetY = maxY - (maxY - minY) * capLandingDepth;

      let bestIdx = endIdx - 1;
      let bestDist = Infinity;

      for (let i = startIdx; i < endIdx; i++) {
        const zA = centerExtrema[i];
        const zB = centerExtrema[i + 1];
        if (!zA || !zB) continue;

        const midY = (zA.y + zB.y) / 2;
        const dist = Math.abs(midY - targetY);

        if (dist < bestDist) {
          bestDist = dist;
          bestIdx = i;
        }
      }

      return bestIdx;
    }

    function buildEndCapFibers(centerExtrema, centerSamples, leftSamples, rightSamples, params, warpPoint) {
      const fibers = [];
      const { capFiberCount = 8, braidLength, tipTaper = 0, tipTaperLength = 50, fiberBow = 0.5, capBowAngle = 45, capLandingDepth = 0.3, capBowStrength: capBowStrengthParam = 1.0 } = params;
      const fibersPerSide = Math.max(1, Math.floor(capFiberCount / 2));
      const capBowStrength = fiberBow * 80 * capBowStrengthParam;
      // Flip angle for end caps (mirror of start)
      const angleRad = ((capBowAngle + 180) * Math.PI) / 180;

      const useZigzagLanding = tipTaper > 0.3 && centerExtrema && centerExtrema.length >= 3;

      // Get dynamically selected indices for end
      const selectedIdx = useZigzagLanding ? selectEndCapLandingRail(centerExtrema, braidLength, capLandingDepth, tipTaperLength) : centerExtrema.length - 2;
      const lIdx = selectedIdx;
      const rIdx = selectedIdx - 1 >= 0 ? selectedIdx - 1 : selectedIdx;

      // Left side end cap fibers
      if (useZigzagLanding && centerExtrema.length >= 2) {
        const zA = centerExtrema[lIdx];
        const zB = centerExtrema[lIdx + 1];

        if (zA && zB) {
          const segmentStart = zA.y;
          const segmentEnd = zB.y;
          const zigzagRail = [];
          const numPoints = 20;
          for (let k = 0; k <= numPoints; k++) {
            const segY = segmentStart + (segmentEnd - segmentStart) * (k / numPoints);
            zigzagRail.push(interpolateSamplesAt(centerSamples, segY));
          }
          const zigzagLengths = calculateArcLengths(zigzagRail);

          const originPoint = { x: leftSamples[leftSamples.length - 1].x, y: braidLength }; // L-END

          // Determine landing order
          const railStart = zigzagRail[0];
          const railEnd = zigzagRail[zigzagRail.length - 1];
          const distToStart = Math.hypot(railStart.x - originPoint.x, railStart.y - originPoint.y);
          const distToEnd = Math.hypot(railEnd.x - originPoint.x, railEnd.y - originPoint.y);
          const invertLanding = distToStart > distToEnd;

          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            const landingT = invertLanding ? t : (1 - t);
            const landingPoint = sampleCurveByArcLength(zigzagRail, zigzagLengths, landingT);

            const midPoint = lerpVector(originPoint, landingPoint, 0.5);
            const outernessFactor = 0.3 + 0.7 * (1 - t);
            const bowAmount = capBowStrength * outernessFactor;
            const controlPoint = {
              x: midPoint.x + bowAmount * Math.cos(angleRad + Math.PI),
              y: midPoint.y + bowAmount * Math.sin(angleRad + Math.PI)
            };

            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'left', points, capEnd: 'end', pairIndex: -1, targetPairIndex: 0, fiberIndex: i });
          }
        }
      } else {
        // Fallback: simple end cap
        const lastPeak = centerExtrema.filter(e => !e.paired).sort((a, b) => b.y - a.y)[0];
        if (lastPeak) {
          const leftEnd = { x: leftSamples[leftSamples.length - 1].x, y: braidLength };
          const spanToEnd = braidLength - lastPeak.y;
          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            const originY = lastPeak.y + spanToEnd * t * 0.2;
            const originPoint = interpolateSamplesAt(centerSamples, originY);
            const landingPoint = lerpVector({ x: leftEnd.x, y: lastPeak.y + spanToEnd * 0.7 }, leftEnd, t);
            const midPoint = lerpVector(originPoint, landingPoint, 0.4);
            const controlPoint = { x: midPoint.x + (landingPoint.x - originPoint.x) * 0.2, y: midPoint.y + spanToEnd * 0.1 };
            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'left', points, capEnd: 'end', pairIndex: -1, targetPairIndex: -1, fiberIndex: i });
          }
        }
      }

      // Right side end cap fibers
      if (useZigzagLanding && centerExtrema.length >= 2) {
        const zA = centerExtrema[rIdx];
        const zB = centerExtrema[rIdx + 1];

        if (zA && zB) {
          const segmentStart = zA.y;
          const segmentEnd = zB.y;
          const zigzagRail = [];
          const numPoints = 20;
          for (let k = 0; k <= numPoints; k++) {
            const segY = segmentStart + (segmentEnd - segmentStart) * (k / numPoints);
            zigzagRail.push(interpolateSamplesAt(centerSamples, segY));
          }
          const zigzagLengths = calculateArcLengths(zigzagRail);

          const originPoint = { x: rightSamples[rightSamples.length - 1].x, y: braidLength }; // R-END

          // Determine landing order
          const railStart = zigzagRail[0];
          const railEnd = zigzagRail[zigzagRail.length - 1];
          const distToStart = Math.hypot(railStart.x - originPoint.x, railStart.y - originPoint.y);
          const distToEnd = Math.hypot(railEnd.x - originPoint.x, railEnd.y - originPoint.y);
          const invertLanding = distToStart > distToEnd;

          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            const landingT = invertLanding ? t : (1 - t);
            const landingPoint = sampleCurveByArcLength(zigzagRail, zigzagLengths, landingT);

            const midPoint = lerpVector(originPoint, landingPoint, 0.5);
            const outernessFactor = 0.3 + 0.7 * (1 - t);
            const bowAmount = capBowStrength * outernessFactor;
            const controlPoint = {
              x: midPoint.x + bowAmount * Math.cos(angleRad),
              y: midPoint.y + bowAmount * Math.sin(angleRad)
            };

            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'right', points, capEnd: 'end', pairIndex: -1, targetPairIndex: 0, fiberIndex: i });
          }
        }
      } else {
        // Fallback: simple end cap
        const lastPeak = centerExtrema.filter(e => !e.paired).sort((a, b) => b.y - a.y)[0];
        if (lastPeak) {
          const rightEnd = { x: rightSamples[rightSamples.length - 1].x, y: braidLength };
          const spanToEnd = braidLength - lastPeak.y;
          for (let i = 0; i < fibersPerSide; i++) {
            const t = (i + 0.5) / fibersPerSide;
            const originY = lastPeak.y + spanToEnd * t * 0.2;
            const originPoint = interpolateSamplesAt(centerSamples, originY);
            const landingPoint = lerpVector({ x: rightEnd.x, y: lastPeak.y + spanToEnd * 0.7 }, rightEnd, t);
            const midPoint = lerpVector(originPoint, landingPoint, 0.4);
            const controlPoint = { x: midPoint.x + (landingPoint.x - originPoint.x) * 0.2, y: midPoint.y + spanToEnd * 0.1 };
            const points = [];
            for (let j = 0; j <= 24; j++) {
              const pt = j / 24;
              points.push(warpPoint(quadraticPoint(originPoint, controlPoint, landingPoint, pt)));
            }
            fibers.push({ type: 'cap', side: 'right', points, capEnd: 'end', pairIndex: -1, targetPairIndex: -1, fiberIndex: i });
          }
        }
      }

      return fibers;
    }

    function buildSpoutFibers(centerSamples, backbone, params, warpPoint) {
      const fibers = [];
      const { spoutFiberCount = 5, spoutLength = 50, spoutSpread = 30, spoutGravity = 0.3, spoutAtStart = false } = params;

      if (spoutFiberCount <= 0) return fibers;

      const gravityDir = { x: 0, y: 1 };

      // End spout
      const endPoint = centerSamples[centerSamples.length - 1];
      let endTangent = { x: 0, y: 1 };
      if (backbone) endTangent = normalizeVector(backbone.getTangentAt(1));

      const endDir = normalizeVector(lerpVector(endTangent, gravityDir, spoutGravity));

      for (let i = 0; i < spoutFiberCount; i++) {
        const angleOffset = ((i - (spoutFiberCount - 1) / 2) / Math.max(1, spoutFiberCount - 1)) * spoutSpread;
        const fiberDir = rotateVector(endDir, angleOffset);
        const originPoint = { x: endPoint.x, y: endPoint.y };
        const endPointFiber = { x: originPoint.x + fiberDir.x * spoutLength, y: originPoint.y + fiberDir.y * spoutLength };
        const midPoint = lerpVector(originPoint, endPointFiber, 0.5);
        const perpOffset = (i - (spoutFiberCount - 1) / 2) * 3;
        const controlPoint = { x: midPoint.x - fiberDir.y * perpOffset, y: midPoint.y + fiberDir.x * perpOffset };

        const points = [];
        for (let j = 0; j <= 24; j++) {
          const t = j / 24;
          const point = quadraticPoint(originPoint, controlPoint, endPointFiber, t);
          const warpedOrigin = warpPoint(originPoint);
          const warpBlend = 1 - t;
          const warpedPoint = warpPoint(point);
          points.push({
            x: warpedPoint.x * warpBlend + (warpedOrigin.x + (point.x - originPoint.x)) * (1 - warpBlend),
            y: warpedPoint.y * warpBlend + (warpedOrigin.y + (point.y - originPoint.y)) * (1 - warpBlend)
          });
        }
        fibers.push({ type: 'spout', side: 'center', points, spoutEnd: 'end', pairIndex: -1, targetPairIndex: -1, fiberIndex: i });
      }

      // Start spout (optional)
      if (spoutAtStart) {
        const startPoint = centerSamples[0];
        let startTangent = { x: 0, y: -1 };
        if (backbone) startTangent = normalizeVector({ x: -backbone.getTangentAt(0).x, y: -backbone.getTangentAt(0).y });

        const invertedGravity = { x: 0, y: -1 };
        const startDir = normalizeVector(lerpVector(startTangent, invertedGravity, spoutGravity));

        for (let i = 0; i < spoutFiberCount; i++) {
          const angleOffset = ((i - (spoutFiberCount - 1) / 2) / Math.max(1, spoutFiberCount - 1)) * spoutSpread;
          const fiberDir = rotateVector(startDir, angleOffset);
          const originPoint = { x: startPoint.x, y: startPoint.y };
          const endPointFiber = { x: originPoint.x + fiberDir.x * spoutLength, y: originPoint.y + fiberDir.y * spoutLength };
          const midPoint = lerpVector(originPoint, endPointFiber, 0.5);
          const perpOffset = (i - (spoutFiberCount - 1) / 2) * 3;
          const controlPoint = { x: midPoint.x - fiberDir.y * perpOffset, y: midPoint.y + fiberDir.x * perpOffset };

          const points = [];
          for (let j = 0; j <= 24; j++) {
            const t = j / 24;
            const point = quadraticPoint(originPoint, controlPoint, endPointFiber, t);
            const warpedOrigin = warpPoint(originPoint);
            const warpBlend = 1 - t;
            const warpedPoint = warpPoint(point);
            points.push({
              x: warpedPoint.x * warpBlend + (warpedOrigin.x + (point.x - originPoint.x)) * (1 - warpBlend),
              y: warpedPoint.y * warpBlend + (warpedOrigin.y + (point.y - originPoint.y)) * (1 - warpBlend)
            });
          }
          fibers.push({ type: 'spout', side: 'center', points, spoutEnd: 'start', pairIndex: -1, targetPairIndex: -1, fiberIndex: i });
        }
      }

      return fibers;
    }

    function generateBraid(backbone, params) {
      // Curvature-aware parameters
      const redistributionFactor = params.redistributionFactor ?? 0;
      const curvatureSmoothing = params.curvatureSmoothing ?? 5;

      // Compute backbone arc lengths for frequency adjustment
      const arcLengths = backbone ? computeBackboneArcLengths(backbone) : null;

      // Compute smoothed curvature for redistribution
      const curvatureSamples = (backbone && redistributionFactor > 0)
        ? computeBackboneCurvature(backbone, params.braidLength ?? 800, 100, curvatureSmoothing)
        : null;

      const config = {
        frequency: params.frequency ?? 2.25,
        wallFrequency: params.wallFrequency ?? params.frequency ?? 2.25,
        cycleJitter: params.cycleJitter ?? 0,
        zigzagScale: params.zigzagScale ?? 1.0,
        wallScale: params.wallScale ?? 1.0,
        tipTaper: params.tipTaper ?? 0.0,
        tipTaperLength: params.tipTaperLength ?? 50,
        fiberCount: params.fiberCount ?? 10,
        fiberBias: params.fiberBias ?? 0.5,
        fiberLanding: params.fiberLanding ?? 0.0,
        fiberBow: params.fiberBow ?? 0.5,
        bowGradient: params.bowGradient ?? 2.0,
        zigzagPhase: params.zigzagPhase ?? 0,
        leftWallPhase: params.leftWallPhase ?? 0,
        rightWallPhase: params.rightWallPhase ?? 0,
        sampleSpacing: params.sampleSpacing ?? 4,
        continuationLength: params.continuationLength ?? 20,
        continuationBias: params.continuationBias ?? 0.7,
        landingSpread: params.landingSpread ?? 1.0,
        wallSeparation: params.wallSeparation ?? 100,
        braidLength: params.braidLength ?? 800,
        fiberSpacing: params.fiberSpacing ?? 3,
        // Curvature-aware parameters
        arcLengths,
        redistributionFactor,
        curvatureSmoothing,
        // End cap parameters
        enableCaps: params.enableCaps ?? true,
        capFiberCount: params.capFiberCount ?? 8,
        capGatherLength: params.capGatherLength ?? 10,
        capBowAngle: params.capBowAngle ?? 45,
        capLandingDepth: params.capLandingDepth ?? 0.3,
        capBowStrength: params.capBowStrength ?? 1.0,
        // Spout parameters
        spoutFiberCount: params.spoutFiberCount ?? 5,
        spoutLength: params.spoutLength ?? 50,
        spoutSpread: params.spoutSpread ?? 30,
        spoutGravity: params.spoutGravity ?? 0.3,
        spoutAtStart: params.spoutAtStart ?? false
      };

      const centerSamples = sampleBoundary(generateCenterX, config);
      const leftSamples = sampleBoundary((phaseY, actualY, p) => generateWallX(phaseY, actualY, 'left', p), config);
      const rightSamples = sampleBoundary((phaseY, actualY, p) => generateWallX(phaseY, actualY, 'right', p), config);

      const centerExtrema = detectExtrema(centerSamples).map(ext => ({ ...ext, paired: false }));
      const leftExtrema = detectExtrema(leftSamples).map(ext => ({ ...ext, claimed: false }));
      const rightExtrema = detectExtrema(rightSamples).map(ext => ({ ...ext, claimed: false }));

      const continuationPairs = buildContinuationPairs(leftSamples, rightSamples, centerSamples, centerExtrema, leftExtrema, rightExtrema, config);
      assignSideOrdering(continuationPairs);
      const fiberCurves = buildFiberCurves(continuationPairs, leftSamples, rightSamples, centerSamples, config);

      const warpPoint = createWarpFunction(backbone, config.braidLength, curvatureSamples, config);

      const outlines = [];
      outlines.push({ side: 'center', type: 'zigzag', points: centerSamples.map(warpPoint), index: 0 });
      outlines.push({ side: 'left', type: 'wall', points: leftSamples.map(warpPoint), index: 1 });
      outlines.push({ side: 'right', type: 'wall', points: rightSamples.map(warpPoint), index: 2 });
      continuationPairs.forEach((pair, idx) => {
        outlines.push({ side: pair.side, type: 'continuation', points: pair.diagRail.map(warpPoint), index: idx + 3 });
      });

      const mainFibers = fiberCurves.map(fiber => ({ ...fiber, type: 'main', points: fiber.points.map(warpPoint) }));

      // Generate cap fibers (if enabled)
      let capFibers = [];
      if (config.enableCaps) {
        const startCapFibers = buildStartCapFibers(leftExtrema, rightExtrema, centerSamples, leftSamples, rightSamples, continuationPairs, config, warpPoint, centerExtrema);
        const endCapFibers = buildEndCapFibers(centerExtrema, centerSamples, leftSamples, rightSamples, config, warpPoint);
        capFibers = [...startCapFibers, ...endCapFibers];
      }

      // Generate spout fibers (if count > 0)
      let spoutFibers = [];
      if (config.spoutFiberCount > 0) {
        spoutFibers = buildSpoutFibers(centerSamples, backbone, config, warpPoint);
      }

      const allFibers = [...mainFibers, ...capFibers, ...spoutFibers];

      return {
        outlines,
        fibers: allFibers,
        fiberGroups: { main: mainFibers, caps: capFibers, spouts: spoutFibers },
        debug: {
          centerExtrema,
          leftExtrema,
          rightExtrema,
          continuationPairs,
          centerSamples,
          leftSamples,
          rightSamples,
          config
        },
        metadata: {
          braidLength: config.braidLength,
          fiberCount: allFibers.length,
          mainFiberCount: mainFibers.length,
          capFiberCount: capFibers.length,
          spoutFiberCount: spoutFibers.length,
          parameters: config
        }
      };
    }

    // ========================================================================
    // Path Generators
    // ========================================================================

    function generateMeanderingPath(width, height, margin) {
      const points = [];
      const amplitude = (width - margin * 2) / 2 - 100;
      const centerX = width / 2;
      const rows = 6;
      const rowHeight = (height - margin * 2) / rows;

      for (let row = 0; row < rows; row++) {
        const y = margin + row * rowHeight;
        const direction = row % 2 === 0 ? 1 : -1;
        const startX = centerX - direction * amplitude;
        const endX = centerX + direction * amplitude;

        // Horizontal segment
        const segmentPoints = 50;
        for (let i = 0; i <= segmentPoints; i++) {
          const t = i / segmentPoints;
          points.push({
            x: startX + (endX - startX) * t,
            y: y + Math.sin(t * Math.PI * 2) * 30
          });
        }

        // Vertical connector (if not last row)
        if (row < rows - 1) {
          const connectorPoints = 20;
          for (let i = 1; i <= connectorPoints; i++) {
            const t = i / connectorPoints;
            points.push({
              x: endX + Math.sin(t * Math.PI) * 40 * direction,
              y: y + t * rowHeight
            });
          }
        }
      }

      return points;
    }

    function generateSpiralPath(width, height, margin) {
      const points = [];
      const centerX = width / 2;
      const centerY = height / 2;
      const maxRadius = Math.min(width, height) / 2 - margin - 50;
      const turns = 4;
      const totalPoints = 500;

      for (let i = 0; i <= totalPoints; i++) {
        const t = i / totalPoints;
        const angle = t * turns * Math.PI * 2;
        const radius = maxRadius * (1 - t * 0.8);
        points.push({
          x: centerX + Math.cos(angle) * radius,
          y: centerY + Math.sin(angle) * radius
        });
      }

      return points;
    }

    function generateZigzagPath(width, height, margin) {
      const points = [];
      const amplitude = (width - margin * 2) / 2 - 100;
      const centerX = width / 2;
      const segments = 8;
      const segmentHeight = (height - margin * 2) / segments;

      for (let seg = 0; seg <= segments; seg++) {
        const y = margin + seg * segmentHeight;
        const x = centerX + (seg % 2 === 0 ? -amplitude : amplitude);
        points.push({ x, y });
      }

      // Interpolate for smoother path
      const smoothPoints = [];
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i];
        const p1 = points[i + 1];
        for (let j = 0; j <= 30; j++) {
          const t = j / 30;
          smoothPoints.push({
            x: p0.x + (p1.x - p0.x) * t,
            y: p0.y + (p1.y - p0.y) * t
          });
        }
      }

      return smoothPoints;
    }

    function generateLissajousPath(width, height, margin) {
      const points = [];
      const centerX = width / 2;
      const centerY = height / 2;
      const amplitudeX = (width - margin * 2) / 2 - 100;
      const amplitudeY = (height - margin * 2) / 2 - 100;
      const a = 3;
      const b = 4;
      const totalPoints = 600;

      for (let i = 0; i <= totalPoints; i++) {
        const t = (i / totalPoints) * Math.PI * 2;
        points.push({
          x: centerX + Math.sin(a * t) * amplitudeX,
          y: centerY + Math.sin(b * t + Math.PI / 4) * amplitudeY
        });
      }

      return points;
    }

    // ========================================================================
    // Backbone from Points
    // ========================================================================

    function createBackboneFromPoints(points) {
      const lengths = calculateArcLengths(points);
      const totalLength = lengths[lengths.length - 1];

      return {
        points,
        totalLength,
        getPointAt(t) {
          const targetLength = t * totalLength;
          for (let i = 0; i < points.length - 1; i++) {
            if (targetLength >= lengths[i] && targetLength <= lengths[i + 1]) {
              const segLen = lengths[i + 1] - lengths[i];
              const localT = segLen > 0 ? (targetLength - lengths[i]) / segLen : 0;
              return {
                x: points[i].x + (points[i + 1].x - points[i].x) * localT,
                y: points[i].y + (points[i + 1].y - points[i].y) * localT
              };
            }
          }
          return { ...points[points.length - 1] };
        },
        getTangentAt(t) {
          const delta = 0.001;
          const p0 = this.getPointAt(Math.max(0, t - delta));
          const p1 = this.getPointAt(Math.min(1, t + delta));
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const len = Math.hypot(dx, dy) || 1;
          return { x: dx / len, y: dy / len };
        }
      };
    }

    // ========================================================================
    // Rendering
    // ========================================================================

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statsEl = document.getElementById('stats');

    // A3 size in mm: 297 x 420
    // At 96 DPI: ~1123 x 1587 pixels
    const A3_WIDTH = 1123;
    const A3_HEIGHT = 1587;

    let currentBraid = null;
    let currentBackbone = null;

    function render() {
      const scale = parseFloat(document.getElementById('scale').value);
      const w = A3_WIDTH * scale;
      const h = A3_HEIGHT * scale;

      canvas.width = w;
      canvas.height = h;

      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.scale(scale, scale);

      // Draw backbone path (light gray)
      if (currentBackbone) {
        ctx.strokeStyle = '#ddd';
        ctx.lineWidth = 2;
        ctx.beginPath();
        currentBackbone.points.forEach((p, i) => {
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
      }

      if (currentBraid) {
        // Debug colors for fiber types
        const DEBUG_COLORS = {
          main: '#999',
          cap: '#0066cc',
          spout: '#00aa44'
        };

        // Draw fibers with type-based colors
        ctx.lineWidth = 1;
        currentBraid.fibers.forEach(fiber => {
          ctx.strokeStyle = DEBUG_COLORS[fiber.type] || DEBUG_COLORS.main;
          ctx.beginPath();
          fiber.points.forEach((p, i) => {
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.stroke();
        });

        // Draw outlines
        currentBraid.outlines.forEach(outline => {
          if (outline.type === 'zigzag') {
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 2;
          } else if (outline.type === 'wall' && outline.side === 'left') {
            ctx.strokeStyle = '#00ccff';
            ctx.lineWidth = 2;
          } else if (outline.type === 'wall' && outline.side === 'right') {
            ctx.strokeStyle = '#ff00cc';
            ctx.lineWidth = 2;
          } else if (outline.type === 'continuation') {
            ctx.strokeStyle = '#ff914d';
            ctx.lineWidth = 2;
          }

          ctx.beginPath();
          outline.points.forEach((p, i) => {
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.stroke();
        });

        // Debug visualization
        if (document.getElementById('showDebug').checked && currentBraid.debug) {
          const debug = currentBraid.debug;
          const { tipTaperLength, braidLength } = debug.config;
          const warpPoint = createWarpFunction(currentBackbone, braidLength, null, debug.config);

          // Draw wall start/end points (not extrema, actual endpoints)
          const leftStart = debug.leftSamples[0];
          const leftEnd = debug.leftSamples[debug.leftSamples.length - 1];
          const rightStart = debug.rightSamples[0];
          const rightEnd = debug.rightSamples[debug.rightSamples.length - 1];
          const centerStart = debug.centerSamples[0];
          const centerEnd = debug.centerSamples[debug.centerSamples.length - 1];

          // Left wall start/end - cyan squares
          [{ pt: leftStart, label: 'L-START' }, { pt: leftEnd, label: 'L-END' }].forEach(({ pt, label }) => {
            const warped = warpPoint(pt);
            ctx.fillStyle = '#00ccff';
            ctx.fillRect(warped.x - 6, warped.y - 6, 12, 12);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(warped.x - 6, warped.y - 6, 12, 12);
            ctx.fillStyle = '#000';
            ctx.font = 'bold 12px monospace';
            ctx.fillText(label, warped.x - 55, warped.y - 10);
          });

          // Right wall start/end - magenta squares
          [{ pt: rightStart, label: 'R-START' }, { pt: rightEnd, label: 'R-END' }].forEach(({ pt, label }) => {
            const warped = warpPoint(pt);
            ctx.fillStyle = '#ff00cc';
            ctx.fillRect(warped.x - 6, warped.y - 6, 12, 12);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(warped.x - 6, warped.y - 6, 12, 12);
            ctx.fillStyle = '#000';
            ctx.font = 'bold 12px monospace';
            ctx.fillText(label, warped.x + 10, warped.y - 10);
          });

          // Center/Zigzag start/end - yellow squares
          [{ pt: centerStart, label: 'Z-START' }, { pt: centerEnd, label: 'Z-END' }].forEach(({ pt, label }) => {
            const warped = warpPoint(pt);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(warped.x - 6, warped.y - 6, 12, 12);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(warped.x - 6, warped.y - 6, 12, 12);
            ctx.fillStyle = '#000';
            ctx.font = 'bold 12px monospace';
            ctx.fillText(label, warped.x + 10, warped.y - 10);
          });

          // Draw extrema markers
          // Center extrema: green circles if paired, red if unpaired
          debug.centerExtrema.forEach((e, idx) => {
            const warped = warpPoint(e);
            ctx.beginPath();
            ctx.arc(warped.x, warped.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = e.paired ? '#00ff00' : '#ff0000';
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.stroke();
            // Show red ring if in taper zone
            if (e.y < tipTaperLength || e.y > braidLength - tipTaperLength) {
              ctx.strokeStyle = '#ff0000';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(warped.x, warped.y, 10, 0, Math.PI * 2);
              ctx.stroke();
            }
            // Label with Z0, Z1, Z2... (Z for Zigzag center line)
            ctx.fillStyle = '#000';
            ctx.font = 'bold 11px monospace';
            ctx.fillText(`Z${idx}`, warped.x + 10, warped.y - 4);
          });

          // Left wall extrema: cyan if claimed, orange if unclaimed
          debug.leftExtrema.forEach((e, idx) => {
            const warped = warpPoint(e);
            ctx.beginPath();
            ctx.arc(warped.x, warped.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = e.claimed ? '#00ccff' : '#ff6600';
            ctx.fill();
            // Label with L0, L1, L2...
            ctx.fillStyle = '#000';
            ctx.font = 'bold 11px monospace';
            ctx.fillText(`L${idx}`, warped.x - 25, warped.y + 4);
          });

          // Right wall extrema: magenta if claimed, orange if unclaimed
          debug.rightExtrema.forEach((e, idx) => {
            const warped = warpPoint(e);
            ctx.beginPath();
            ctx.arc(warped.x, warped.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = e.claimed ? '#ff00cc' : '#ff6600';
            ctx.fill();
            // Label with R0, R1, R2...
            ctx.fillStyle = '#000';
            ctx.font = 'bold 11px monospace';
            ctx.fillText(`R${idx}`, warped.x + 10, warped.y + 4);
          });

          // Draw origin points and landing rails for continuation pairs
          debug.continuationPairs.forEach((pair, idx) => {
            // Origin point (wall trough): white square
            const wallWarped = warpPoint(pair.wall);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(wallWarped.x - 4, wallWarped.y - 4, 8, 8);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.strokeRect(wallWarped.x - 4, wallWarped.y - 4, 8, 8);

            // Landing point (center tip): white diamond
            const tipWarped = warpPoint(pair.center);
            ctx.save();
            ctx.translate(tipWarped.x, tipWarped.y);
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-4, -4, 8, 8);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(-4, -4, 8, 8);
            ctx.restore();

            // Draw landing rail - thin purple line
            if (pair.landingRail && pair.landingRail.length > 0) {
              ctx.strokeStyle = 'rgba(128, 0, 255, 0.5)';
              ctx.lineWidth = 3;
              ctx.beginPath();
              pair.landingRail.forEach((p, i) => {
                const wp = warpPoint(p);
                if (i === 0) ctx.moveTo(wp.x, wp.y);
                else ctx.lineTo(wp.x, wp.y);
              });
              ctx.stroke();
            }
          });

          // Console log for debugging
          console.log(`DEBUG tipTaper=${debug.config.tipTaper.toFixed(2)}:`, {
            centerExtrema: debug.centerExtrema.length,
            leftExtrema: debug.leftExtrema.length,
            rightExtrema: debug.rightExtrema.length,
            continuationPairs: debug.continuationPairs.length,
            unpairedCenter: debug.centerExtrema.filter(e => !e.paired).length,
            inTaperZone: debug.centerExtrema.filter(e =>
              e.y < tipTaperLength || e.y > braidLength - tipTaperLength
            ).length
          });
        }
      }

      ctx.restore();
    }

    function generate() {
      const startTime = performance.now();

      const pathType = document.getElementById('pathType').value;
      const margin = 100;

      let pathPoints;
      switch (pathType) {
        case 'spiral':
          pathPoints = generateSpiralPath(A3_WIDTH, A3_HEIGHT, margin);
          break;
        case 'zigzag':
          pathPoints = generateZigzagPath(A3_WIDTH, A3_HEIGHT, margin);
          break;
        case 'lissajous':
          pathPoints = generateLissajousPath(A3_WIDTH, A3_HEIGHT, margin);
          break;
        default:
          pathPoints = generateMeanderingPath(A3_WIDTH, A3_HEIGHT, margin);
      }

      currentBackbone = createBackboneFromPoints(pathPoints);

      const frequency = parseFloat(document.getElementById('frequency').value);
      const wallFrequency = parseFloat(document.getElementById('wallFrequency').value);
      const braidLength = currentBackbone.totalLength;

      // Adaptive sample spacing: use the HIGHER of the two frequencies
      // to ensure we capture both zigzag peaks and wall bounces
      const maxFreq = Math.max(frequency, wallFrequency);
      const wavelength = braidLength / maxFreq;
      const sampleSpacing = Math.min(2, wavelength / 40);

      const params = {
        frequency,
        wallFrequency,
        fiberCount: parseInt(document.getElementById('fiberCount').value),
        fiberBow: parseFloat(document.getElementById('fiberBow').value),
        tipTaper: parseFloat(document.getElementById('tipTaper').value),
        tipTaperLength: parseFloat(document.getElementById('tipTaperLength').value),
        redistributionFactor: parseFloat(document.getElementById('redistributionFactor').value),
        curvatureSmoothing: parseInt(document.getElementById('curvatureSmoothing').value),
        zigzagScale: parseFloat(document.getElementById('zigzagScale').value),
        wallScale: parseFloat(document.getElementById('wallScale').value),
        wallSeparation: parseFloat(document.getElementById('wallSeparation').value),
        leftWallPhase: parseFloat(document.getElementById('leftWallPhase').value),
        rightWallPhase: parseFloat(document.getElementById('rightWallPhase').value),
        cycleJitter: parseFloat(document.getElementById('cycleJitter').value),
        zigzagPhase: parseFloat(document.getElementById('zigzagPhase').value),
        fiberBias: parseFloat(document.getElementById('fiberBias').value),
        fiberLanding: parseFloat(document.getElementById('fiberLanding').value),
        bowGradient: parseFloat(document.getElementById('bowGradient').value),
        landingSpread: parseFloat(document.getElementById('landingSpread').value),
        continuationLength: parseFloat(document.getElementById('continuationLength').value),
        continuationBias: parseFloat(document.getElementById('continuationBias').value),
        // End cap parameters
        enableCaps: document.getElementById('enableCaps').checked,
        capFiberCount: parseInt(document.getElementById('capFiberCount').value),
        capGatherLength: parseFloat(document.getElementById('capGatherLength').value),
        capBowAngle: parseFloat(document.getElementById('capBowAngle').value),
        capBowStrength: parseFloat(document.getElementById('capBowStrength').value),
        capLandingDepth: parseFloat(document.getElementById('capLandingDepth').value),
        // Spout parameters
        spoutFiberCount: parseInt(document.getElementById('spoutFiberCount').value),
        spoutLength: parseFloat(document.getElementById('spoutLength').value),
        spoutSpread: parseFloat(document.getElementById('spoutSpread').value),
        spoutGravity: parseFloat(document.getElementById('spoutGravity').value),
        spoutAtStart: document.getElementById('spoutAtStart').checked,
        braidLength,
        sampleSpacing
      };

      console.log('Generate params capLandingDepth:', params.capLandingDepth);
      currentBraid = generateBraid(currentBackbone, params);

      const elapsed = (performance.now() - startTime).toFixed(1);
      const meta = currentBraid.metadata;
      statsEl.textContent = `Path: ${pathPoints.length} pts | Length: ${Math.round(currentBackbone.totalLength)}px | Fibers: ${meta.mainFiberCount} main + ${meta.capFiberCount} cap + ${meta.spoutFiberCount} spout | ${elapsed}ms`;

      render();
    }

    function exportSVG() {
      if (!currentBraid) {
        alert('Generate a braid first!');
        return;
      }

      let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${A3_WIDTH} ${A3_HEIGHT}" width="${A3_WIDTH}" height="${A3_HEIGHT}">`;
      svg += `<rect width="100%" height="100%" fill="white"/>`;

      // Main fibers layer
      svg += '<g id="main-fibers" stroke="#000" fill="none" stroke-width="1">';
      currentBraid.fiberGroups.main.forEach(fiber => {
        const d = 'M ' + fiber.points.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' L ');
        svg += `<path d="${d}"/>`;
      });
      svg += '</g>';

      // Cap fibers layer
      svg += '<g id="cap-fibers" stroke="#000" fill="none" stroke-width="1">';
      currentBraid.fiberGroups.caps.forEach(fiber => {
        const d = 'M ' + fiber.points.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' L ');
        svg += `<path d="${d}"/>`;
      });
      svg += '</g>';

      // Spout fibers layer
      svg += '<g id="spout-fibers" stroke="#000" fill="none" stroke-width="1">';
      currentBraid.fiberGroups.spouts.forEach(fiber => {
        const d = 'M ' + fiber.points.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' L ');
        svg += `<path d="${d}"/>`;
      });
      svg += '</g>';

      // Outlines
      svg += '<g id="braid-outlines" fill="none" stroke-width="2">';
      currentBraid.outlines.forEach(outline => {
        let color = '#333';
        if (outline.type === 'zigzag') color = '#ffcc00';
        else if (outline.type === 'wall' && outline.side === 'left') color = '#00ccff';
        else if (outline.type === 'wall' && outline.side === 'right') color = '#ff00cc';
        else if (outline.type === 'continuation') color = '#ff914d';

        const d = 'M ' + outline.points.map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' L ');
        svg += `<path d="${d}" stroke="${color}"/>`;
      });
      svg += '</g>';

      svg += '</svg>';

      // Download
      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `braid-stress-test-${Date.now()}.svg`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Event listeners - live update on all controls
    const controls = [
      'frequency', 'wallFrequency', 'zigzagScale', 'wallScale', 'wallSeparation',
      'leftWallPhase', 'rightWallPhase',
      'fiberCount', 'fiberBow', 'tipTaper', 'tipTaperLength',
      'redistributionFactor', 'curvatureSmoothing',
      'cycleJitter', 'zigzagPhase', 'fiberBias', 'fiberLanding',
      'bowGradient', 'landingSpread', 'continuationLength', 'continuationBias',
      // Cap and spout controls
      'capFiberCount', 'capGatherLength', 'capBowAngle', 'capBowStrength', 'capLandingDepth',
      'spoutFiberCount', 'spoutLength', 'spoutSpread', 'spoutGravity'
    ];

    controls.forEach(id => {
      const el = document.getElementById(id);
      const valEl = document.getElementById(id + 'Val');
      el.addEventListener('input', () => {
        if (valEl) valEl.textContent = el.value;
        generate();
      });
      // Initialize display
      if (valEl) valEl.textContent = el.value;
    });

    // Checkbox controls
    ['enableCaps', 'spoutAtStart'].forEach(id => {
      document.getElementById(id).addEventListener('change', generate);
    });

    // Debug checkbox triggers re-render (not regenerate)
    document.getElementById('showDebug').addEventListener('change', render);

    // Path type regenerates the backbone
    document.getElementById('pathType').addEventListener('change', generate);

    // Scale just re-renders (no regeneration needed)
    document.getElementById('scale').addEventListener('input', () => {
      document.getElementById('scaleVal').textContent = document.getElementById('scale').value;
      render();
    });

    document.getElementById('exportSvg').addEventListener('click', exportSVG);

    // Initial generation
    generate();
  </script>
</body>
</html>
