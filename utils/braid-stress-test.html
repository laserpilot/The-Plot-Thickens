<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Braid Stress Test - A3 Long Path</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .controls {
      padding: 15px;
      background: #16213e;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .control-group label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
    }
    .control-group select {
      padding: 6px 10px;
      background: #0f3460;
      border: 1px solid #1a1a2e;
      color: #fff;
      border-radius: 4px;
      width: 120px;
    }
    .control-group input[type="range"] {
      width: 100px;
      accent-color: #e94560;
    }
    button {
      padding: 10px 20px;
      background: #e94560;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #ff6b6b; }
    .stats {
      margin-left: auto;
      font-size: 12px;
      color: #888;
    }
    .canvas-container {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    canvas {
      background: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="controls">
    <div class="control-group">

      <select id="pathType">
        <option value="meander">Meandering</option>
        <option value="spiral">Spiral</option>

        <option value="lissajous">Lissajous</option>
      </select>
    </div>
    <div class="control-group">
      <label>Zigzag Freq <span id="frequencyVal">160</span></label>
      <input type="range" id="frequency" value="160" min="1" max="300" step="1">
    </div>
    <div class="control-group">
      <label>Wall Freq <span id="wallFrequencyVal">80</span></label>
      <input type="range" id="wallFrequency" value="80" min="1" max="300" step="1">
    </div>
    <div class="control-group">
      <label>Zigzag Amp <span id="zigzagScaleVal">0.5</span></label>
      <input type="range" id="zigzagScale" value="0.5" min="0.1" max="3" step="0.1">
    </div>
    <div class="control-group">
      <label>Wall Amp <span id="wallScaleVal">0.4</span></label>
      <input type="range" id="wallScale" value="0.4" min="0.1" max="3" step="0.1">
    </div>
    <div class="control-group">
      <label>Wall Sep <span id="wallSeparationVal">105</span></label>
      <input type="range" id="wallSeparation" value="105" min="20" max="200" step="5">
    </div>
    <div class="control-group">
      <label>L Wall Phase <span id="leftWallPhaseVal">60</span>°</label>
      <input type="range" id="leftWallPhase" value="60" min="-180" max="180" step="5">
    </div>
    <div class="control-group">
      <label>R Wall Phase <span id="rightWallPhaseVal">160</span>°</label>
      <input type="range" id="rightWallPhase" value="160" min="-180" max="180" step="5">
    </div>
    <div class="control-group">
      <label>Fiber Count <span id="fiberCountVal">8</span></label>
      <input type="range" id="fiberCount" value="8" min="1" max="30" step="1">
    </div>
    <div class="control-group">
      <label>Fiber Bow <span id="fiberBowVal">0.9</span></label>
      <input type="range" id="fiberBow" value="0.9" min="0" max="1" step="0.05">
    </div>
    <div class="control-group">
      <label>Tip Taper <span id="tipTaperVal">1</span></label>
      <input type="range" id="tipTaper" value="1" min="0" max="1" step="0.05">
    </div>
    <div class="control-group">
      <label>Taper Length <span id="tipTaperLengthVal">200</span></label>
      <input type="range" id="tipTaperLength" value="200" min="10" max="200" step="5">

    <div class="control-group">

    <div class="control-group">

    </div>
    <div class="control-group">
      <label>Cycle Jitter <span id="cycleJitterVal">0</span></label>
      <input type="range" id="cycleJitter" value="0" min="0" max="1" step="0.05">
    </div>
    <div class="control-group">
      <label>Zigzag Phase <span id="zigzagPhaseVal">0</span>°</label>
      <input type="range" id="zigzagPhase" value="0" min="-180" max="180" step="5">
    </div>
    <div class="control-group">
      <label>Fiber Bias <span id="fiberBiasVal">0.5</span></label>

    </div>
    <div class="control-group">
      <label>Fiber Landing <span id="fiberLandingVal">0</span></label>

    </div>
    <div class="control-group">
      <label>Bow Gradient <span id="bowGradientVal">2</span></label>
      <input type="range" id="bowGradient" value="2" min="0.5" max="6" step="0.1">
    </div>
    <div class="control-group">
      <label>Landing Spread <span id="landingSpreadVal">1</span></label>

    <div class="control-group">
      <label>Cont. Length <span id="continuationLengthVal">20</span></label>

    </div>
    <div class="control-group">
      <label>Cont. Bias <span id="continuationBiasVal">0.7</span></label>

    <div class="control-group">

    </div>
    <details open style="background: #0f3460; padding: 10px; border-radius: 4px;">
      <summary style="cursor: pointer; font-weight: bold; color: #e94560;">End Caps & Spouts</summary>
      <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px;">
        <div class="control-group">
          <label><input type="checkbox" id="enableCaps" checked> Enable Caps</label>
        </div>
        <div class="control-group">
          <label>Cap Count <span id="capFiberCountVal">19</span></label>
          <input type="range" id="capFiberCount" value="19" min="1" max="30" step="1">
        </div>
        <div class="control-group">
          <label>Cap Gather <span id="capGatherLengthVal">10</span></label>
          <input type="range" id="capGatherLength" value="10" min="5" max="50" step="1">
        </div>
        <div class="control-group">
          <label>Spout Count <span id="spoutFiberCountVal">5</span></label>
          <input type="range" id="spoutFiberCount" value="5" min="0" max="15" step="1">
        </div>
        <div class="control-group">
          <label>Spout Length <span id="spoutLengthVal">50</span></label>
          <input type="range" id="spoutLength" value="50" min="10" max="150" step="5">
        </div>
        <div class="control-group">
          <label>Spout Spread <span id="spoutSpreadVal">30</span>°</label>
          <input type="range" id="spoutSpread" value="30" min="0" max="90" step="5">
        </div>
        <div class="control-group">
          <label>Spout Gravity <span id="spoutGravityVal">0.3</span></label>
          <input type="range" id="spoutGravity" value="0.3" min="0" max="1" step="0.1">
        </div>
        <div class="control-group">
          <label><input type="checkbox" id="spoutAtStart"> Spout at Start</label>
        </div>
        <div class="control-group">
          <label>Cap Bow Angle <span id="capBowAngleVal">-5</span>°</label>
          <input type="range" id="capBowAngle" value="-5" min="-180" max="180" step="5">
        </div>
        <div class="control-group">
          <label>Cap Bow Strength <span id="capBowStrengthVal">1.4</span></label>
          <input type="range" id="capBowStrength" value="1.4" min="0" max="3" step="0.1">
        </div>
        <div class="control-group">
          <label>Cap Landing <span id="capLandingDepthVal">0.8</span></label>
          <input type="range" id="capLandingDepth" value="0.8" min="0" max="1" step="0.05">
