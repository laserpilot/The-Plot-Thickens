<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three-Strand Braid - Polygon Clipping Approach</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 20px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #fff;
    }

    .canvas-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .canvas-panel {
      background: #252525;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .canvas-panel h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    canvas {
      display: block;
      width: 100%;
      background: #1a1a1a;
      border-radius: 4px;
      border: 1px solid #333;
    }

    .controls {
      background: #252525;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .controls h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #fff;
    }

    .control-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-item label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #b0b0b0;
    }

    .control-item .value {
      color: #4a9eff;
      font-weight: 600;
      font-family: 'Monaco', 'Courier New', monospace;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #333;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4a9eff;
      cursor: pointer;
      transition: background 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #6bb0ff;
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4a9eff;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    input[type="range"]::-moz-range-thumb:hover {
      background: #6bb0ff;
    }

    .toggles {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      padding-top: 10px;
      border-top: 1px solid #333;
      margin-top: 20px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .toggle-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .toggle-item label {
      font-size: 13px;
      color: #b0b0b0;
      cursor: pointer;
    }

    .phase-indicator {
      display: inline-block;
      padding: 4px 12px;
      background: #4a9eff;
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 10px;
    }

    .stats {
      display: flex;
      gap: 20px;
      padding: 15px;
      background: #1a1a1a;
      border-radius: 4px;
      margin-top: 15px;
      font-size: 12px;
      color: #808080;
      font-family: 'Monaco', 'Courier New', monospace;
    }

    .stats .stat {
      display: flex;
      gap: 6px;
    }

    .stats .stat-label {
      color: #606060;
    }

    .stats .stat-value {
      color: #4a9eff;
      font-weight: 600;
    }

    @media (max-width: 1200px) {
      .canvas-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      Three-Strand Braid - Polygon Clipping
      <span class="phase-indicator" id="phaseIndicator">Phase A</span>
    </h1>

    <div class="canvas-grid">
      <div class="canvas-panel">
        <h2>1. Pre-Clipping (Raw Polygons)</h2>
        <canvas id="canvas1" width="400" height="500"></canvas>
      </div>
      <div class="canvas-panel">
        <h2>2. Post-Clipping (Occlusion Resolved)</h2>
        <canvas id="canvas2" width="400" height="500"></canvas>
      </div>
      <div class="canvas-panel">
        <h2>3. Warped (Final Result)</h2>
        <canvas id="canvas3" width="400" height="500"></canvas>
      </div>
    </div>

    <div class="controls">
      <h2>Controls</h2>

      <div class="control-group">
        <div class="control-item">
          <label>
            <span>Frequency (cycles)</span>
            <span class="value" id="frequencyValue">2.0</span>
          </label>
          <input type="range" id="frequency" min="0.5" max="5" step="0.1" value="2">
        </div>

        <div class="control-item">
          <label>
            <span>Thickness (px)</span>
            <span class="value" id="thicknessValue">20</span>
          </label>
          <input type="range" id="thickness" min="5" max="50" step="1" value="20">
        </div>

        <div class="control-item">
          <label>
            <span>Braid Length (px)</span>
            <span class="value" id="braidLengthValue">400</span>
          </label>
          <input type="range" id="braidLength" min="200" max="800" step="50" value="400">
        </div>

        <div class="control-item">
          <label>
            <span>Segment Angle (degrees)</span>
            <span class="value" id="segmentAngleValue">5</span>
          </label>
          <input type="range" id="segmentAngle" min="1" max="20" step="1" value="5">
        </div>

        <div class="control-item" id="amplitudeControl">
          <label>
            <span>Backbone Amplitude (px)</span>
            <span class="value" id="amplitudeValue">0</span>
          </label>
          <input type="range" id="amplitude" min="0" max="100" step="5" value="0">
        </div>
      </div>

      <div class="toggles">
        <div class="toggle-item">
          <input type="checkbox" id="showWireframes">
          <label for="showWireframes">Show Wireframes</label>
        </div>
        <div class="toggle-item">
          <input type="checkbox" id="showZDepth">
          <label for="showZDepth">Z-Depth Colors</label>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Segments:</span>
          <span class="stat-value" id="segmentCount">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Polygons:</span>
          <span class="stat-value" id="polygonCount">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Render Time:</span>
          <span class="stat-value" id="renderTime">0ms</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/polygon-clipping@0.15.3/dist/polygon-clipping.umd.min.js"></script>
  <script>
    // ========================================
    // Global State
    // ========================================
    const state = {
      params: {
        frequency: 2,
        thickness: 20,
        braidLength: 400,
        segmentAngleDelta: 5,
        backboneAmplitude: 0
      },
      segments: [],
      backbonePath: null,
      visualization: {
        showWireframes: false,
        showZDepth: false
      }
    };

    const STRAND_COLORS = ['#ff4444', '#44ff44', '#4444ff'];
    const STRAND_COLORS_TRANSPARENT = ['rgba(255, 68, 68, 0.3)', 'rgba(68, 255, 68, 0.3)', 'rgba(68, 68, 255, 0.3)'];

    // ========================================
    // Stage 1: Straight Braid Generation
    // ========================================
    function generateStraightBraid(params) {
      const { frequency, braidLength, segmentAngleDelta, thickness } = params;
      const segments = [];

      // Total angle range for all cycles
      const totalAngle = frequency * 2 * Math.PI;
      const angleStep = (segmentAngleDelta * Math.PI) / 180;

      for (let angle = 0; angle < totalAngle; angle += angleStep) {
        const segment = {
          angleStart: angle,
          angleEnd: Math.min(angle + angleStep, totalAngle),
          strands: []
        };

        // Generate all 3 strands for this segment
        for (let strandIndex = 0; strandIndex < 3; strandIndex++) {
          const phase = (strandIndex / 3) * 2 * Math.PI;

          // Sample at segment start and end
          const points = [angle, segment.angleEnd].map(a => {
            const y = (a / totalAngle) * braidLength;
            const x = (thickness * 2) * Math.sin(a + phase);
            const z = Math.cos(a + phase);  // 1 = front, -1 = back
            return { x, y, z };
          });

          segment.strands.push({
            strandIndex,
            centerline: [
              [points[0].x, points[0].y],
              [points[1].x, points[1].y]
            ],
            z: (points[0].z + points[1].z) / 2,  // Average for sorting
            leftEdge: null,
            rightEdge: null,
            polygon: null,
            visiblePolygon: null
          });
        }

        segments.push(segment);
      }

      return segments;
    }

    // ========================================
    // Stage 2: Ribbon Polygon Construction
    // ========================================
    function buildRibbonPolygons(segment, thickness) {
      segment.strands.forEach(strand => {
        const [p0, p1] = strand.centerline;

        // Calculate tangent vector
        const dx = p1[0] - p0[0];
        const dy = p1[1] - p0[1];
        const len = Math.sqrt(dx * dx + dy * dy);

        // Handle degenerate case (zero-length segment)
        if (len < 0.001) {
          strand.leftEdge = [p0, p1];
          strand.rightEdge = [p0, p1];
          strand.polygon = [[p0, p1, p1, p0, p0]];
          return;
        }

        // Normalized tangent
        const tx = dx / len;
        const ty = dy / len;

        // Perpendicular normal (rotate tangent 90° CCW)
        const nx = -ty;
        const ny = tx;

        // Offset by half thickness
        const offset = thickness / 2;

        // Build quad vertices (counter-clockwise winding)
        const leftEdge = [
          [p0[0] + nx * offset, p0[1] + ny * offset],
          [p1[0] + nx * offset, p1[1] + ny * offset]
        ];
        const rightEdge = [
          [p0[0] - nx * offset, p0[1] - ny * offset],
          [p1[0] - nx * offset, p1[1] - ny * offset]
        ];

        strand.leftEdge = leftEdge;
        strand.rightEdge = rightEdge;

        // Closed polygon for clipping (must close the loop)
        strand.polygon = [[
          leftEdge[0],
          leftEdge[1],
          rightEdge[1],
          rightEdge[0],
          leftEdge[0]  // Close the ring
        ]];
      });
    }

    // ========================================
    // Stage 3: Polygon Clipping
    // ========================================
    function performOcclusionClipping(segment) {
      // Sort strands by depth (front to back: high z to low z)
      const sorted = segment.strands.slice().sort((a, b) => b.z - a.z);

      // Front strand is always fully visible
      sorted[0].visiblePolygon = sorted[0].polygon;

      // Middle strand: subtract front strand
      try {
        sorted[1].visiblePolygon = polygonClipping.difference(
          sorted[1].polygon,
          sorted[0].polygon
        );
      } catch (e) {
        console.warn('Clipping error on middle strand:', e);
        sorted[1].visiblePolygon = sorted[1].polygon;
      }

      // Back strand: subtract both front and middle strands
      try {
        let backVisible = sorted[2].polygon;
        backVisible = polygonClipping.difference(backVisible, sorted[0].polygon);
        backVisible = polygonClipping.difference(backVisible, sorted[1].polygon);
        sorted[2].visiblePolygon = backVisible;
      } catch (e) {
        console.warn('Clipping error on back strand:', e);
        sorted[2].visiblePolygon = [];
      }
    }

    // ========================================
    // Stage 4: Warp Transform
    // ========================================
    function createSineBackbone(amplitude, braidLength) {
      return {
        getPointAt(t) {
          // t ∈ [0, 1]
          const y = t * braidLength;
          const x = amplitude * Math.sin(t * 2 * Math.PI * 2); // 2 cycles
          return { x, y };
        },

        getTangentAt(t) {
          const delta = 0.001;
          const t0 = Math.max(0, t - delta);
          const t1 = Math.min(1, t + delta);
          const p0 = this.getPointAt(t0);
          const p1 = this.getPointAt(t1);
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const len = Math.sqrt(dx * dx + dy * dy);
          return { x: dx / len, y: dy / len };
        }
      };
    }

    function warpToBackbone(straightPolygon, params) {
      const { braidLength, backbonePath } = params;

      if (!backbonePath) {
        return straightPolygon; // No warping
      }

      return straightPolygon.map(polygon => {
        return polygon.map(ring => {
          return ring.map(([x, y]) => {
            // Normalize y to parameter t
            const t = Math.max(0, Math.min(1, y / braidLength));

            // Sample backbone
            const P = backbonePath.getPointAt(t);
            const tangent = backbonePath.getTangentAt(t);

            // Normal perpendicular to tangent
            const normal = { x: -tangent.y, y: tangent.x };

            // Map: finalPoint = P(t) + x * N(t)
            return [
              P.x + x * normal.x,
              P.y + x * normal.y
            ];
          });
        });
      });
    }

    // ========================================
    // Rendering
    // ========================================
    function clearCanvas(ctx, width, height) {
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, width, height);
    }

    function renderPolygons(ctx, segments, useVisible, warp, params) {
      const { showWireframes, showZDepth } = state.visualization;
      const width = ctx.canvas.width;
      const height = ctx.canvas.height;

      // Center the view
      ctx.save();
      ctx.translate(width / 2, 50);

      segments.forEach(segment => {
        segment.strands.forEach(strand => {
          const polygons = useVisible ? strand.visiblePolygon : strand.polygon;

          if (!polygons || polygons.length === 0) {
            return; // No geometry to render
          }

          // Determine color
          let color;
          if (showZDepth) {
            const zNorm = (strand.z + 1) / 2; // Map [-1, 1] to [0, 1]
            const hue = 240 - zNorm * 120; // Blue (far) to red (near)
            color = `hsl(${hue}, 80%, 50%)`;
          } else {
            color = useVisible ? STRAND_COLORS[strand.strandIndex] : STRAND_COLORS_TRANSPARENT[strand.strandIndex];
          }

          ctx.fillStyle = color;
          ctx.strokeStyle = '#000';
          ctx.lineWidth = showWireframes ? 1 : 0;

          // Warp if needed
          const finalPolygons = warp ? warpToBackbone(polygons, params) : polygons;

          // Render each polygon
          finalPolygons.forEach(polygon => {
            ctx.beginPath();

            // Each ring in the polygon
            polygon.forEach((ring, ringIndex) => {
              ring.forEach((point, i) => {
                if (i === 0) ctx.moveTo(point[0], point[1]);
                else ctx.lineTo(point[0], point[1]);
              });
              ctx.closePath();
            });

            ctx.fill('evenodd');
            if (showWireframes) {
              ctx.stroke();
            }
          });
        });
      });

      ctx.restore();
    }

    function render() {
      const startTime = performance.now();

      // Get canvases
      const canvas1 = document.getElementById('canvas1');
      const canvas2 = document.getElementById('canvas2');
      const canvas3 = document.getElementById('canvas3');
      const ctx1 = canvas1.getContext('2d');
      const ctx2 = canvas2.getContext('2d');
      const ctx3 = canvas3.getContext('2d');

      // Clear all canvases
      clearCanvas(ctx1, canvas1.width, canvas1.height);
      clearCanvas(ctx2, canvas2.width, canvas2.height);
      clearCanvas(ctx3, canvas3.width, canvas3.height);

      // Panel 1: Pre-clipping (raw polygons)
      renderPolygons(ctx1, state.segments, false, false, state.params);

      // Panel 2: Post-clipping (occlusion resolved, straight)
      renderPolygons(ctx2, state.segments, true, false, state.params);

      // Panel 3: Warped (final result)
      renderPolygons(ctx3, state.segments, true, true, state.params);

      // Update stats
      const endTime = performance.now();
      document.getElementById('segmentCount').textContent = state.segments.length;
      document.getElementById('polygonCount').textContent = state.segments.length * 3;
      document.getElementById('renderTime').textContent = `${(endTime - startTime).toFixed(1)}ms`;
    }

    // ========================================
    // Pipeline Orchestration
    // ========================================
    function regenerate() {
      // Stage 1: Generate straight braid
      state.segments = generateStraightBraid(state.params);

      // Stage 2: Build ribbon polygons
      state.segments.forEach(segment => {
        buildRibbonPolygons(segment, state.params.thickness);
      });

      // Stage 3: Perform clipping
      state.segments.forEach(segment => {
        performOcclusionClipping(segment);
      });

      // Stage 4: Update backbone path if amplitude > 0
      if (state.params.backboneAmplitude > 0) {
        state.backbonePath = createSineBackbone(
          state.params.backboneAmplitude,
          state.params.braidLength
        );
        document.getElementById('phaseIndicator').textContent = 'Phase B';
      } else {
        state.backbonePath = null;
        document.getElementById('phaseIndicator').textContent = 'Phase A';
      }

      // Render
      render();
    }

    // ========================================
    // UI Event Handlers
    // ========================================
    function setupControls() {
      // Frequency
      const frequencySlider = document.getElementById('frequency');
      const frequencyValue = document.getElementById('frequencyValue');
      frequencySlider.addEventListener('input', (e) => {
        state.params.frequency = parseFloat(e.target.value);
        frequencyValue.textContent = state.params.frequency.toFixed(1);
        regenerate();
      });

      // Thickness
      const thicknessSlider = document.getElementById('thickness');
      const thicknessValue = document.getElementById('thicknessValue');
      thicknessSlider.addEventListener('input', (e) => {
        state.params.thickness = parseInt(e.target.value);
        thicknessValue.textContent = state.params.thickness;
        regenerate();
      });

      // Braid Length
      const braidLengthSlider = document.getElementById('braidLength');
      const braidLengthValue = document.getElementById('braidLengthValue');
      braidLengthSlider.addEventListener('input', (e) => {
        state.params.braidLength = parseInt(e.target.value);
        braidLengthValue.textContent = state.params.braidLength;
        regenerate();
      });

      // Segment Angle
      const segmentAngleSlider = document.getElementById('segmentAngle');
      const segmentAngleValue = document.getElementById('segmentAngleValue');
      segmentAngleSlider.addEventListener('input', (e) => {
        state.params.segmentAngleDelta = parseInt(e.target.value);
        segmentAngleValue.textContent = state.params.segmentAngleDelta;
        regenerate();
      });

      // Amplitude
      const amplitudeSlider = document.getElementById('amplitude');
      const amplitudeValue = document.getElementById('amplitudeValue');
      amplitudeSlider.addEventListener('input', (e) => {
        state.params.backboneAmplitude = parseInt(e.target.value);
        amplitudeValue.textContent = state.params.backboneAmplitude;
        regenerate();
      });

      // Wireframes toggle
      const wireframesCheckbox = document.getElementById('showWireframes');
      wireframesCheckbox.addEventListener('change', (e) => {
        state.visualization.showWireframes = e.target.checked;
        render();
      });

      // Z-depth toggle
      const zDepthCheckbox = document.getElementById('showZDepth');
      zDepthCheckbox.addEventListener('change', (e) => {
        state.visualization.showZDepth = e.target.checked;
        render();
      });
    }

    // ========================================
    // Initialization
    // ========================================
    function init() {
      setupControls();
      regenerate();
    }

    // Wait for polygon-clipping library to load
    if (typeof polygonClipping !== 'undefined') {
      init();
    } else {
      window.addEventListener('load', init);
    }
  </script>
</body>
</html>
