<!DOCTYPE html>
<html>
<head>
  <title>Debug Canvas Rendering</title>
  <style>
    body { background: #1a1a1a; color: #fff; padding: 20px; }
    canvas { border: 1px solid #4a9eff; background: #0a0a0a; }
    pre { background: #242424; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Canvas Rendering Debug</h1>
  <canvas id="test-canvas" width="800" height="600"></canvas>
  <h2>Console Output:</h2>
  <pre id="log"></pre>

  <script type="module">
    const canvas = document.getElementById('test-canvas');
    const ctx = canvas.getContext('2d');
    const log = document.getElementById('log');

    function logMsg(msg) {
      console.log(msg);
      log.textContent += msg + '\n';
    }

    logMsg('Canvas: ' + canvas.width + 'x' + canvas.height);

    // Test simple drawing
    ctx.strokeStyle = '#4a9eff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(100, 100);
    ctx.lineTo(700, 100);
    ctx.lineTo(700, 500);
    ctx.lineTo(100, 500);
    ctx.closePath();
    ctx.stroke();

    logMsg('Drew simple rectangle');

    // Test Path2D with SVG path data
    const testPath = 'M 200,200 L 600,200 L 600,400 L 200,400 Z';
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 3;
    const p = new Path2D(testPath);
    ctx.stroke(p);

    logMsg('Drew Path2D: ' + testPath);

    // Test with transform
    ctx.save();
    ctx.translate(400, 300);
    ctx.scale(2, 2);
    ctx.strokeStyle = '#44ff44';
    ctx.lineWidth = 1;
    const p2 = new Path2D('M -50,-50 L 50,-50 L 50,50 L -50,50 Z');
    ctx.stroke(p2);
    ctx.restore();

    logMsg('Drew transformed Path2D');
  </script>
</body>
</html>
