<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plotter Line Thickener - Attractor Mode</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-path-commander@2.0.6/dist/svg-path-commander.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1>Plotter Line Thickener</h1>
      <p>Phase 3: Attractor-Based Weight Control</p>
    </header>

    <!-- Main content -->
    <div class="main-content">
      <!-- Controls Panel -->
      <aside class="controls-panel">
        <section class="control-group">
          <h3>File Input</h3>
          <input type="file" id="svg-upload" accept=".svg">
          <div id="svg-info" style="display: none; margin: 0.5rem 0; padding: 0.5rem; background: #f0f8ff; border-radius: 4px; font-size: 0.85rem;">
            <p id="path-count-info" style="margin: 0 0 0.5rem 0;"></p>
            <button id="process-paths" class="primary-button">Process Paths</button>
          </div>
          <button id="clear-svg">Clear</button>
        </section>

        <section class="control-group">
          <h3>Weight Mode</h3>

          <label>
            <input type="radio" name="weight-mode" value="length" checked>
            Length-based (longer paths = thicker)
          </label>

          <label>
            <input type="radio" name="weight-mode" value="attractor">
            Attractor-based (click canvas to place)
          </label>
        </section>

        <section class="control-group attractor-controls" style="display: none;">
          <h3>Attractors</h3>
          <p class="hint">Click canvas to place attractors</p>
          <button id="clear-attractors">Clear All Attractors</button>
          <div id="attractor-list"></div>
        </section>

        <section class="control-group attractor-controls" style="display: none;">
          <h3>Attractor Settings</h3>

          <label>
            Mode:
            <select id="attractor-mode">
              <option value="attract">Attract (closer = thicker)</option>
              <option value="repel">Repel (closer = thinner)</option>
            </select>
          </label>

          <label>
            Strength:
            <input type="range" id="strength" min="0" max="2" step="0.1" value="1">
            <span id="strength-value">1.0</span>
          </label>

          <label>
            Falloff Radius (mm):
            <input type="range" id="falloff-radius" min="10" max="200" step="5" value="50">
            <span id="falloff-radius-value">50</span>
          </label>

          <label>
            Falloff Curve:
            <select id="falloff-curve">
              <option value="linear">Linear</option>
              <option value="exponential">Exponential</option>
              <option value="inverse-square">Inverse Square</option>
            </select>
          </label>

          <label>
            Multiple Attractor Mode:
            <select id="multi-mode">
              <option value="additive">Additive</option>
              <option value="strongest">Strongest Only</option>
              <option value="average">Average</option>
            </select>
          </label>
        </section>

        <section class="control-group">
          <h3>Line Weight Settings</h3>

          <label>
            Base Offset (mm):
            <input type="range" id="base-offset" min="0.01" max="3" step="0.05" value="0.2">
            <span id="base-offset-value">0.2</span>
          </label>

          <label>
            Noise (mm):
            <input type="range" id="noise" min="0" max="3" step="0.05" value="0.1">
            <span id="noise-value">0.1</span>
          </label>

          <label>
            Min Passes:
            <input type="range" id="min-passes" min="1" max="10" step="1" value="1">
            <span id="min-passes-value">1</span>
          </label>

          <label>
            Max Passes:
            <input type="range" id="max-passes" min="5" max="50" step="1" value="20">
            <span id="max-passes-value">20</span>
          </label>

          <label title="Paths shorter than this get minimum passes">
            Min Length Threshold (mm):
            <input type="number" id="min-length-threshold" min="0" step="10" value="0" placeholder="Auto">
            <span id="min-length-info" style="font-size: 0.8em; color: #666;"></span>
          </label>

          <label title="Paths longer than this get maximum passes">
            Max Length Threshold (mm):
            <input type="number" id="max-length-threshold" min="0" step="10" value="0" placeholder="Auto">
            <span id="max-length-info" style="font-size: 0.8em; color: #666;"></span>
          </label>
        </section>

        <section class="control-group">
          <h3>Display</h3>

          <label>
            <input type="checkbox" id="preview-mode" checked>
            Preview Weight (color-coded)
          </label>

          <div class="attractor-controls" style="display: none;">
            <label>
              <input type="checkbox" id="show-attractors" checked>
              Show Attractors
            </label>

            <label>
              <input type="checkbox" id="show-influence" checked>
              Show Influence Field
            </label>
          </div>
        </section>

        <section class="control-group">
          <h3>Export</h3>
          <button id="export-svg" class="primary-button">Export SVG</button>
          <button id="save-preset">Save Preset</button>
          <button id="load-preset">Load Preset</button>
          <input type="file" id="preset-upload" accept=".json" style="display: none;">
        </section>
      </aside>

      <!-- Canvas Area -->
      <main class="canvas-area">
        <div id="p5-container"></div>
        <div class="canvas-info">
          <span id="canvas-status">Load an SVG to begin</span>
        </div>
        <!-- Loading Spinner -->
        <div id="loading-spinner" style="display: none;">
          <div class="spinner"></div>
          <p>Processing SVG paths...</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="offset-utils.js"></script>
  <script src="attractor.js"></script>
  <script src="svg-parser.js"></script>
  <script src="sketch.js"></script>
  <script src="ui-controls.js"></script>
</body>
</html>
